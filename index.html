<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anu - The Ludo Queen 🏆</title>
<style>
    body {
        margin: 0;
        background: #1a1a1a;
        color: white;
        font-family: 'Poppins', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow-x: hidden;
    }

    .story-container {
        text-align: center;
        padding: 20px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        backdrop-filter: blur(10px);
        border: 2px solid #ff4d6d;
        width: 90%;
        max-width: 500px;
    }

    .ludo-img {
        width: 100%;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(255, 77, 109, 0.5);
        margin-bottom: 20px;
    }

    h1 {
        color: #ff4d6d;
        font-size: 2.5rem;
        margin-bottom: 10px;
        text-shadow: 2px 2px #000;
    }

    .celebration-text {
        font-size: 1.2rem;
        line-height: 1.6;
        margin-bottom: 20px;
    }

    .btn-win {
        background: #ff4d6d;
        color: white;
        border: none;
        padding: 15px 30px;
        font-size: 1.2rem;
        border-radius: 50px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
        box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
    }

    .btn-win:hover {
        transform: scale(1.1);
        background: #ff0040;
    }

    /* Confetti Style */
    .confetti {
        position: fixed;
        width: 10px;
        height: 10px;
        background-color: #f00;
        z-index: 1000;
    }
</style>
</head>
<body>

<div class="story-container">
    <img src="YOUR_IMAGE_LINK_HERE" alt="Anu Winning Ludo" class="ludo-img">
    
    <h1>HURRAY! ANU JEET GAI 🏆</h1>
    
    <div class="celebration-text">
        Coaching mein 4 saheliyan, Ludo ki baazi... <br>
        Sab ko hara kar, <b>Anu</b> bani aaj ki winner! 😎
    </div>

    <button class="btn-win" onclick="startHurray()">Click for Hurray! 🎉</button>
</div>

<script>
    function startHurray() {
        alert("Anu: HURRAYYY! Main Jeet Gai! 💃✨");
        for(let i=0; i<100; i++) {
            createConfetti();
        }
    }

    function createConfetti() {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.backgroundColor = '#' + Math.floor(Math.random()*16777215).toString(16);
        confetti.style.top = '-10px';
        confetti.style.borderRadius = '50%';
        confetti.style.opacity = Math.random();
        
        document.body.appendChild(confetti);

        const animation = confetti.animate([
            { transform: 'translateY(0) rotate(0)', opacity: 1 },
            { transform: `translateY(100vh) rotate(${Math.random() * 360}deg)`, opacity: 0 }
        ], {
            duration: Math.random() * 3000 + 2000,
            easing: 'ease-out'
        });

        animation.onfinish = () => confetti.remove();
    }
</script>

</body>
</html>
