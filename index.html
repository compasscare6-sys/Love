<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catch My Love, Anusha! ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght=700&family=Poppins:wght=400;600&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #090310; font-family: 'Poppins', sans-serif;
            overflow: hidden; color: #fff; -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-select: none;
        }

        /* GAME SCREEN LAYER */
        #game-stage {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; background: radial-gradient(circle at center, #1b0722 0%, #07020d 100%); touch-action: none;
            display: flex; flex-direction: column; align-items: center;
        }
        .game-header { text-align: center; margin-top: 30px; z-index: 105; }
        .game-title { font-family: 'Dancing Script', cursive; font-size: 2.8rem; color: #ffbd59; text-shadow: 0 0 15px rgba(255,189,89,0.5); }
        .game-instruction { font-size: 0.8rem; color: #ff4071; letter-spacing: 2px; font-weight: 500; text-transform: uppercase; margin-top: 5px; }
        
        .score-board {
            font-size: 1.4rem; font-weight: 600; color: #fff;
            background: rgba(255, 255, 255, 0.08); padding: 5px 20px;
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); margin-top: 15px;
        }

        #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 102; }

        /* CELEBRATION WIN SCREEN */
        #reward-stage {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; background: radial-gradient(circle, #2d0b1e, #0b0512);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; transform: scale(0.9); transition: all 1s ease-in-out;
            pointer-events: none; padding: 20px; box-sizing: border-box;
        }
        #reward-stage.reveal { opacity: 1; transform: scale(1); pointer-events: auto; }

        .love-message {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            text-align: center;
            color: #ffbd59;
            text-shadow: 0 0 25px rgba(255, 189, 89, 0.8), 0 0 50px rgba(255, 64, 113, 0.5);
            line-height: 1.4;
            animation: heartBeat 1.2s infinite alternate ease-in-out;
            max-width: 90%;
        }

        @keyframes heartBeat {
            from { transform: scale(0.95); }
            to { transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <!-- GAMEPLAY AREA -->
    <div id="game-stage">
        <div class="game-header">
            <div class="game-title">Catch My Hearts, Jaan! 🧸</div>
            <div class="game-instruction">Basket move karo aur 100 Points banao ✨</div>
            <center><div class="score-board">Score: <span id="score-val">0</span> / 100</div></center>
        </div>
        <canvas id="game-canvas"></canvas>
    </div>

    <!-- CELEBRATION DISCO SCREEN -->
    <div id="reward-stage">
        <div class="love-message">
            "I Love You Meri Jaan Umaahhhh Umaaaaahhh" 💋❤️
        </div>
    </div>

    <audio id="loveSong" loop>
        <source src="Jaan Ban Gaye - Khuda Haafiz.mp3.mp3" type="audio/mpeg">
    </audio>

    <script>
        let score = 0;
        let gameActive = true;
        let isAudioPlaying = false;

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Basket Dimensions (Proper Woven Basket Simulation Look)
        const basket = {
            x: canvas.width / 2 - 50,
            y: canvas.height - 110,
            width: 100,
            height: 45
        };

        let hearts = [];
        const heartTypes = ['❤️', '💖', '💘', '💝', '💋'];

        // Confetti particles for victory blast
        let confetti = [];

        function spawnHeart() {
            if (!gameActive) return;
            hearts.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: -30,
                speed: Math.random() * 3 + 3.5,
                text: heartTypes[Math.floor(Math.random() * heartTypes.length)],
                size: Math.random() * 8 + 26
            });
            setTimeout(spawnHeart, 650);
        }

        function drawBasket(x, y, w, h) {
            // Basket Rim Top rim border line
            ctx.beginPath();
            ctx.roundRect(x, y, w, 8, 4);
            ctx.fillStyle = '#e69c24';
            ctx.fill();

            // Basket Main Body (Trapezoid / Curved look)
            ctx.beginPath();
            ctx.moveTo(x + 5, y + 8);
            ctx.lineTo(x + w - 5, y + 8);
            ctx.lineTo(x + w - 15, y + h);
            ctx.lineTo(x + 15, y + h);
            ctx.closePath();
            
            // Woven Texture Gradient fill style
            let gridGrad = ctx.createLinearGradient(x, y, x, y + h);
            gridGrad.addColorStop(0, '#c67a13');
            gridGrad.addColorStop(1, '#844e05');
            ctx.fillStyle = gridGrad;
            ctx.fill();

            // Simple Woven Cross Lines (Proper Basket Look)
            ctx.strokeStyle = 'rgba(0,0,0,0.18)';
            ctx.lineWidth = 2;
            for(let i = 15; i < w - 15; i += 15) {
                ctx.beginPath();
                ctx.moveTo(x + i, y + 8);
                ctx.lineTo(x + i - 5, y + h);
                ctx.stroke();
            }
        }

        function updateGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameActive) {
                // Render Proper Basket Graphic
                drawBasket(basket.x, basket.y, basket.width, basket.height);

                // Handle Hearts Falling logic
                for (let i = 0; i < hearts.length; i++) {
                    let h = hearts[i];
                    h.y += h.speed;

                    ctx.font = `${h.size}px serif`;
                    ctx.textAlign = 'center';
                    ctx.fillText(h.text, h.x, h.y);

                    // Basket Intersection Box Detection
                    if (h.y >= basket.y && h.y <= basket.y + 20 && h.x >= basket.x && h.x <= basket.x + basket.width) {
                        hearts.splice(i, 1);
                        i--;
                        score += 10;
                        document.getElementById('score-val').innerText = score;

                        if (!isAudioPlaying) {
                            document.getElementById('loveSong').play().catch(e => console.log("Audio live"));
                            isAudioPlaying = true;
                        }

                        if (score >= 100) {
                            gameActive = false;
                            initConfetti();
                            endGameAndReveal();
                        }
                        continue;
                    }

                    if (h.y > canvas.height) {
                        hearts.splice(i, 1);
                        i--;
                    }
                }
            } else {
                // Render Confetti explosion loop when won
                for (let i = 0; i < confetti.length; i++) {
                    let p = confetti[i];
                    p.y += p.speed;
                    p.x += Math.sin(p.angle) * 1;
                    p.angle += 0.05;

                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();

                    if (p.y > canvas.height) p.y = -10;
                }
            }

            requestAnimationFrame(updateGame);
        }

        function moveBasket(e) {
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            basket.x = clientX - basket.width / 2;
            
            if (basket.x < 5) basket.x = 5;
            if (basket.x > canvas.width - basket.width - 5) basket.x = canvas.width - basket.width - 5;
        }

        window.addEventListener('mousemove', moveBasket);
        window.addEventListener('touchmove', moveBasket, { passive: true });

        function initConfetti() {
            const colors = ['#ff4071', '#ffbd59', '#ff8da9', '#05ae8b', '#ffffff'];
            for (let i = 0; i < 80; i++) {
                confetti.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 5 + 4,
                    speed: Math.random() * 3 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    angle: Math.random() * 6
                });
            }
        }

        function endGameAndReveal() {
            const stage = document.getElementById('game-stage');
            // Move canvas to the reward background layer to keep confetti running
            document.getElementById('reward-stage').appendChild(canvas);
            canvas.style.pointerEvents = 'none';

            stage.style.transition = 'opacity 0.8s ease-out';
            stage.style.opacity = '0';
            
            setTimeout(() => {
                stage.remove();
                document.getElementById('reward-stage').classList.add('reveal');
            }, 800);
        }

        window.onload = () => {
            spawnHeart();
            updateGame();
        };
    </script>
</body>
</html>
