<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anu's Universe</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #050505;
            font-family: 'Poppins', sans-serif;
        }

        canvas { display: block; }

        /* Overlay Styling */
        #overlay {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center; z-index: 100;
            background: rgba(0, 0, 0, 0.6);
            padding: 40px; border-radius: 50%;
            border: 1px solid rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(10px);
            transition: 1s opacity;
        }

        .title {
            font-family: 'Great Vibes', cursive;
            color: #d4af37; font-size: 3.5rem; margin: 0;
            text-shadow: 0 0 15px #d4af37;
        }

        input {
            background: transparent; border: none;
            border-bottom: 2px solid #d4af37; color: #fff;
            width: 60px; font-size: 2rem; text-align: center;
            margin: 20px 0; outline: none;
        }

        #message-box {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: none; text-align: center; z-index: 200;
            width: 80%; max-width: 600px;
        }

        .typing-text {
            color: #fce4ec; font-size: 1.5rem;
            line-height: 1.8; text-shadow: 0 0 10px rgba(255,192,203,0.5);
        }

        .btn-magic {
            background: transparent; color: #d4af37;
            border: 1px solid #d4af37; padding: 10px 25px;
            border-radius: 20px; cursor: pointer; margin-top: 20px;
            transition: 0.3s; text-transform: uppercase; letter-spacing: 2px;
        }

        .btn-magic:hover { background: #d4af37; color: #000; }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div id="overlay">
        <h1 class="title">Anu</h1>
        <p style="color: #888; font-size: 0.8rem; letter-spacing: 2px;">ENTER THE MAGIC KEY</p>
        <input type="password" id="pass" maxlength="2" placeholder="??">
        <br>
        <button class="btn-magic" onclick="unlock()">Unlock</button>
    </div>

    <div id="message-box">
        <div class="typing-text" id="text"></div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        class Particle {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 3 - 1.5;
                this.speedY = Math.random() * 3 - 1.5;
                this.color = `rgba(212, 175, 55, ${Math.random()})`;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.size > 0.1) this.size -= 0.02;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function handleParticles() {
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].size <= 0.1) {
                    particles.splice(i, 1); i--;
                }
            }
        }

        window.addEventListener('mousemove', (e) => {
            for (let i = 0; i < 5; i++) particles.push(new Particle(e.x, e.y));
        });

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            handleParticles();
            requestAnimationFrame(animate);
        }
        animate();

        // Unlock Logic
        function unlock() {
            const val = document.getElementById('pass').value;
            if (val === "23") {
                document.getElementById('overlay').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('overlay').style.display = 'none';
                    startMessage();
                }, 1000);
            } else {
                alert("Only my Queen knows the number...");
            }
        }

        function startMessage() {
            const box = document.getElementById('message-box');
            const textEl = document.getElementById('text');
            box.style.display = 'block';
            
            const msg = "Iss puri kaaynat mein, mere liye sabse bada sitara aap ho. ✨\n\nMain lafzon mein nahi keh sakta ke aap mere liye kya ho. Bas hamesha mere saath rehna, kyunke meri har khushi aap se shuru hoti hai. ❤️\n\n- Yours Forever";
            let i = 0;

            function type() {
                if (i < msg.length) {
                    textEl.innerHTML += msg.charAt(i) === '\n' ? '<br>' : msg.charAt(i);
                    i++;
                    setTimeout(type, 50);
                }
            }
            type();
        }
    </script>
</body>
</html>
