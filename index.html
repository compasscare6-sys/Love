<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I am Sorry Anu ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;600&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; overflow: hidden;
            font-family: 'Poppins', sans-serif;
            display: flex; justify-content: center; align-items: center;
        }

        /* Romantic Background Gradient */
        .bg {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #4b0000 0%, #000 100%);
            z-index: -1;
        }

        /* The Main Card */
        #card {
            text-align: center; color: white; z-index: 10;
            padding: 30px; border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 51, 102, 0.3);
            width: 85%; max-width: 400px;
            box-shadow: 0 0 50px rgba(255, 51, 102, 0.2);
            transition: 1s;
        }

        h1 { font-family: 'Dancing Script', cursive; font-size: 3.5rem; color: #ff3366; margin: 0; }
        p { font-size: 1.1rem; margin: 20px 0; line-height: 1.6; letter-spacing: 0.5px; }

        /* The Big Heart Button */
        .heart-btn {
            font-size: 50px; background: none; border: none;
            cursor: pointer; animation: pulse 1.5s infinite;
            filter: drop-shadow(0 0 10px #ff3366);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Floating Kiss Emojis */
        .kiss {
            position: absolute; font-size: 25px;
            pointer-events: none; animation: fly 4s linear forwards;
            z-index: 100;
        }

        @keyframes fly {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .forgive-btn {
            background: #ff3366; color: white; border: none;
            padding: 12px 30px; border-radius: 50px;
            font-weight: 600; cursor: pointer; margin-top: 20px;
            transition: 0.3s;
        }
        .forgive-btn:hover { background: #ff0044; transform: scale(1.1); }

    </style>
</head>
<body>

    <div class="bg"></div>

    <audio id="loveSong" loop>
        <source src="Jaan Ban Gaye - Khuda Haafiz.mp3.mp3" type="audio/mpeg">
    </audio>

    <div id="card">
        <h1>I'm Sorry Anu ❤️</h1>
        <p>Mera maqsad aapka dil dukhana nahi tha, <br> bas thodi na-samjhi ho gayi... <br><br>
        Aap naraz hoti ho toh duniya suni lagti hai. <br>
        <b>Kya apne "Kaley" ko maaf karogi?</b></p>
        
        <button class="heart-btn" onclick="startRomance()">❤️</button>
        <br>
        <small style="opacity: 0.6;">(Tap the heart to hear my heart)</small>
    </div>

    <script>
        function startRomance() {
            // Play Music
            const audio = document.getElementById('loveSong');
            audio.play();

            // Change Text
            const card = document.getElementById('card');
            card.innerHTML = `
                <h1 style="font-size: 4rem;">Thank You! 💋</h1>
                <p style="font-size: 1.3rem;">Ab gussa khatam? <br> Ab jaldi se wo <b>Wali Kiss</b> chahiye mujhse! <br><br> 
                I Love You Meri Jaan! ❤️</p>
                <div style="font-size: 50px;">💏</div>
                <p style="font-size: 0.8rem; font-style: italic;">Hamesha ke liye sirf aapka,<br><b>Kala Paplat</b></p>
            `;

            // Start Kiss Shower
            setInterval(createKiss, 200);
        }

        function createKiss() {
            const kiss = document.createElement('div');
            kiss.classList.add('kiss');
            const icons = ['💋', '❤️', '😘', '🌹'];
            kiss.innerText = icons[Math.floor(Math.random() * icons.length)];
            kiss.style.left = Math.random() * 100 + "vw";
            kiss.style.top = "100vh";
            kiss.style.duration = (Math.random() * 2 + 3) + "s";
            document.body.appendChild(kiss);

            setTimeout(() => {
                kiss.remove();
            }, 4000);
        }
    </script>
</body>
</html>
