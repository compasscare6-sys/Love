<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>For My Begum 👑</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      touch-action: manipulation;
    }

    body {
      background: linear-gradient(135deg, #180325 0%, #4a0e2e 50%, #881337 100%);
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border: 1.5px solid rgba(251, 113, 133, 0.4);
      border-radius: 30px;
      width: 100%;
      max-width: 360px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      position: relative;
    }

    .emoji-head {
      font-size: 3.8rem;
      margin-bottom: 10px;
      animation: bounce 1.2s infinite alternate;
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }

    .title {
      font-family: 'Caveat', cursive;
      font-size: 2.8rem;
      color: #fb7185;
      line-height: 1.1;
    }

    .sub-title {
      font-size: 1rem;
      color: #fbcfe8;
      margin: 12px 0 25px 0;
    }

    .btn-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      min-height: 80px;
      position: relative;
    }

    .btn-yes {
      background: linear-gradient(135deg, #fb7185, #e11d48);
      color: #fff;
      border: none;
      padding: 14px 24px;
      border-radius: 25px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(225, 29, 72, 0.5);
      z-index: 2;
    }

    .btn-no {
      background: rgba(255, 255, 255, 0.15);
      color: #fecdd3;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 14px 20px;
      border-radius: 25px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      position: absolute;
      transition: all 0.15s ease;
      z-index: 10;
    }

    /* Love Popup */
    .popup {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.93);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .popup.active {
      opacity: 1;
      pointer-events: auto;
    }

    .popup-box {
      background: #fff;
      color: #881337;
      border-radius: 28px;
      padding: 30px 20px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      border: 3px dashed #fda4af;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .kiss-text {
      font-size: 1.5rem;
      font-weight: 800;
      color: #be123c;
      margin: 15px 0;
      line-height: 1.4;
    }

    .particle {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
      animation: floatUp 3s ease-out forwards;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-100vh) scale(1.6); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <div class="emoji-head">😜👑</div>
    <h1 class="title">Suno Begum Sahiba!</h1>
    <p class="sub-title">Kya aap mujhse abhi ke abhi behad pyaar karti ho?</p>

    <div class="btn-wrap">
      <button class="btn-yes" onclick="showLove()">Haan Bohat Ziada! ❤️</button>
      <button class="btn-no" id="noBtn" onmouseover="dodge()" onclick="dodge()">Nahi Karti 😜</button>
    </div>
  </div>

  <!-- POPUP -->
  <div class="popup" id="lovePopup">
    <div class="popup-box">
      <div style="font-size: 3.5rem;">💋😘💖</div>
      <div class="kiss-text">
        Muahhhh! <br>
        I LOVE YOU SO MUCH MY BEGUM! ❤️
      </div>
      <p style="font-size: 0.9rem; color: #4c0519; font-weight: 700;">(Mera chota sa wairey/chiprey jaisa baby) 🙈</p>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');

    function dodge() {
      const card = document.getElementById('mainCard');
      const rect = card.getBoundingClientRect();
      
      const maxX = rect.width - noBtn.offsetWidth - 20;
      const maxY = rect.height - noBtn.offsetHeight - 20;

      const randomX = Math.floor(Math.random() * maxX) - (maxX / 2);
      const randomY = Math.floor(Math.random() * maxY) - (maxY / 2);

      noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
    }

    function showLove() {
      document.getElementById('lovePopup').classList.add('active');
      triggerRain(40);
    }

    function triggerRain(count) {
      const symbols = ['💋', '💖', '🌹', '✨', '💕', '😘'];
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const p = document.createElement('div');
          p.className = 'particle';
          p.innerText = symbols[Math.floor(Math.random() * symbols.length)];
          p.style.left = Math.random() * 100 + 'vw';
          p.style.bottom = '0px';
          p.style.fontSize = (Math.random() * 20 + 20) + 'px';
          document.body.appendChild(p);

          setTimeout(() => p.remove(), 3000);
        }, i * 40);
      }
    }
  </script>

</body>
</html>
