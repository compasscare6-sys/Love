<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anu Please Maan Jao! 🥺</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;600&display=swap');

        body {
            margin: 0;
            background: #1a1a1a;
            color: white;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 2px solid #ff4d4d;
            box-shadow: 0 0 20px rgba(255, 77, 77, 0.5);
            width: 85%;
            max-width: 400px;
            position: relative;
        }

        h1 { font-family: 'Dancing Script', cursive; font-size: 2.5rem; color: #ff4d4d; }
        p { font-size: 1.1rem; }

        .btn-container {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
            height: 50px;
        }

        button {
            padding: 10px 25px;
            border-radius: 25px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        #yesBtn { background: #4CAF50; color: white; }
        
        /* Funny Button */
        #noBtn { 
            background: #ff4d4d; 
            color: white; 
            position: absolute;
        }

        .success-msg {
            display: none;
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .emoji { font-size: 50px; }
    </style>
</head>
<body>

    <div class="container" id="mainBox">
        <div id="askSection">
            <div class="emoji">🥺👉👈</div>
            <h1>Sorry Na Anu Jaan!</h1>
            <p>Kal raat ke gusse ke liye kaan pakad ke sorry. Kya aapne mujhe maaf kiya?</p>
            
            <div class="btn-container">
                <button id="yesBtn" onclick="maafKiya()">Haan, Maaf Kiya ❤️</button>
                <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">Bilkul Nahi! 😡</button>
            </div>
        </div>

        <div id="successSection" class="success-msg">
            <div class="emoji">🥳💃❤️</div>
            <h1>Yaaaaay!</h1>
            <p>I promise ab gussa nahi karunga (sirf thoda sa pyar karunga). Chalo ab jaldi se ek smile do! 😊</p>
            <p style="color: #ffd700;">I Love You, My Queen! 👑</p>
        </div>
    </div>

    <script>
        function moveButton() {
            const btn = document.getElementById('noBtn');
            // Button screen ke andar hi rahe isliye limits
            const x = Math.random() * (window.innerWidth - btn.offsetWidth - 50);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight - 50);
            
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function maafKiya() {
            document.getElementById('askSection').style.display = 'none';
            document.getElementById('successSection').style.display = 'block';
            document.getElementById('mainBox').style.borderColor = '#4CAF50';
            
            // Background me dil girane ke liye
            for(let i=0; i<30; i++) {
                createHeart();
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '❤️';
            heart.style.position = 'fixed';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '-20px';
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            heart.style.animation = `fall ${Math.random() * 3 + 2}s linear forwards`;
            document.body.appendChild(heart);
            
            setTimeout(() => heart.remove(), 5000);
        }

        // CSS for falling hearts
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes fall {
                to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
