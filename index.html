<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Queen Anu</title>
    <style>
        body {
            background: #fce4ec;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
            z-index: 10;
        }

        h2 { color: #d81b60; margin-bottom: 20px; }
        
        input {
            padding: 10px;
            width: 80%;
            border: 2px solid #f8bbd0;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 1rem;
        }

        .btn {
            background: #d81b60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover { background: #ad1457; transform: scale(1.05); }

        /* Hidden Sections */
        #mainSurprise, .mood-buttons { display: none; }

        .mood-btn {
            display: block;
            width: 100%;
            margin: 10px 0;
            background: #f06292;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        #displayMessage {
            margin-top: 20px;
            padding: 15px;
            background: #fff5f8;
            border-left: 5px solid #d81b60;
            color: #555;
            font-style: italic;
            display: none;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="box" id="lockScreen">
        <div style="font-size: 50px;">🔒</div>
        <h2>Unlock Your Surprise</h2>
        <p style="color: #888;">Enter your Birthday (DDMM)</p>
        <input type="number" id="passInput" placeholder="e.g. 2303">
        <br>
        <button class="btn" onclick="checkPass()">Unlock</button>
    </div>

    <div class="box" id="mainSurprise">
        <div style="font-size: 50px;">✨</div>
        <h2>Hello, Queen Anu!</h2>
        <p>Aapke liye kuch "Open When" gifts hain. Jab aapka dil kare, click karein:</p>
        
        <div class="mood-buttons" style="display: block;">
            <button class="mood-btn" onclick="showMessage('hug')">Open when you want a hug 🤗</button>
            <button class="mood-btn" onclick="showMessage('tired')">Open when you are tired ☕</button>
            <button class="mood-btn" onclick="showMessage('smile')">Open when you want to smile 😊</button>
        </div>

        <div id="displayMessage"></div>
    </div>

    <script>
        function checkPass() {
            const pass = document.getElementById('passInput').value;
            if(pass === "2303") {
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('mainSurprise').style.display = 'block';
            } else {
                alert("Galat Password! Sochiye aapka sabse khaas din kaunsa hai?");
            }
        }

        function showMessage(type) {
            const msgBox = document.getElementById('displayMessage');
            msgBox.style.display = 'block';
            
            let message = "";
            if(type === 'hug') {
                message = "Main hamesha aapke saath hoon. Bas aankhein band karein aur mehsoos karein, mera sabse warm hug aapke liye! ❤️";
            } else if(type === 'tired') {
                message = "Aap din bhar itna kaam karti hain, thoda rest karein. Aaj ki chai/coffee meri taraf se! ☕✨";
            } else if(type === 'smile') {
                message = "Aapki hansi meri favourite cheez hai. Aap jaisi koi aur nahi hai, you are truly one in a million! ✨👑";
            }
            
            msgBox.innerText = message;
        }
    </script>
</body>
</html>
