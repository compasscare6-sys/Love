<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Balloon Archer: Pop the Love 🎈🏹</title>
    <style>
        :root {
            --bg-dark: #0d0614;
            --panel-bg: rgba(33, 17, 48, 0.85);
            --gold: #f59e0b;
            --pink: #ec4899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: radial-gradient(circle at center, #2e1047 0%, var(--bg-dark) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            color: #fff;
            overflow: hidden;
            touch-action: none;
        }

        .game-container {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(236, 72, 153, 0.2);
            border-radius: 24px;
            width: 100%;
            max-width: 390px;
            padding: 15px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            text-align: center;
            position: relative;
        }

        header h1 {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(to right, #f472b6, #fbbf24, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
        }

        header p {
            font-size: 11px;
            color: #cbd5e1;
            margin-bottom: 10px;
        }

        .score-box {
            display: inline-block;
            background: rgba(255, 255, 255, 0.06);
            padding: 6px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            border: 1px solid rgba(255,255,255,0.15);
            margin-bottom: 12px;
        }
        .score-box span { color: var(--gold); font-size: 16px; }

        /* PLAYING FIELD */
        .game-field {
            width: 100%;
            height: 400px;
            background: rgba(10, 3, 18, 0.7);
            border-radius: 16px;
            border: 2px solid #4c1d95;
            position: relative;
            overflow: hidden;
            margin-bottom: 5px;
            cursor: crosshair;
        }

        /* BOW / LAUNCHER (ANCHORED AT BOTTOM CENTER) */
        .bow {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            z-index: 10;
            pointer-events: none;
            transition: transform 0.1s ease-out;
        }

        /* GAME ELEMENTS */
        .balloon {
            position: absolute;
            font-size: 38px;
            cursor: pointer;
            pointer-events: none;
            transition: transform 0.1s ease;
        }

        .arrow {
            position: absolute;
            font-size: 24px;
            width: 20px;
            height: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }

        .heart-pop {
            position: absolute;
            font-size: 18px;
            pointer-events: none;
            animation: popScatter 0.6s ease-out forwards;
        }

        @keyframes popScatter {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0.4); opacity: 0; }
        }

        /* WIN MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 3, 15, 0.96);
            backdrop-filter: blur(15px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-content {
            background: linear-gradient(145deg, #31134a, #0d0614);
            border: 2px solid rgba(236, 72, 153, 0.3);
            border-radius: 28px;
            max-width: 350px;
            width: 100%;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.8);
            animation: scaleUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes scaleUp {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-title { color: var(--gold); font-size: 22px; margin-bottom: 12px; font-weight: 800; }
        .modal-msg { font-size: 15px; color: #e2d8f0; line-height: 1.6; margin-bottom: 22px; text-align: justify; }
        .btn-action {
            background: linear-gradient(135deg, var(--pink), var(--gold));
            color: white; border: none; padding: 11px 32px; border-radius: 50px;
            font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 5px 15px rgba(236, 72, 153, 0.4);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <header>
            <h1>Balloon Archer 🏹🎈</h1>
            <p>Tap anywhere inside the field to shoot arrows!</p>
        </header>

        <div class="score-box">Score: <span id="score-txt">0</span> / 1000</div>

        <div class="game-field" id="field">
            <div class="bow" id="bow">🏹</div>
        </div>
    </div>

    <div class="modal" id="win-modal">
        <div class="modal-content">
            <h2 class="modal-title">For My Beautiful Wife 👑🌸</h2>
            <p class="modal-msg">Subah subah se kam kar kar ke thak gai hogii thora relief mila hoga is game se apko Janu.  I Missed you Very Much Guriya Umaaah Umaaaah</p>
            <button class="btn-action" onclick="resetGame()">Play Again 🔄</button>
        </div>
    </div>

    <script>
        const field = document.getElementById('field');
        const scoreTxt = document.getElementById('score-txt');
        const winModal = document.getElementById('win-modal');
        const bow = document.getElementById('bow');

        let score = 0;
        let gameActive = true;
        let balloons = [];
        let arrows = [];

        const balloonEmojis = ['🎈', '💖', '🎈', '❤️', '🎈', '🌸'];

        field.addEventListener('pointerdown', (e) => {
            if (!gameActive) return;

            const rect = field.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            if (clickY > rect.height - 30) return;

            const angle = Math.atan2(clickY - (rect.height - 20), clickX - (rect.width / 2)) * 180 / Math.PI;
            bow.style.transform = `translateX(-50%) rotate(${angle + 90}deg)`;

            spawnArrow(clickX, clickY);
        });

        function spawnArrow(targetX, targetY) {
            const rect = field.getBoundingClientRect();
            const arrow = document.createElement('div');
            arrow.classList.add('arrow');
            arrow.innerText = '💘';
            
            const startX = rect.width / 2 - 10;
            const startY = rect.height - 40;
            
            arrow.style.left = startX + 'px';
            arrow.style.top = startY + 'px';
            field.appendChild(arrow);

            const dx = targetX - startX;
            const dy = targetY - startY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const speed = 12;
            const vx = (dx / distance) * speed;
            const vy = (dy / distance) * speed;

            const arrowObj = { element: arrow, x: startX, y: startY, vx: vx, vy: vy };
            arrows.push(arrowObj);
        }

        function spawnBalloon() {
            if (!gameActive) return;

            const balloon = document.createElement('div');
            balloon.classList.add('balloon');
            balloon.innerText = balloonEmojis[Math.floor(Math.random() * balloonEmojis.length)];
            
            const rect = field.getBoundingClientRect();
            const startX = Math.random() * (rect.width - 40);
            balloon.style.left = startX + 'px';
            balloon.style.top = rect.height + 'px';
            field.appendChild(balloon);

            const speed = Math.random() * 1.5 + 2; 
            const balloonObj = { element: balloon, x: startX, y: rect.height, speed: speed, radius: 20 };
            balloons.push(balloonObj);
        }

        function triggerPopParticles(x, y) {
            for(let i = 0; i < 6; i++) {
                const pop = document.createElement('div');
                pop.classList.add('heart-pop');
                pop.innerText = Math.random() > 0.5 ? '💖' : '✨';
                pop.style.left = x + 'px';
                pop.style.top = y + 'px';

                const dx = (Math.random() - 0.5) * 120;
                const dy = (Math.random() - 0.5) * 120;
                pop.style.setProperty('--dx', `${dx}px`);
                pop.style.setProperty('--dy', `${dy}px`);

                field.appendChild(pop);
                setTimeout(() => pop.remove(), 600);
            }
        }

        function updateFrame() {
            if (!gameActive) return;

            const rect = field.getBoundingClientRect();

            for (let i = arrows.length - 1; i >= 0; i--) {
                let a = arrows[i];
                a.x += a.vx;
                a.y += a.vy;
                a.element.style.left = a.x + 'px';
                a.element.style.top = a.y + 'px';

                if (a.x < -20 || a.x > rect.width + 20 || a.y < -20) {
                    a.element.remove();
                    arrows.splice(i, 1);
                }
            }

            for (let j = balloons.length - 1; j >= 0; j--) {
                let b = balloons[j];
                b.y -= b.speed;
                b.element.style.top = b.y + 'px';

                if (b.y < -50) {
                    b.element.remove();
                    balloons.splice(j, 1);
                    continue;
                }

                for (let i = arrows.length - 1; i >= 0; i--) {
                    let a = arrows[i];
                    const dist = Math.sqrt(Math.pow((a.x - b.x - 10), 2) + Math.pow((a.y - b.y - 10), 2));
                    
                    if (dist < 32) { 
                        triggerPopParticles(b.x + 10, b.y + 10);
                        score += 20; // Pop ke 20 points
                        scoreTxt.innerText = score;

                        b.element.remove();
                        balloons.splice(j, 1);
                        a.element.remove();
                        arrows.splice(i, 1);

                        if (score >= 1000) { // Target 1000 points
                            triggerWin();
                        }
                        break;
                    }
                }
            }

            requestAnimationFrame(updateFrame);
        }

        let balloonSpawnInterval = setInterval(spawnBalloon, 900);
        requestAnimationFrame(updateFrame);

        function triggerWin() {
            gameActive = false;
            clearInterval(balloonSpawnInterval);
            winModal.style.display = 'flex';
            
            document.querySelectorAll('.balloon').forEach(b => b.remove());
            document.querySelectorAll('.arrow').forEach(a => a.remove());
            balloons = [];
            arrows = [];
        }

        function resetGame() {
            score = 0;
            scoreTxt.innerText = score;
            gameActive = true;
            winModal.style.display = 'none';
            bow.style.transform = 'translateX(-50%) rotate(0deg)';
            balloonSpawnInterval = setInterval(spawnBalloon, 900);
            requestAnimationFrame(updateFrame);
        }
    </script>
</body>
</html>
