<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Queen Anu ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;600&family=Great+Vibes&display=swap');

        :root {
            --primary: #ff3366;
            --gold: #ffd700;
            --deep-red: #330010;
        }

        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: white;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* 3D PERSPECTIVE - Isse 3D feel aati hai */
            perspective: 2000px; 
        }

        .ambient-light {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, var(--deep-red) 0%, #000 85%);
            z-index: -1;
        }

        /* --- 3D INTERACTIVE CONTAINER --- */
        #main-scene {
            display: none;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
        }

        .card-3d {
            background: rgba(255, 255, 255, 0.08);
            padding: 40px;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            backdrop-filter: blur(20px);
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
            max-width: 400px;
            width: 80%;
            text-align: center;
            /* 3D TRANSFORMS */
            transform: rotateX(10deg) rotateY(-10deg);
            transform-style: preserve-3d;
            transition: transform 0.1s ease;
        }

        /* Inner elements lifting off the card (Layered 3D) */
        .card-3d h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3.5rem;
            color: var(--primary);
            margin: 0;
            transform: translateZ(60px); /* Text card se bahar nikalta hua */
            text-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .romantic-text {
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 20px 0;
            transform: translateZ(40px);
            color: #fff;
        }

        .btn-love {
            background: linear-gradient(45deg, var(--primary), #b3002d);
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transform: translateZ(80px); /* Button sab se aage */
            box-shadow: 0 10px 30px rgba(255, 51, 102, 0.4);
            transition: 0.3s;
        }

        .btn-love:hover { transform: translateZ(100px) scale(1.1); }

        /* --- 3D KISSES --- */
        .kiss {
            position: absolute;
            pointer-events: none;
            animation: fall3D 4s linear forwards;
            filter: drop-shadow(0 0 15px var(--primary));
        }

        @keyframes fall3D {
            0% { 
                transform: translateY(-10vh) translateZ(-500px) rotate(0deg); 
                opacity: 0; 
            }
            20% { opacity: 1; }
            50% { transform: translateY(50vh) translateZ(200px) rotate(180deg); }
            100% { 
                transform: translateY(110vh) translateZ(500px) rotate(360deg); 
                opacity: 0; 
            }
        }

        /* Initial Heart */
        #intro {
            cursor: pointer;
            text-align: center;
            animation: float 3s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .big-heart {
            font-size: 130px;
            filter: drop-shadow(0 0 40px var(--primary));
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
    </style>
</head>
<body>

    <div class="ambient-light"></div>

    <div id="intro" onclick="start3D()">
        <div class="big-heart">❤️</div>
        <h2 style="color: var(--gold); font-family: 'Dancing Script';">Anu Jaan, Tap Here...</h2>
    </div>

    <div id="main-scene">
        <div class="card-3d" id="card">
            <div style="font-size: 40px; transform: translateZ(50px);">🧸🌹🎂</div>
            <h1>Happy Birthday!</h1>
            <p class="romantic-text">
                "Meri Humsafar, Meri Jaan... ✨<br>
                Aap ke saath guzra har lamha mere liye ek haseen khwaab jaisa hai. Allah humein hamesha saath rakhe."
            </p>
            <p style="font-family: 'Dancing Script'; font-size: 1.8rem; color: var(--gold); transform: translateZ(60px);">
                I Love You, My Everything! ❤️
            </p>
            <button class="btn-love" onclick="kissExplosion()">Magic Kisses 💋</button>
        </div>
    </div>

    <script>
        const card = document.getElementById('card');

        function start3D() {
            document.getElementById('intro').style.display = 'none';
            document.getElementById('main-scene').style.display = 'flex';
        }

        // Mouse/Touch movement for 3D Interaction
        document.addEventListener('mousemove', (e) => {
            if(document.getElementById('main-scene').style.display === 'flex') {
                let x = (window.innerWidth / 2 - e.pageX) / 20;
                let y = (window.innerHeight / 2 - e.pageY) / 20;
                card.style.transform = `rotateY(${-x}deg) rotateX(${y}deg)`;
            }
        });

        function spawnKiss(isSpecial = false) {
            const kiss = document.createElement('div');
            kiss.className = 'kiss';
            kiss.innerHTML = isSpecial ? '💋' : '❤️';
            
            // Randomly position across width and depth
            kiss.style.left = Math.random() * 100 + 'vw';
            kiss.style.fontSize = (Math.random() * 20 + 30) + 'px';
            
            // Random duration
            kiss.style.animationDuration = (Math.random() * 2 + 3) + 's';
            
            document.body.appendChild(kiss);
            setTimeout(() => kiss.remove(), 4000);
        }

        function kissExplosion() {
            // Button click par kisses upar se aayengi aur screen ki depth (3D) mein move karengi
            for(let i = 0; i < 40; i++) {
                setTimeout(() => {
                    spawnKiss(true);
                    if(i % 3 === 0) spawnKiss(false);
                }, i * 80);
            }
        }
    </script>
</body>
</html>
