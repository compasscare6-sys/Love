<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anusha's Heart Puzzle 🧩❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght=700&family=Poppins:wght=400;600&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1b0722 0%, #07020d 100%);
            font-family: 'Poppins', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; color: #fff; -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-select: none;
        }

        .header { text-align: center; margin-bottom: 25px; padding: 0 15px; z-index: 10; }
        .title { font-family: 'Dancing Script', cursive; font-size: 2.6rem; color: #ffbd59; text-shadow: 0 0 10px rgba(255,189,89,0.5); margin: 0; }
        .hint { font-size: 0.9rem; color: #ff4071; letter-spacing: 0.5px; margin-top: 8px; font-weight: 600; text-shadow: 0 0 5px rgba(255,64,113,0.3); }

        /* PUZZLE BOARD STYLING */
        #puzzle-container {
            width: 325px; height: 325px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px; border: 2px solid rgba(255, 64, 113, 0.4);
            box-shadow: 0 20px 45px rgba(0,0,0,0.6);
            display: grid; grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr); gap: 6px; padding: 6px; box-sizing: border-box;
            position: relative;
        }

        .tile {
            background: linear-gradient(135deg, #ff4071, #9e143b);
            color: #fff; font-size: 1.8rem; font-weight: bold;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border-radius: 12px; cursor: pointer;
            box-shadow: inset 0 0 12px rgba(255,255,255,0.25), 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.12s ease;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
            position: relative;
        }

        /* Tiny heart graphic on tiles to match theme */
        .tile::after {
            content: "❤️"; font-size: 0.65rem; opacity: 0.4; margin-top: 2px;
        }

        .tile.empty { background: transparent; box-shadow: none; cursor: default; }
        .tile.empty::after { content: ""; }

        /* REWARD CELEBRATION OVERLAY */
        #win-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #33061f 0%, #07020d 100%);
            z-index: 200; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transform: scale(0.85);
            transition: all 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 24px; box-sizing: border-box;
        }
        #win-screen.reveal { opacity: 1; pointer-events: auto; transform: scale(1); }

        .love-message {
            font-family: 'Dancing Script', cursive; 
            font-size: 2.5rem; 
            text-align: center;
            color: #ffbd59; 
            text-shadow: 0 0 20px rgba(255, 189, 89, 0.9), 0 0 40px rgba(255, 64, 113, 0.7);
            line-height: 1.4; 
            animation: pulse 1.4s infinite alternate ease-in-out;
            max-width: 95%;
            word-wrap: break-word;
        }

        @keyframes pulse { from { transform: scale(0.95); } to { transform: scale(1.05); } }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">Brain Challenge 🧠</div>
        <div class="hint">"Heart ki is picture ko sahi jodo jaan"</div>
    </div>

    <!-- 3x3 Sliding Board -->
    <div id="puzzle-container"></div>

    <!-- Custom Victory Mega Message Screen -->
    <div id="win-screen">
        <div class="love-message">
            "I Love You Meri Jaan Umaahhhh Umaaaaahhh You are the best Proud of you baby you are very special for me Guriya" 💋❤️
        </div>
    </div>

    <!-- Background Audio Trigger -->
    <audio id="loveSong" loop>
        <source src="Jaan Ban Gaye - Khuda Haafiz.mp3.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Mathematical representation of target order 1-8
        const winningCombination = ["1", "2", "3", "4", "5", "6", "7", "8", ""];
        let currentLayout = [...winningCombination];
        
        const container = document.getElementById('puzzle-container');
        let isAudioPlaying = false;

        // Shuffle loop ensuring logic remains strictly solvable
        function shufflePuzzle() {
            for (let i = 0; i < 120; i++) {
                const emptyIdx = currentLayout.indexOf("");
                const validMoves = getValidMoves(emptyIdx);
                const randomMove = validMoves[Math.floor(Math.random() * validMoves.length)];
                
                // Swap places
                currentLayout[emptyIdx] = currentLayout[randomMove];
                currentLayout[randomMove] = "";
            }
        }

        function getValidMoves(idx) {
            const moves = [];
            const row = Math.floor(idx / 3);
            const col = idx % 3;

            if (row > 0) moves.push(idx - 3); // Move tile down into empty slot
            if (row < 2) moves.push(idx + 3); // Move tile up into empty slot
            if (col > 0) moves.push(idx - 1); // Move tile right into empty slot
            if (col < 2) moves.push(idx + 1); // Move tile left into empty slot
            return moves;
        }

        function renderBoard() {
            container.innerHTML = "";
            currentLayout.forEach((item, index) => {
                const tile = document.createElement('div');
                tile.classList.add('tile');
                if (item === "") {
                    tile.classList.add('empty');
                } else {
                    tile.innerText = item;
                    tile.addEventListener('click', () => handleTileClick(index));
                    tile.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        handleTileClick(index);
                    });
                }
                container.appendChild(tile);
            });
        }

        function handleTileClick(idx) {
            const emptyIdx = currentLayout.indexOf("");
            const validMoves = getValidMoves(emptyIdx);

            if (validMoves.includes(idx)) {
                if (!isAudioPlaying) {
                    document.getElementById('loveSong').play().catch(err => console.log("Music running"));
                    isAudioPlaying = true;
                }

                // Move calculation
                currentLayout[emptyIdx] = currentLayout[idx];
                currentLayout[idx] = "";
                renderBoard();

                checkWinCondition();
            }
        }

        function checkWinCondition() {
            let isWon = true;
            for (let i = 0; i < winningCombination.length; i++) {
                if (currentLayout[i] !== winningCombination[i]) {
                    isWon = false;
                    break;
                }
            }
            if (isWon) {
                setTimeout(() => {
                    document.getElementById('win-screen').classList.add('reveal');
                }, 400);
            }
        }

        // Run setup
        shufflePuzzle();
        renderBoard();
    </script>
</body>
</html>
