<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Begum Jeee ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Great+Vibes&family=Poppins:wght@300;400&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #1a0a0a; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Poppins', sans-serif;
        }

        /* Royal Background */
        .stars {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #3d0000 0%, #050000 100%);
            z-index: -1;
        }

        /* Envelope Design */
        .envelope-wrapper {
            position: relative; cursor: pointer; transition: 0.5s;
        }

        .envelope {
            position: relative; width: 280px; height: 180px;
            background: #8b0000; border-radius: 0 0 10px 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .envelope::before {
            content: ''; position: absolute; top: 0; width: 0; height: 0;
            border-left: 140px solid transparent; border-right: 140px solid transparent;
            border-top: 100px solid #a50000; transform-origin: top; transition: 0.5s; z-index: 5;
        }

        /* Letter Inside */
        .letter {
            position: absolute; bottom: 10px; left: 10px;
            width: 260px; height: 160px; background: #fdf5e6;
            border-radius: 5px; transition: 0.8s; z-index: 2;
            padding: 20px; box-sizing: border-box; text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        .letter h2 { font-family: 'Great Vibes', cursive; color: #8b0000; margin: 0; font-size: 2rem; }
        .letter p { font-size: 0.9rem; color: #333; line-height: 1.5; margin-top: 10px; }

        /* Animation when opened */
        .envelope-wrapper.open .envelope::before { transform: rotateX(180deg); z-index: 0; }
        .envelope-wrapper.open .letter { transform: translateY(-130px); height: 320px; z-index: 10; width: 300px; left: -10px; }

        /* Falling Elements */
        .rose { position: absolute; top: -50px; animation: fall 5s linear forwards; pointer-events: none; }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        .tap-hint {
            position: absolute; bottom: -60px; width: 100%; text-align: center;
            color: #d4af37; font-size: 0.8rem; letter-spacing: 2px;
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 0%, 100% {opacity: 1;} 50% {opacity: 0.3;} }
    </style>
</head>
<body>

    <div class="stars"></div>

    <audio id="loveSong" loop>
        <source src="Jaan Ban Gaye - Khuda Haafiz.mp3.mp3" type="audio/mpeg">
    </audio>

    <div class="envelope-wrapper" id="wrapper" onclick="openLetter()">
        <div class="envelope"></div>
        <div class="letter">
            <h2>Sorry Januri ❤️</h2>
            <p>Mera maqsad aapka dil dukhana kabhi nahi tha... <br><br>
               Aap meri zindagi ho, meri Begum ho. <br>
               <b>I Love You Begum Jeee</b> <br><br>
               Kya apne "Kala Paplat" ko ek pyari si smile ke saath maaf karogi?
            </p>
            <div style="font-size: 30px; margin-top: 10px;">💏💋</div>
        </div>
        <div class="tap-hint">TAP TO OPEN THE ENVELOPE</div>
    </div>

    <script>
        function openLetter() {
            // Play Music
            document.getElementById('loveSong').play();

            // Open Animation
            const wrapper = document.getElementById('wrapper');
            wrapper.classList.add('open');
            
            // Remove Tap Hint
            document.querySelector('.tap-hint').style.display = 'none';

            // Start Falling Roses
            setInterval(createRose, 300);
        }

        function createRose() {
            const rose = document.createElement('div');
            rose.classList.add('rose');
            const items = ['🌹', '❤️', '💋', '✨', '💖'];
            rose.innerText = items[Math.floor(Math.random() * items.length)];
            rose.style.left = Math.random() * 100 + "vw";
            rose.style.fontSize = (Math.random() * 20 + 20) + "px";
            rose.style.animationDuration = (Math.random() * 2 + 3) + "s";
            document.body.appendChild(rose);

            setTimeout(() => { rose.remove(); }, 5000);
        }
    </script>
</body>
</html>
