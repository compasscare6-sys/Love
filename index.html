<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arrow Mind Challenge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    h1 {
      font-size: 1.6rem;
      color: #38bdf8;
      margin-bottom: 6px;
    }

    .level-badge {
      display: inline-block;
      background: #0369a1;
      color: #e0f2fe;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    p.instructions {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    /* Grid Layout */
    .grid {
      display: grid;
      gap: 10px;
      margin: 0 auto 20px auto;
      justify-content: center;
    }

    .cell {
      aspect-ratio: 1;
      background: #334155;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease, background-color 0.3s ease;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.05);
    }

    .cell:active {
      transform: scale(0.92);
    }

    .cell.start {
      border: 2px solid #38bdf8;
    }

    .cell.end {
      border: 2px solid #f43f5e;
      background: #4c0519;
    }

    .cell.connected {
      background: #0284c7;
      box-shadow: 0 0 15px rgba(2, 132, 199, 0.6);
    }

    .arrow {
      display: inline-block;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Direction Rotations */
    .dir-0 { transform: rotate(0deg); }     /* Up */
    .dir-1 { transform: rotate(90deg); }    /* Right */
    .dir-2 { transform: rotate(180deg); }   /* Down */
    .dir-3 { transform: rotate(-90deg); }   /* Left */

    /* Win Screen */
    .win-screen {
      display: none;
      padding: 40px 20px;
      animation: fadeIn 0.6s ease forward;
    }

    .win-emoji {
      font-size: 3.5rem;
      margin-bottom: 15px;
    }

    .win-message {
      font-size: 1.5rem;
      font-weight: bold;
      color: #38bdf8;
      line-height: 1.4;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card" id="game-card">
    <div class="level-badge" id="level-badge">Level 1 of 3</div>
    <h1>Arrow Mind Path</h1>
    <p class="instructions">Arrows par tap kar ke rotate karein aur path ko START (⬆️) se END (🎯) tak connect karein!</p>

    <div class="grid" id="grid"></div>
  </div>

  <div class="card win-screen" id="win-screen">
    <div class="win-emoji">🎉</div>
    <div class="win-message">Maza aya Janu yeh game khel kar</div>
  </div>

  <script>
    // Game Levels Setup
    const levels = [
      {
        size: 3,
        // Grid 3x3
        data: [
          { dir: 1 }, { dir: 2 }, { dir: 1 },
          { dir: 0 }, { dir: 1 }, { dir: 2 },
          { dir: 3 }, { dir: 0 }, { isEnd: true }
        ]
      },
      {
        size: 4,
        // Grid 4x4
        data: [
          { dir: 1 }, { dir: 2 }, { dir: 1 }, { dir: 2 },
          { dir: 0 }, { dir: 1 }, { dir: 2 }, { dir: 3 },
          { dir: 3 }, { dir: 0 }, { dir: 1 }, { dir: 2 },
          { dir: 1 }, { dir: 0 }, { dir: 1 }, { isEnd: true }
        ]
      },
      {
        size: 5,
        // Grid 5x5 - Mind Bender
        data: [
          { dir: 1 }, { dir: 2 }, { dir: 3 }, { dir: 1 }, { dir: 2 },
          { dir: 0 }, { dir: 1 }, { dir: 2 }, { dir: 0 }, { dir: 2 },
          { dir: 3 }, { dir: 0 }, { dir: 1 }, { dir: 2 }, { dir: 2 },
          { dir: 1 }, { dir: 3 }, { dir: 0 }, { dir: 1 }, { dir: 2 },
          { dir: 0 }, { dir: 1 }, { dir: 0 }, { dir: 1 }, { isEnd: true }
        ]
      }
    ];

    let currentLevel = 0;
    const gridEl = document.getElementById('grid');
    const badgeEl = document.getElementById('level-badge');
    const gameCard = document.getElementById('game-card');
    const winScreen = document.getElementById('win-screen');

    function loadLevel(levelIndex) {
      const level = levels[levelIndex];
      badgeEl.innerText = `Level ${levelIndex + 1} of ${levels.length}`;
      
      // Dynamic Grid Columns based on size
      gridEl.style.gridTemplateColumns = `repeat(${level.size}, 1fr)`;
      gridEl.innerHTML = '';

      level.data.forEach((item, index) => {
        const cell = document.createElement('div');
        cell.classList.add('cell');

        if (index === 0) cell.classList.add('start');
        
        if (item.isEnd) {
          cell.classList.add('end');
          cell.innerHTML = '🎯';
        } else {
          cell.innerHTML = `<span class="arrow dir-${item.dir}">⬆️</span>`;
          cell.addEventListener('click', () => rotateArrow(index));
        }

        gridEl.appendChild(cell);
      });

      checkPath();
    }

    function rotateArrow(index) {
      const levelData = levels[currentLevel].data;
      levelData[index].dir = (levelData[index].dir + 1) % 4;
      
      const arrowEl = gridEl.children[index].querySelector('.arrow');
      arrowEl.className = `arrow dir-${levelData[index].dir}`;
      
      checkPath();
    }

    function checkPath() {
      const level = levels[currentLevel];
      const size = level.size;
      const data = level.data;

      // Clear highlights
      Array.from(gridEl.children).forEach(c => c.classList.remove('connected'));

      let current = 0;
      const visited = new Set();

      while (current !== null && !visited.has(current)) {
        visited.add(current);
        gridEl.children[current].classList.add('connected');

        if (data[current].isEnd) {
          // Level Completed!
          setTimeout(nextLevel, 400);
          return;
        }

        const dir = data[current].dir;
        let next = null;

        // Grid Navigation Logic
        if (dir === 0 && current >= size) next = current - size;                  // Up
        else if (dir === 1 && (current % size) !== size - 1) next = current + 1; // Right
        else if (dir === 2 && current < size * (size - 1)) next = current + size; // Down
        else if (dir === 3 && (current % size) !== 0) next = current - 1;        // Left

        current = next;
      }
    }

    function nextLevel() {
      if (currentLevel < levels.length - 1) {
        currentLevel++;
        loadLevel(currentLevel);
      } else {
        // Show Final Message
        gameCard.style.display = 'none';
        winScreen.style.display = 'block';
      }
    }

    // Initialize Game
    loadLevel(currentLevel);
  </script>
</body>
</html>
