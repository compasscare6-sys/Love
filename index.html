<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duas for My Anu ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap');

        body {
            margin: 0; height: 100vh; display: flex;
            justify-content: center; align-items: center;
            background: #0f0c29; 
            background: linear-gradient(to bottom, #1a1a2e, #16213e, #0f0c29);
            font-family: 'Poppins', sans-serif; overflow: hidden; color: white;
        }

        .jar-container {
            position: relative; cursor: pointer;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .jar {
            width: 140px; height: 190px;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px 20px 70px 70px;
            position: relative; backdrop-filter: blur(8px);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.1);
        }

        .jar-lid {
            position: absolute; top: -12px; left: 50%;
            transform: translateX(-50%); width: 70px; height: 15px;
            background: #c2185b; border-radius: 5px;
        }

        .glow {
            position: absolute; bottom: 30px; left: 50%;
            transform: translateX(-50%); width: 80px; height: 80px;
            background: radial-gradient(circle, #ff4081, transparent);
            filter: blur(20px); animation: blink 2s infinite alternate;
        }

        @keyframes blink { from { opacity: 0.4; } to { opacity: 1; } }

        #message-box {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 85%; max-width: 420px;
            background: #fff; color: #333;
            padding: 35px 25px; border-radius: 25px;
            text-align: center; transition: 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000; box-shadow: 0 25px 60px rgba(0,0,0,0.6);
        }

        #message-box.active { transform: translate(-50%, -50%) scale(1); }

        h2 { font-family: 'Dancing Script', cursive; color: #c2185b; font-size: 2.8rem; margin: 0; }
        p { font-size: 1rem; line-height: 1.7; color: #444; margin: 20px 0; font-weight: 400; }
        
        .next-btn {
            background: #c2185b; color: white; border: none;
            padding: 12px 25px; border-radius: 50px; cursor: pointer;
            font-weight: 600; box-shadow: 0 5px 15px rgba(194, 24, 91, 0.3);
        }

        .tap-hint { position: absolute; bottom: -60px; width: 100%; text-align: center; color: #ff80ab; font-size: 0.75rem; letter-spacing: 3px; font-weight: 600; }
    </style>
</head>
<body>

    <!-- Audio Source -->
    <audio id="bgMusic" loop>
        <source src="song.mp3.mp3" type="audio/mpeg">
    </audio>

    <div class="jar-container" onclick="openMessage()">
        <div class="jar-lid"></div>
        <div class="jar">
            <div class="glow"></div>
        </div>
        <div class="tap-hint">TAP TO OPEN DUAS ❤️</div>
    </div>

    <div id="message-box">
        <h2 id="title">Pyari Anu ❤️</h2>
        <p id="content">Loading your Duas...</p>
        <button class="next-btn" onclick="closeMessage()">Ameen ✨</button>
    </div>

    <script>
        const messages = [
            { t: "Meri Dua ❤️", c: "Allah aapko hamesha khush rakhe, har dukh se door rakhe aur aapki har jayez khwahish poori kare. Ameen." },
            { t: "Salamat Raho", c: "Aap meri zindagi ka noor ho. Allah hamara saath hamesha barkarar rakhe aur hamare ghar ko sukoon ka gehwara banaye." },
            { t: "Birthday Gift", c: "Aj meri birthday hai, aur meri sabse badi dua yehi hai ke aap hamesha mere saath haste muskurate raho." },
            { t: "For My Queen", c: "Aap sach mein meri 'Jaan Ban Gaye' ho. Aapke bina 'Kaley' adhoora hai. ❤️" },
            { t: "Hamesha Yours", c: "Always Yours, \n Kala Paplat ✨" }
        ];

        let index = 0;

        function openMessage() {
            const audio = document.getElementById('bgMusic');
            audio.play().catch(e => console.log("Audio play needs a tap first"));

            const box = document.getElementById('message-box');
            document.getElementById('title').innerText = messages[index].t;
            document.getElementById('content').innerText = messages[index].c;
            box.classList.add('active');
        }

        function closeMessage() {
            const box = document.getElementById('message-box');
            box.classList.remove('active');
            
            index = (index + 1) % messages.length;
            
            // Pop effect for next message
            setTimeout(() => {
                if(index !== 0) openMessage();
            }, 600);
        }
    </script>
</body>
</html>
