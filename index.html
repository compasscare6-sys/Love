<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anusha's Memory Match Game 🧠❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght=700&family=Poppins:wght=400;600&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1c0524 0%, #08020d 100%);
            font-family: 'Poppins', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; color: #fff; -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-select: none;
        }

        .header { text-align: center; margin-bottom: 20px; padding: 0 15px; z-index: 10; }
        .title { font-family: 'Dancing Script', cursive; font-size: 2.6rem; color: #ffbd59; text-shadow: 0 0 12px rgba(255,189,89,0.5); margin: 0; }
        .hint { font-size: 0.85rem; color: #ff4071; letter-spacing: 1px; margin-top: 5px; text-transform: uppercase; font-weight: 600; }

        /* MEMORY GRID STYLING */
        #game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 320px;
            max-width: 95%;
            perspective: 1000px;
            z-index: 10;
        }

        /* CARD OUTER BOX */
        .card {
            height: 95px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        /* CARD FACES */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        /* Card Back (Default look facing the user) */
        .card-back {
            background: linear-gradient(135deg, #a81c43, #ff4071);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            box-shadow: inset 0 0 15px rgba(255,255,255,0.3);
        }
        .card-back::before {
            content: "❤️";
            font-size: 1.6rem;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        /* Card Front (Revealed Emoji) */
        .card-front {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1.5px solid rgba(255, 189, 89, 0.4);
            font-size: 2.3rem;
            transform: rotateY(180deg);
        }

        /* Hide cards when matched smoothly */
        .card.matched {
            transform: rotateY(180deg) scale(0);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.6s ease, opacity 0.6s ease;
        }

        /* REWARD WIN OVERLAY SCREEN */
        #win-stage {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #380722 0%, #08020d 100%);
            z-index: 200; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transform: scale(0.85);
            transition: all 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 25px; box-sizing: border-box;
        }
        #win-stage.reveal { opacity: 1; pointer-events: auto; transform: scale(1); }

        .love-message {
            font-family: 'Dancing Script', cursive; 
            font-size: 2.6rem; 
            text-align: center;
            color: #ffbd59; 
            text-shadow: 0 0 20px rgba(255, 189, 89, 0.9), 0 0 40px rgba(255, 64, 113, 0.7);
            line-height: 1.4; 
            animation: heartPulse 1.4s infinite alternate ease-in-out;
            max-width: 95%;
        }

        @keyframes heartPulse { from { transform: scale(0.96); } to { transform: scale(1.04); } }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">Memory Match 🧠</div>
        <div class="hint">Cards flip karo aur same pairs dhoondo jaan!</div>
    </div>

    <!-- 3x4 Grid for 12 Cards -->
    <div id="game-grid"></div>

    <!-- Naya Romantic Reward Screen -->
    <div id="win-stage">
        <div class="love-message">
            "bhut parliya urdu mere Jaan thora rest time ab or thora MIya key sath Romance time janu I Kiss You Umaaahh Umaaahhh" 💋❤️
        </div>
    </div>

    <!-- Background Music Audio Trigger -->
    <audio id="loveSong" loop>
        <source src="Jaan Ban Gaye - Khuda Haafiz.mp3.mp3" type="audio/mpeg">
    </audio>

    <script>
        const emojis = ['🐸', '💋', '👑', '🧸', '🍫', '💝', '🐸', '💋', '👑', '🧸', '🍫', '💝'];
        let flippedCards = [];
        let matchedPairsCount = 0;
        let lockGrid = false;
        let isAudioPlaying = false;

        const gridContainer = document.getElementById('game-grid');

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function buildGameBoard() {
            const shuffledEmojis = shuffle(emojis);
            gridContainer.innerHTML = '';

            shuffledEmojis.forEach((emoji) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.emoji = emoji;

                const backFace = document.createElement('div');
                backFace.classList.add('card-face', 'card-back');

                const frontFace = document.createElement('div');
                frontFace.classList.add('card-face', 'card-front'); frontFace.innerText = emoji;

                card.appendChild(backFace);
                card.appendChild(frontFace);

                card.addEventListener('click', flipCard);
                card.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    flipCard.call(card);
                });

                gridContainer.appendChild(card);
            });
        }

        function flipCard() {
            if (lockGrid) return;
            if (this === flippedCards[0]) return;

            if (!isAudioPlaying) {
                document.getElementById('loveSong').play().catch(e => console.log("Music bypass active"));
                isAudioPlaying = true;
            }

            this.classList.add('flipped');
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                evaluateMatch();
            }
        }

        function evaluateMatch() {
            lockGrid = true;
            let isMatch = flippedCards[0].dataset.emoji === flippedCards[1].dataset.emoji;

            if (isMatch) {
                disableMatchedCards();
            } else {
                unflipMisalignedCards();
            }
        }

        function disableMatchedCards() {
            setTimeout(() => {
                flippedCards[0].classList.add('matched');
                flippedCards[1].classList.add('matched');
                
                matchedPairsCount++;
                resetTurnTracker();

                if (matchedPairsCount === 6) {
                    triggerVictoryScreen();
                }
            }, 500);
        }

        function unflipMisalignedCards() {
            setTimeout(() => {
                flippedCards[0].classList.remove('flipped');
                flippedCards[1].classList.remove('flipped');
                resetTurnTracker();
            }, 800);
        }

        function resetTurnTracker() {
            flippedCards = [];
            lockGrid = false;
        }

        function triggerVictoryScreen() {
            setTimeout(() => {
                document.getElementById('win-stage').classList.add('reveal');
            }, 600);
        }

        buildGameBoard();
    </script>
</body>
</html>
