<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anu's Sweet Sugar Rush 🍬✨</title>
    <style>
        :root {
            --bg-dark: #0f0813;
            --panel-bg: rgba(26, 15, 36, 0.75);
            --gold: #f59e0b;
            --text-light: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, #251333 0%, var(--bg-dark) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: var(--text-light);
            overflow: hidden;
        }

        .game-wrapper {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            max-width: 480px;
            width: 100%;
            padding: 20px;
            box-shadow: 0 25px 65px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        header h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(to right, #fff, #f472b6, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        header p {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 15px;
        }

        /* STATUS METRICS Dashboard */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 13px;
            font-weight: 600;
        }

        .dashboard div span {
            display: block;
            font-size: 16px;
            color: var(--gold);
            margin-top: 2px;
        }

        /* CANDY CRUSH 6x6 GRID */
        .candy-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            background: rgba(10, 5, 15, 0.5);
            padding: 10px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            margin-bottom: 15px;
            touch-action: none;
        }

        .tile {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.2s;
            user-select: none;
        }

        .tile:active {
            transform: scale(0.9);
        }

        .tile.selected {
            background: rgba(244, 114, 182, 0.25);
            border: 2px solid #f472b6;
            animation: pulse 0.6s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* POPUP MODALS */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 5, 15, 0.9);
            backdrop-filter: blur(12px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: linear-gradient(145deg, #20132c, #0f0813);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            max-width: 400px;
            width: 100%;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
        }

        .modal-title {
            color: #f472b6;
            font-size: 22px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .modal-msg {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .btn-action {
            background: linear-gradient(135deg, #db2777, #f59e0b);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(219, 39, 119, 0.4);
            transition: all 0.2s;
        }

        .btn-action:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(219, 39, 119, 0.6);
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <header>
            <h1>Sugar Match-3 Deluxe</h1>
            <p>Candies ko swap karke pairs banayein aur target score hit karein ✨</p>
        </header>

        <div class="dashboard">
            <div>Level<span id="level-val">1</span></div>
            <div>Score<span id="score-val">0 / 300</span></div>
            <div>Moves Left<span id="moves-val">25</span></div>
        </div>

        <div class="candy-grid" id="grid"></div>
    </div>

    <!-- LEVEL UP / WIN MODAL -->
    <div class="modal" id="game-modal">
        <div class="modal-content">
            <h2 class="modal-title" id="m-title">Level Cleared! 🎉</h2>
            <p class="modal-msg" id="m-msg">Great job! Agla level aur zyada challenging hone wala hai.</p>
            <button class="btn-action" id="m-btn" onclick="modalAction()">Next Level ➡️</button>
        </div>
    </div>

    <script>
        const candies = ['🍬', '🍭', '🍩', '🍪', '🍫', '🧁'];
        const width = 6;
        let gridData = [];
        let score = 0;
        let currentLevel = 1;
        let movesLeft = 25;
        let selectedTile = null;

        const levelTargets = { 1: 300, 2: 600, 3: 1000, 4: 1500, 5: 2200 };
        const levelMoves = { 1: 25, 2: 22, 3: 20, 4: 18, 5: 15 };

        function initGame() {
            score = 0;
            movesLeft = levelMoves[currentLevel];
            updateDashboard();
            createBoard();
            // Initial check to clear automated matches on spawn
            while(checkAndClearMatches()) {
                refillGrid();
            }
        }

        function createBoard() {
            const gridElement = document.getElementById('grid');
            gridElement.innerHTML = '';
            gridData = [];

            for (let i = 0; i < width * width; i++) {
                const randomCandy = candies[Math.floor(Math.random() * candies.length)];
                const tile = document.createElement('div');
                tile.classList.add('tile');
                tile.setAttribute('id', i);
                tile.innerText = randomCandy;
                tile.addEventListener('click', handleTileClick);
                gridElement.appendChild(tile);
                gridData.push(randomCandy);
            }
        }

        function handleTileClick() {
            const clickedId = parseInt(this.getAttribute('id'));

            if (selectedTile === null) {
                selectedTile = clickedId;
                this.classList.add('selected');
            } else {
                document.getElementById(selectedTile).classList.remove('selected');
                if (isAdjacent(selectedTile, clickedId)) {
                    swapTiles(selectedTile, clickedId);
                    movesLeft--;
                    updateDashboard();

                    let hasMatches = checkAndClearMatches();
                    if (hasMatches) {
                        setTimeout(() => {
                            refillGrid();
                            checkGameStatus();
                        }, 300);
                    } else {
                        // Undo swap if no matches found
                        setTimeout(() => swapTiles(selectedTile, clickedId), 200);
                    }
                }
                selectedTile = null;
            }
        }

        function isAdjacent(id1, id2) {
            const r1 = Math.floor(id1 / width), c1 = id1 % width;
            const r2 = Math.floor(id2 / width), c2 = id2 % width;
            return (Math.abs(r1 - r2) + Math.abs(c1 - c2)) === 1;
        }

        function swapTiles(id1, id2) {
            const temp = gridData[id1];
            gridData[id1] = gridData[id2];
            gridData[id2] = temp;

            document.getElementById(id1).innerText = gridData[id1];
            document.getElementById(id2).innerText = gridData[id2];
        }

        function checkAndClearMatches() {
            let matchFound = false;
            let toClear = new Set();

            // Row validation
            for (let r = 0; r < width; r++) {
                for (let c = 0; c < width - 2; c++) {
                    let idx = r * width + c;
                    if (gridData[idx] && gridData[idx] === gridData[idx+1] && gridData[idx] === gridData[idx+2]) {
                        toClear.add(idx).add(idx+1).add(idx+2);
                        matchFound = true;
                    }
                }
            }

            // Column validation
            for (let c = 0; c < width; c++) {
                for (let r = 0; r < width - 2; r++) {
                    let idx = r * width + c;
                    if (gridData[idx] && gridData[idx] === gridData[idx+width] && gridData[idx] === gridData[idx+width*2]) {
                        toClear.add(idx).add(idx+width).add(idx+width*2);
                        matchFound = true;
                    }
                }
            }

            if (matchFound) {
                toClear.forEach(idx => {
                    gridData[idx] = '';
                    document.getElementById(idx).innerText = '';
                });
                score += toClear.size * 10;
                updateDashboard();
            }
            return matchFound;
        }

        function refillGrid() {
            // Drop down mechanic
            for (let c = 0; c < width; c++) {
                for (let r = width - 1; r >= 0; r--) {
                    let idx = r * width + c;
                    if (gridData[idx] === '') {
                        let nextRow = r - 1;
                        while (nextRow >= 0) {
                            let nextIdx = nextRow * width + c;
                            if (gridData[nextIdx] !== '') {
                                gridData[idx] = gridData[nextIdx];
                                gridData[nextIdx] = '';
                                document.getElementById(idx).innerText = gridData[idx];
                                document.getElementById(nextIdx).innerText = '';
                                break;
                            }
                            nextRow--;
                        }
                    }
                }
            }

            // Fill empty top row spaces
            for (let i = 0; i < width * width; i++) {
                if (gridData[i] === '') {
                    gridData[i] = candies[Math.floor(Math.random() * candies.length)];
                    document.getElementById(i).innerText = gridData[i];
                }
            }

            // Cascade chains check
            if (checkAndClearMatches()) {
                setTimeout(refillGrid, 300);
            }
        }

        function updateDashboard() {
            document.getElementById('level-val').innerText = currentLevel;
            document.getElementById('score-val').innerText = `${score} / ${levelTargets[currentLevel]}`;
            document.getElementById('moves-val').innerText = movesLeft;
        }

        function checkGameStatus() {
            const target = levelTargets[currentLevel];
            if (score >= target) {
                if (currentLevel === 5) {
                    showModal("Grand Finale Won! 👑💖", "Wow Guriya! Aapne saare 5 hard levels par kar diye. Aapka determination aur game sense sach mein flawless hai!<br><br>Ab saari thakawat bhul kar ek pyaari si smile kijiye aur aaram se rest kijiye. Rabi aapke sath hai! ❤️", "Restart Game");
                } else {
                    showModal("Level Cleared! 🎉", `Aapne Level ${currentLevel} ko behtareen tareeqe se solve kiya. Agla step thoda aur interesting hone wala hai! ✨`, "Next Level");
                }
            } else if (movesLeft <= 0) {
                showModal("Level Failed! 🔄", "Koi baat nahi Guriya, is baar target thoda reh gaya. Dubara koshish kijiye, aap aaram se clear kar lengi!", "Try Again");
            }
        }

        function showModal(title, msg, btnText) {
            document.getElementById('m-title').innerHTML = title;
            document.getElementById('m-msg').innerHTML = msg;
            document.getElementById('m-btn').innerText = btnText;
            document.getElementById('game-modal').style.display = 'flex';
        }

        function modalAction() {
            document.getElementById('game-modal').style.display = 'none';
            const btnText = document.getElementById('m-btn').innerText;
            
            if (btnText === "Next Level") {
                currentLevel++;
                initGame();
            } else if (btnText === "Try Again" || btnText === "Restart Game") {
                currentLevel = 1;
                initGame();
            }
        }

        // Boot system up
        initGame();
    </script>
</body>
</html>
