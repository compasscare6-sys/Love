<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Queen</title>
    <style>
        body {
            background-color: #ffebee;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 10;
            max-width: 80%;
        }

        h1 {
            color: #d32f2f;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        #message {
            font-size: 1.2rem;
            color: #555;
            line-height: 1.6;
            min-height: 60px;
        }

        .heart {
            color: #e91e63;
            font-size: 50px;
            animation: beat 1s infinite;
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .floating-heart {
            position: absolute;
            color: #ff80ab;
            font-size: 20px;
            user-select: none;
            z-index: 1;
            animation: move linear infinite;
        }

        @keyframes move {
            from { transform: translateY(100vh); }
            to { transform: translateY(-10vh); }
        }

        button {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 20px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #b71c1c;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="heart">❤</div>
        <h1>Anu, You are Special!</h1>
        <p id="message"></p>
        <button onclick="startSurprise()">Click for a Surprise</button>
    </div>

    <script>
        const text = "Duniya mein bohot log hain, par meri khushi sirf aap se hai. Aap meri zindagi ki sabse pyari insaan ho aur hamesha rahogi. I am so lucky to have you! ❤️";
        let index = 0;

        function startSurprise() {
            document.querySelector('button').style.display = 'none';
            typeEffect();
            setInterval(createFloatingHeart, 300);
        }

        function typeEffect() {
            if (index < text.length) {
                document.getElementById("message").innerHTML += text.charAt(index);
                index++;
                setTimeout(typeEffect, 70);
            }
        }

        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerHTML = '❤';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            heart.style.opacity = Math.random();
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }
    </script>
</body>
</html>
