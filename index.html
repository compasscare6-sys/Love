<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Begum's Treat Vending 💖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      touch-action: manipulation;
    }

    body {
      background: linear-gradient(135deg, #180325 0%, #31103f 50%, #4c0519 100%);
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
      overflow-x: hidden;
    }

    .vending-container {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(180deg, #f472b6 0%, #db2777 100%);
      border: 4px solid #fbcfe8;
      border-radius: 36px;
      padding: 20px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
      position: relative;
    }

    .machine-header {
      text-align: center;
      background: #831843;
      padding: 10px;
      border-radius: 20px;
      border: 2px solid #fbcfe8;
      margin-bottom: 12px;
    }

    .machine-title {
      font-family: 'Caveat', cursive;
      font-size: 2.2rem;
      color: #fbcfe8;
      line-height: 1;
    }

    .glass-window {
      background: rgba(15, 23, 42, 0.85);
      border: 3px solid #fda4af;
      border-radius: 24px;
      padding: 15px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      min-height: 220px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }

    .item-box {
      background: rgba(255, 255, 255, 0.1);
      border: 1px dashed rgba(251, 113, 133, 0.5);
      border-radius: 16px;
      padding: 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .item-code {
      background: #be123c;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 10px;
      margin-bottom: 4px;
    }

    .item-emoji { font-size: 2rem; }
    .item-name { font-size: 0.75rem; font-weight: 700; color: #fbcfe8; margin-top: 4px; }

    .control-panel {
      margin-top: 15px;
      background: #500724;
      padding: 15px;
      border-radius: 20px;
      border: 2px solid #fda4af;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .display-screen {
      background: #0f172a;
      color: #22c55e;
      font-family: monospace;
      padding: 8px 16px;
      border-radius: 10px;
      width: 100%;
      text-align: center;
      font-size: 0.85rem;
      border: 1px solid #22c55e;
      letter-spacing: 1px;
    }

    .code-input-wrap {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .code-input {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid #fb7185;
      background: rgba(255, 255, 255, 0.9);
      color: #881337;
      font-weight: 800;
      text-align: center;
      font-size: 0.9rem;
      text-transform: uppercase;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
    }

    .btn-key {
      background: linear-gradient(135deg, #fb7185, #e11d48);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 15px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.1s;
    }

    .btn-key:active { transform: scale(0.95); }

    .drop-tray {
      margin-top: 15px;
      background: #1e293b;
      height: 55px;
      border-radius: 15px;
      border: 3px solid #64748b;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 700;
    }

    .popup-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .popup-overlay.active { opacity: 1; pointer-events: auto; }

    .result-card {
      background: #fff;
      color: #1e293b;
      border-radius: 28px;
      padding: 25px 20px;
      width: 100%;
      max-width: 330px;
      text-align: center;
      border: 3px dashed #fb7185;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .result-status {
      font-size: 0.8rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .status-lucky { background: #dcfce7; color: #15803d; }
    .status-unlucky { background: #ffe4e6; color: #be123c; }

    .result-text {
      font-size: 1.05rem;
      font-weight: 800;
      color: #881337;
      margin: 10px 0 15px 0;
      line-height: 1.5;
    }

    .btn-insta {
      background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
      width: 100%;
      margin-bottom: 8px;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-close {
      background: #e2e8f0;
      color: #475569;
      border: none;
      padding: 8px 20px;
      border-radius: 15px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      width: 100%;
    }

    .particle {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
      animation: floatUp 3s ease-out forwards;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-100vh) scale(1.6); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="vending-container">
    <div class="machine-header">
      <div class="machine-title">Begum's Treat Vending 💖</div>
      <p style="font-size:0.75rem; color:#fbcfe8;">Enter Secret Code & Pick Item!</p>
    </div>

    <div class="glass-window">
      <div class="item-box">
        <span class="item-code">A1</span>
        <span class="item-emoji">🥭</span>
        <span class="item-name">Imli Pass</span>
      </div>
      <div class="item-box">
        <span class="item-code">A2</span>
        <span class="item-emoji">📋</span>
        <span class="item-name">Class Right</span>
      </div>
      <div class="item-box">
        <span class="item-code">A3</span>
        <span class="item-emoji">🍨</span>
        <span class="item-name">Rasmalai & Kiss</span>
      </div>
      <div class="item-box">
        <span class="item-code">A4</span>
        <span class="item-emoji">📸</span>
        <span class="item-name">Snap Challenge</span>
      </div>
    </div>

    <div class="control-panel">
      <div class="display-screen" id="screen">ENTER CODE (e.g. ANU18)</div>

      <div class="code-input-wrap">
        <input type="text" id="codeInput" class="code-input" placeholder="Type ANU18" maxlength="10">
      </div>
      
      <div class="keypad">
        <button class="btn-key" onclick="pressButton('A1')">A1: Imli</button>
        <button class="btn-key" onclick="pressButton('A2')">A2: Class</button>
        <button class="btn-key" onclick="pressButton('A3')">A3: Puppy</button>
        <button class="btn-key" onclick="pressButton('A4')">A4: Snap</button>
      </div>
    </div>

    <div class="drop-tray" id="tray">
      🎁 Collect Item Here
    </div>
  </div>

  <div class="popup-overlay" id="popup">
    <div class="result-card">
      <div id="popEmoji" style="font-size: 3.5rem;">🎉</div>
      <div id="popStatus" class="result-status">RESULT</div>
      <div id="popText" class="result-text">Message...</div>
      
      <button class="btn-insta" id="instaBtn" onclick="sendToInsta()">
        📩 Send Result to Rabi on Insta
      </button>
      <button class="btn-close" onclick="closePopup()">Close</button>
    </div>
  </div>

  <script>
    const MY_INSTA_USERNAME = "rabi__dadani57"; 

    let a3Attempts = 0;
    let currentResultText = "";

    const outcomes = {
      'A1': [
        { lucky: true, emoji: '🥭', text: "Aaj aap Imli khayein, poori permission hai! 😋" },
        { lucky: false, emoji: '🚫', text: "Aaj Imli Bilkul Band! No imli today! 😜" }
      ],
      'A2': [
        { lucky: true, emoji: '📋', text: "Aaj raat Rabi ki ache se Class lagane ki permission di jaati hai! 😤" },
        { lucky: false, emoji: '🛡️', text: "Aaj Class Nahi Laga Sakti! Rabi Safe hai ab! 🙈" }
      ],
      'A3_LUCKY': { lucky: true, emoji: '🍨', text: "Rasmalai mein aaj Puppy NAHI milegi! 🙈" },
      'A3_UNLUCKY': { lucky: false, emoji: '💋', text: "Ab toh main aaj Puppy dekar rahoon-ga, aap mujhe rok nahi sakti! 💋🔥" },
      'A4': [
        { lucky: true, emoji: '📸', text: "Abhi ki Snap bhejni hai toh bhejo, baaki aapki marzi! 😉" },
        { lucky: false, emoji: '🤪', text: "Abhi ke abhi Snap bhejni padegi, chahe masi wali halat mein hi kyun na ho! 📸🔥" }
      ]
    };

    function pressButton(code) {
      const input = document.getElementById('codeInput').value.trim();
      const screen = document.getElementById('screen');
      const tray = document.getElementById('tray');

      if (!input) {
        screen.innerText = "⚠️ ENTER SECRET CODE FIRST!";
        return;
      }

      screen.innerText = `DISPENSING ${code}...`;
      tray.innerText = "⚙️ Processing Machine...";

      setTimeout(() => {
        let result;

        if (code === 'A3') {
          a3Attempts++;
          if (a3Attempts % 4 === 0) {
            result = outcomes['A3_UNLUCKY'];
          } else {
            result = Math.random() > 0.5 ? outcomes['A3_LUCKY'] : outcomes['A3_UNLUCKY'];
          }
        } else {
          const list = outcomes[code];
          result = list[Math.floor(Math.random() * list.length)];
        }
        
        showResult(result);
        screen.innerText = `CODE ACCEPTED: ${input.toUpperCase()}`;
        tray.innerText = "🎁 ITEM DROPPED!";
      }, 1200);
    }

    function showResult(item) {
      currentResultText = `${item.emoji} ${item.text}`;
      document.getElementById('popEmoji').innerText = item.emoji;
      document.getElementById('popText').innerText = item.text;
      
      const statusEl = document.getElementById('popStatus');
      if (item.lucky) {
        statusEl.innerText = "BEGUM'S LUCK ✨";
        statusEl.className = "result-status status-lucky";
      } else {
        statusEl.innerText = "MENDHAK'S DESTINY 💋";
        statusEl.className = "result-status status-unlucky";
      }

      document.getElementById('popup').classList.add('active');
      triggerRain(20);
    }

    function sendToInsta() {
      const textMessage = encodeURIComponent(`Suno Rabi! Mera Vending Machine Result aaya hai:\n\n"${currentResultText}" 💖`);
      window.location.href = `https://ig.me/m/${MY_INSTA_USERNAME}?text=${textMessage}`;
    }

    function closePopup() {
      document.getElementById('popup').classList.remove('active');
    }

    function triggerRain(count) {
      const symbols = ['💖', '💋', '✨', '🍨', '🌸'];
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const p = document.createElement('div');
          p.className = 'particle';
          p.innerText = symbols[Math.floor(Math.random() * symbols.length)];
          p.style.left = Math.random() * 100 + 'vw';
          p.style.bottom = '0px';
          p.style.fontSize = (Math.random() * 18 + 18) + 'px';
          document.body.appendChild(p);

          setTimeout(() => p.remove(), 3000);
        }, i * 40);
      }
    }
  </script>

</body>
</html>
