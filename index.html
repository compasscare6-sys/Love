<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Queen Anu</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Poppins:wght@300&display=swap');

        body {
            background: #121212;
            color: #d4af37; /* Royal Gold */
            font-family: 'Special Elite', typewriter;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #terminal {
            width: 80%;
            max-width: 600px;
            text-align: left;
            line-height: 1.8;
            font-size: 1.5rem;
        }

        #cursor {
            display: inline-block;
            width: 10px;
            height: 25px;
            background: #d4af37;
            animation: blink 0.8s infinite;
            vertical-align: middle;
            margin-left: 5px;
        }

        @keyframes blink { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }

        .btn-start {
            background: transparent;
            color: #d4af37;
            border: 1px solid #d4af37;
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.5s;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 5px;
        }

        .btn-start:hover {
            background: #d4af37;
            color: #121212;
            box-shadow: 0 0 20px #d4af37;
        }

        #hidden-audio { display: none; }
    </style>
</head>
<body>

    <div id="start-container">
        <button class="btn-start" onclick="startTyping()">CLICK TO READ MY HEART</button>
    </div>

    <div id="terminal" style="display: none;">
        <span id="text-target"></span><span id="cursor"></span>
    </div>

    <script>
        const message = "Hello Anu...\n\nMaine bohot baar socha ke kya likhoon, par jab aapke baare mein sochta hoon toh lafz kam par jaate hain.\n\nMere liye sukoon ka matlab sirf aapki muskurahat hai. Shukriya meri life ka sabse khoobsurat hissa banne ke liye.\n\nI promise, main hamesha aapka saath doonga, bilkul waise hi jaise ye lafz abhi aapke liye likhe ja rahe hain...\n\nForever Yours. ❤️";

        function startTyping() {
            document.getElementById('start-container').style.display = 'none';
            document.getElementById('terminal').style.display = 'block';
            
            let i = 0;
            const target = document.getElementById('text-target');

            function typeWriter() {
                if (i < message.length) {
                    let char = message.charAt(i);
                    target.innerHTML += char === '\n' ? '<br>' : char;
                    i++;
                    
                    // Typing speed: thoda random taake real lage
                    let speed = char === ',' || char === '.' ? 500 : 70; 
                    setTimeout(typeWriter, speed);
                } else {
                    document.getElementById('cursor').style.display = 'none';
                }
            }
            typeWriter();
        }
    </script>
</body>
</html>
