<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anu Jeet Gai! 🎉</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #FFD700, #FF69B4, #8A2BE2); /* Vibrant gradient */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            text-align: center;
            overflow: hidden; /* Prevent scroll for confetti */
        }

        .container {
            background: rgba(0, 0, 0, 0.7); /* Dark semi-transparent background */
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 90%;
            border: 3px solid #FFD700; /* Gold border */
        }

        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            color: #FFD700; /* Gold color for heading */
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
        }

        p {
            font-size: 1.3em;
            margin-bottom: 30px;
            line-height: 1.5;
            color: #E0E0E0;
        }

        .btn-party {
            background: #FF69B4; /* Hot pink button */
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.4em;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.3s ease, background-color 0.3s ease;
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.4);
        }

        .btn-party:hover {
            transform: scale(1.1);
            background-color: #FF1493; /* Deeper pink on hover */
        }

        /* Confetti Styles */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #f00; /* Default color, will be randomized */
            z-index: 9999;
            top: -10px; /* Start above the screen */
            pointer-events: none; /* Don't block clicks */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Anu Jeet Gai! 🎉</h1>
        <p>Meri pyari Anu Ludo mein jeet gai hai!</p>
        <p>Yeh uski jeet ka jashn hai! 🥳</p>
        <button class="btn-party" onclick="startConfetti()">Party Time!</button>
    </div>

    <script>
        function startConfetti() {
            // Display a message
            alert("Anu: Waah! Main Jeet Gai! Sabko hara diya! 🏆");

            // Create lots of confetti!
            for (let i = 0; i < 150; i++) {
                createConfetti();
            }
        }

        function createConfetti() {
            const colors = ['#FFD700', '#FF69B4', '#8A2BE2', '#00FFFF', '#FF4500', '#ADFF2F']; // More colors
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            confetti.style.left = Math.random() * 100 + 'vw'; // Random horizontal position
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px'; // Mix of circles and squares
            confetti.style.opacity = Math.random() * 0.7 + 0.3; // Random opacity

            document.body.appendChild(confetti);

            const animation = confetti.animate([
                { transform: 'translateY(0) rotate(0deg)', opacity: confetti.style.opacity },
                { transform: `translateY(105vh) rotate(${Math.random() * 720}deg)`, opacity: 0 } // Fall down and rotate
            ], {
                duration: Math.random() * 3000 + 2000, // Random duration
                easing: 'ease-out',
                fill: 'forwards'
            });

            animation.onfinish = () => confetti.remove(); // Remove after animation
        }
    </script>

</body>
</html>
