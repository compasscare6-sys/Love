<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special Surprise For Anu ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: #090d16;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }

    .story-card {
      background: linear-gradient(180deg, #1e1b4b 0%, #0f172a 100%);
      padding: 24px 18px;
      border-radius: 28px;
      border: 2px solid #f43f5e;
      text-align: center;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 50px rgba(244, 63, 94, 0.35);
      position: relative;
    }

    .teddy-stage {
      height: 260px;
      background: radial-gradient(circle at center, #2e1065 0%, #0f172a 80%);
      border-radius: 20px;
      margin-bottom: 15px;
      position: relative;
      overflow: hidden;
      border: 1px solid #4c1d95;
    }

    .floor {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 45px;
      background: #1e1145;
      border-top: 2px solid #581c87;
    }

    .teddy {
      position: absolute;
      bottom: 30px;
      font-size: 5rem;
      transition: all 0.3s ease;
      filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
    }

    .male-teddy {
      left: 20px;
      filter: sepia(100%) hue-rotate(-20deg) saturate(300%);
      transition: left 2.2s linear;
    }

    .female-teddy {
      right: 20px;
      filter: drop-shadow(0 0 15px #f43f5e) hue-rotate(90deg) saturate(250%);
    }

    .walking {
      animation: walkStep 0.4s infinite alternate ease-in-out;
    }

    @keyframes walkStep {
      0% { transform: translateY(0) rotate(-5deg); }
      100% { transform: translateY(-12px) rotate(5deg); }
    }

    .angry {
      animation: angryShake 0.4s infinite alternate;
    }

    @keyframes angryShake {
      0% { transform: rotate(-8deg); }
      100% { transform: rotate(8deg); }
    }

    .male-walk-target { left: 190px !important; }
    .male-hug-pos { left: 170px !important; transform: rotate(15deg) scale(1.1); }
    .female-hug-pos { right: 170px !important; transform: rotate(-15deg) scale(1.1); }

    .kiss-effect {
      position: absolute;
      font-size: 2.8rem;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      animation: popKiss 1s ease forward;
    }

    @keyframes popKiss {
      0% { opacity: 0; transform: translate(-50%, 20px) scale(0.5); }
      50% { opacity: 1; transform: translate(-50%, -20px) scale(1.4); }
      100% { opacity: 0; transform: translate(-50%, -50px) scale(1); }
    }

    .dialogue-box {
      min-height: 75px;
      background: #0f172a;
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #334155;
      margin-bottom: 15px;
    }

    .typing-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: #38bdf8;
      line-height: 1.4;
    }

    .final-msg { color: #f43f5e !important; }

    /* Interactive Action Buttons */
    .action-buttons {
      display: none;
      flex-direction: column;
      gap: 10px;
      animation: fadeIn 0.8s ease;
    }

    .btn {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #38bdf8;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #0284c7;
      border-color: #0284c7;
    }

    .btn-heart {
      background: #f43f5e;
      border-color: #f43f5e;
    }

    .btn-heart:hover {
      background: #e11d48;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="story-card">
    <div class="teddy-stage" id="stage">
      <div class="floor"></div>
      <div class="teddy male-teddy" id="male-teddy">🧸</div>
      <div class="teddy female-teddy angry" id="female-teddy">🧸🎀</div>
    </div>

    <div class="dialogue-box">
      <div class="typing-text" id="typewriter">...</div>
    </div>

    <!-- Buttons after story completes -->
    <div class="action-buttons" id="action-buttons">
      <button class="btn" onclick="responseClick('food')">🍔 Aapke Liye Kuch Order Karu?</button>
      <button class="btn" onclick="responseClick('call')">📞 Direct Call Par Baat Karein?</button>
      <button class="btn btn-heart" onclick="responseClick('forgive')">❤️ Gussa Khatam (Maaf Kiya)</button>
    </div>
  </div>

  <script>
    const stageEl = document.getElementById('stage');
    const maleTeddy = document.getElementById('male-teddy');
    const femaleTeddy = document.getElementById('female-teddy');
    const typeWriterEl = document.getElementById('typewriter');
    const btnContainer = document.getElementById('action-buttons');

    function typeText(text, speed = 45) {
      return new Promise(resolve => {
        typeWriterEl.innerHTML = '';
        let i = 0;
        const timer = setInterval(() => {
          typeWriterEl.innerHTML += text.charAt(i);
          i++;
          if (i >= text.length) {
            clearInterval(timer);
            resolve();
          }
        }, speed);
      });
    }

    function triggerKissEffect() {
      const kiss = document.createElement('div');
      kiss.className = 'kiss-effect';
      kiss.innerHTML = '💋❤️✨';
      stageEl.appendChild(kiss);
      setTimeout(() => kiss.remove(), 1000);
    }

    async function startTeddyStory() {
      await new Promise(r => setTimeout(r, 800));

      maleTeddy.classList.add('walking');
      maleTeddy.classList.add('male-walk-target');

      await new Promise(r => setTimeout(r, 2200));
      maleTeddy.classList.remove('walking');

      await new Promise(r => setTimeout(r, 400));
      triggerKissEffect();
      await new Promise(r => setTimeout(r, 800));

      await typeText("Bubu Guusaa khatam kardoo Jaan 🥺");

      await new Promise(r => setTimeout(r, 1400));

      femaleTeddy.classList.remove('angry');
      await typeText("Okay Bubu ✨");

      await new Promise(r => setTimeout(r, 800));

      triggerKissEffect();
      await new Promise(r => setTimeout(r, 800));

      maleTeddy.classList.add('male-hug-pos');
      femaleTeddy.classList.add('female-hug-pos');

      await new Promise(r => setTimeout(r, 1200));

      typeWriterEl.classList.add('final-msg');
      await typeText("I Love You janu ab tu teddy ne bhi maaf kardiya ap bhi kardoo apney lali koo Begum . ❤️🌹");

      // Show options
      btnContainer.style.display = 'flex';
    }

    async function responseClick(type) {
      if (type === 'food') {
        await typeText("Aap batao Foodpanda se kya mangwau aapke ghar? 🍕🍰");
      } else if (type === 'call') {
        await typeText("Main call kar raha hu, please pick kar lo ek baar... 🥺📱");
      } else if (type === 'forgive') {
        await typeText("Yayyy! Thank you Begum! ❤️ Ab jaldi se ek pyari si smile bhejo! 😊");
      }
    }

    window.onload = startTeddyStory;
  </script>
</body>
</html>
