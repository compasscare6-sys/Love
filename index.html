<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANU ke liye Sorry game 🌸</title>
    <style>
        :root {
            --bg: linear-gradient(135deg, #1e1b4b, #311042);
            --pink: #f43f5e;
            --purple: #a855f7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: white;
        }

        .game-box {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 25px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        h1 {
            font-size: 26px;
            color: #fca5a5;
            margin-bottom: 8px;
        }

        .rules {
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.5;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 12px;
            border: 1px dashed rgba(255, 255, 255, 0.15);
        }

        .status {
            font-size: 14px;
            color: #ffffff;
            margin-bottom: 20px;
            background: linear-gradient(90deg, rgba(244, 63, 94, 0.3), rgba(168, 85, 247, 0.3));
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .cell {
            background: rgba(255, 255, 255, 0.08);
            aspect-ratio: 1;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 38px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cell:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .cell.X { color: #f43f5e; text-shadow: 0 0 12px rgba(244, 63, 94, 0.6); }
        .cell.O { color: #38bdf8; text-shadow: 0 0 12px rgba(56, 189, 248, 0.6); }

        .btn-action {
            background: linear-gradient(135deg, var(--pink), var(--purple));
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4);
            font-size: 15px;
            transition: transform 0.1s;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        /* Result Popup Overlay */
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.95);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }

        .popup {
            background: #fff1f2;
            color: #4c0519;
            padding: 30px 20px;
            border-radius: 24px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 2px solid #fecdd3;
        }

        .popup h2 { margin-bottom: 15px; color: #9f1239; font-size: 24px; }
        .popup p { font-size: 15px; line-height: 1.6; margin-bottom: 22px; font-weight: 500; }
    </style>
</head>
<body>

    <div class="game-box">
        <h1>ANU ke liye Sorry game</h1>
        <div class="rules">
            Chalo ek Challenge Match ho jaye! Agar Anna jeet gaeen (jo ke mushkil hai), toh Rabi ko ek aisi shart poori karni padegi jo aap bolegi. Aur agar Rabi jeet gaya, toh gussa khatam! 😎
        </div>
        
        <div class="status" id="status-text">Aapki Turn Hai (Aap 'X' Ho) 🔥</div>

        <div class="board" id="board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>

        <button class="btn-action" onclick="resetGame()">Game Restart Karo 🔄</button>
    </div>

    <!-- RESULT OVERLAY -->
    <div class="overlay" id="overlay">
        <div class="popup">
            <h2 id="win-title">Winner!! 👑</h2>
            <p id="win-msg">Message loading...</p>
            <button class="btn-action" onclick="closePopup()">Chalo Dobara Khelte Hain 😤</button>
        </div>
    </div>

    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let isGameActive = true;
        
        const winPatterns = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        function makeMove(index) {
            if (board[index] !== "" || !isGameActive) return;

            // Player Move (X)
            board[index] = "X";
            updateBoard();
            
            if (checkWin("X")) {
                endGame("Anna Won! 👑", "ANU jeet gaeen! Shart ke mutabiq aapko Muj par FULL HUKUM chalane ka haq milta hai. Chalo ab hukum chalao begum! ❤️");
                return;
            }

            if (board.every(cell => cell !== "")) {
                endGame("Match Draw! 🤝", "Draw ho gaya! Chalo dobara khelo, gusse mein dimaag tez chalta hai aapka, is baar hara kar apna hukum chalao mujh par! 😉");
                return;
            }

            // Computer Move (O) with Delay
            isGameActive = false;
            document.getElementById('status-text').innerText = "Rabi Dimaag Laga Raha Hai... 🤔";
            setTimeout(() => {
                aiMove();
                isGameActive = true;
            }, 600);
        }

        function aiMove() {
            // 1. Try to win
            let move = findBestMove("O");
            // 2. Block Player
            if (move === null) move = findBestMove("X");
            // 3. Take Center
            if (move === null && board[4] === "") move = 4;
            // 4. Take Random Empty Cell
            if (move === null) {
                let emptyCells = board.map((c, i) => c === "" ? i : null).filter(v => v !== null);
                move = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            }

            if (move !== undefined && move !== null) {
                board[move] = "O";
                updateBoard();
                if (checkWin("O")) {
                    endGame("Rabi Won! 😎", "Mein jeet gaya! Guriya aapka dimaag gusse ki waja se para high huwa wah hai,. Shart ke mutabiq ab aapko apna gussa 50% kam karna padega aur dawa khani padegi. Chalo dobara try karo shabash, is baar harao mujhe!");
                } else if (board.every(cell => cell !== "")) {
                    endGame("Match Draw! 🤝", "Draw ho gaya! Chalo dobara khelo, gusse mein dimaag tez chalta hai aapka, is baar hara kar apna hukum chalao mujh par! 😉");
                } else {
                    document.getElementById('status-text').innerText = "Aapki Turn Hai (Aap 'X' Ho) 🔥";
                }
            }
        }

        function findBestMove(player) {
            for (let pattern of winPatterns) {
                let count = 0;
                let emptyIdx = null;
                for (let idx of pattern) {
                    if (board[idx] === player) count++;
                    else if (board[idx] === "") emptyIdx = idx;
                }
                if (count === 2 && emptyIdx !== null) return emptyIdx;
            }
            return null;
        }

        function checkWin(player) {
            return winPatterns.some(pattern => {
                return pattern.every(index => board[index] === player);
            });
        }

        function updateBoard() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, i) => {
                cell.innerText = board[i];
                cell.className = `cell ${board[i]}`;
            });
        }

        function endGame(title, msg) {
            isGameActive = false;
            document.getElementById('win-title').innerText = title;
            document.getElementById('win-msg').innerText = msg;
            document.getElementById('overlay').style.display = 'flex';
        }

        function closePopup() {
            document.getElementById('overlay').style.display = 'none';
            resetGame();
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            isGameActive = true;
            document.getElementById('status-text').innerText = "Aapki Turn Hai (Aap 'X' Ho) 🔥";
            updateBoard();
        }
    </script>
</body>
</html>
