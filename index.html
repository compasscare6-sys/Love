<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Love Courier 💌</title>
    <style>
        :root {
            --bg-dark: #0b0512;
            --card-bg: rgba(30, 15, 45, 0.95);
            --pink-main: #ec4899;
            --gold: #f59e0b;
            --purple-light: #c084fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, #2e1047 0%, var(--bg-dark) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: #fff;
        }

        .story-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(236, 72, 153, 0.35);
            border-radius: 28px;
            width: 100%;
            max-width: 380px;
            padding: 25px 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            text-align: center;
            position: relative;
        }

        .badge {
            display: inline-block;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .story-icon {
            font-size: 45px;
            margin-bottom: 12px;
        }

        .story-text {
            font-size: 16px;
            font-weight: 700;
            color: #f3e8ff;
            line-height: 1.5;
            margin-bottom: 22px;
            min-height: 60px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1.5px solid rgba(236, 72, 153, 0.3);
            color: #fff;
            padding: 14px 16px;
            border-radius: 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-btn:active {
            transform: scale(0.97);
            background: rgba(236, 72, 153, 0.25);
            border-color: var(--pink-main);
        }

        /* FINAL POPUP MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 3, 15, 0.98);
            backdrop-filter: blur(20px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-content {
            background: linear-gradient(145deg, #3a1146, #0f0517);
            border: 2px solid var(--pink-main);
            border-radius: 28px;
            max-width: 350px;
            width: 100%;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.9);
            animation: scaleUp 0.4s ease-out;
        }

        @keyframes scaleUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .heart-icon { font-size: 55px; margin-bottom: 12px; }
        .modal-title { color: var(--gold); font-size: 20px; margin-bottom: 15px; font-weight: 800; }
        .modal-msg { font-size: 16px; color: #f3e8ff; line-height: 1.5; font-weight: 700; }
    </style>
</head>
<body>

    <div class="story-card">
        <div class="badge" id="chapter-badge">Chapter 1 / 4</div>
        <div class="story-icon" id="story-icon">☀️</div>
        <div class="story-text" id="story-text">Loading story...</div>
        <div class="options-container" id="options-container">
            <!-- Dynamic Options -->
        </div>
    </div>

    <!-- WIN DIALOG -->
    <div class="modal" id="win-modal">
        <div class="modal-content">
            <div class="heart-icon">👑💋</div>
            <h2 class="modal-title">You Won My Heart Again! 🏆❤️</h2>
            <p class="modal-msg">
                I Love You So Much, My Queen! Ummaah! 👑💋
            </p>
        </div>
    </div>

    <script>
        const storyData = [
            {
                chapter: "Chapter 1: The Morning Vibe ☀️",
                icon: "📱",
                text: "Subah uthte hi sabse pehle kya karongi, Meri Begum?",
                options: [
                    { text: "Pyaar se aapka message check karungi 💌", next: 1 },
                    { text: "Aapko miss karungi aur smile karungi 🙈", next: 1 }
                ]
            },
            {
                chapter: "Chapter 2: The Truth 💖",
                icon: "❤️",
                text: "Sach sach batana, duniya mein sab se zyada kisse pyar karti ho?",
                options: [
                    { text: "Sirf aur sirf aap se! 🥰", next: 2 },
                    { text: "Mere Shohar se, unki jaan hoon main 👑", next: 2 }
                ]
            },
            {
                chapter: "Chapter 3: The Punishment 🙈",
                icon: "⏳",
                text: "Agar main kabhi kaam ke chakkar mein late ghar aau, toh kya punishment milegi?",
                options: [
                    { text: "Dher saari Umaaah deni padegi 💋", next: 3 },
                    { text: "Shopping par le jana padega 🛍️", next: 3 }
                ]
            },
            {
                chapter: "Chapter 4: The Final Lock 🔑",
                icon: "👑",
                text: "Dil ki chabi kiske paas hai aur mere poore din ki khushi kisse judi hai?",
                options: [
                    { text: "Sirf aur sirf Anu ke paas! 💖", next: "WIN" },
                    { text: "Meri Begum Sahiba ke paas! 👑", next: "WIN" }
                ]
            }
        ];

        let currentChapter = 0;

        function loadChapter() {
            const data = storyData[currentChapter];
            document.getElementById('chapter-badge').innerText = data.chapter;
            document.getElementById('story-icon').innerText = data.icon;
            document.getElementById('story-text').innerText = data.text;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            data.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.text;
                btn.onclick = () => handleChoice(opt.next);
                container.appendChild(btn);
            });
        }

        function handleChoice(nextChapter) {
            if (nextChapter === "WIN") {
                document.getElementById('win-modal').style.display = 'flex';
            } else {
                currentChapter = nextChapter;
                loadChapter();
            }
        }

        loadChapter();
    </script>
</body>
</html>
