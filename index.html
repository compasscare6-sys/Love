<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anu's Secret Path</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300&display=swap');

        body {
            margin: 0; background: #0f0f0f; color: #fff;
            font-family: 'Poppins', sans-serif; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; flex-direction: column;
        }

        /* Animated Path */
        .path {
            width: 2px; height: 0; background: linear-gradient(to bottom, transparent, #d4af37);
            position: absolute; top: 0; animation: grow 3s forwards;
        }

        @keyframes grow { to { height: 40vh; } }

        .surprise-box {
            border: 2px solid #d4af37; padding: 40px; border-radius: 50%;
            text-align: center; position: relative; z-index: 10;
            background: rgba(212, 175, 55, 0.05); cursor: pointer;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
            transition: 0.5s;
        }

        .surprise-box:hover { transform: scale(1.1); box-shadow: 0 0 40px #d4af37; }

        .main-msg {
            font-family: 'Dancing Script', cursive; font-size: 3rem;
            color: #d4af37; margin: 0; display: none;
        }

        .instruction { color: #888; letter-spacing: 2px; font-size: 0.8rem; margin-top: 10px; }

        /* Floating particles */
        .dot { position: absolute; background: #d4af37; border-radius: 50%; opacity: 0.3; }
    </style>
</head>
<body>

    <div class="path"></div>

    <div class="surprise-box" id="box" onclick="reveal()">
        <div id="icon" style="font-size: 50px;">🎁</div>
        <p id="tap-text" class="instruction">TAP TO OPEN YOUR GIFT</p>
        <h1 id="msg" class="main-msg">I Love You, Anu! ❤️</h1>
    </div>

    <div id="final-note" style="display:none; margin-top: 30px; text-align: center; padding: 0 20px;">
        <p style="font-style: italic; color: #fce4ec;">"Ab peeche murein... aapka real surprise aapke samne hai!"</p>
    </div>

    <script>
        function reveal() {
            document.getElementById('icon').style.display = 'none';
            document.getElementById('tap-text').style.display = 'none';
            document.getElementById('msg').style.display = 'block';
            document.getElementById('final-note').style.display = 'block';
            document.getElementById('box').style.borderColor = 'transparent';
            createBurst();
        }

        function createBurst() {
            for(let i=0; i<30; i++) {
                let dot = document.createElement('div');
                dot.className = 'dot';
                let size = Math.random() * 5 + 'px';
                dot.style.width = size; dot.style.height = size;
                dot.style.left = '50%'; dot.style.top = '50%';
                document.body.appendChild(dot);
                
                let angle = Math.random() * Math.PI * 2;
                let dist = Math.random() * 200 + 50;
                
                dot.animate([
                    { transform: 'translate(0,0)', opacity: 1 },
                    { transform: `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`, opacity: 0 }
                ], { duration: 1500, easing: 'ease-out' }).onfinish = () => dot.remove();
            }
        }
    </script>
</body>
</html>
