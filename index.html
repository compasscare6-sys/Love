<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Queen Anu ❤️</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #4a00e0, #ff0040, #ff4d6d);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
        text-align: center;
    }

    .floater {
        position: absolute;
        opacity: 0;
        z-index: 1;
        pointer-events: none;
        animation: floatUp linear forwards;
    }

    @keyframes floatUp {
        0% { transform: translateY(110vh) rotate(0deg); opacity: 1; }
        100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
    }

    .box {
        background: rgba(255, 255, 255, 0.98);
        padding: 40px 25px;
        border-radius: 40px;
        box-shadow: 0 30px 70px rgba(0,0,0,0.4);
        max-width: 480px;
        width: 88%;
        position: relative;
        z-index: 10;
        border: 4px solid #ffccd5;
    }

    .top-emoji {
        font-size: 75px;
        margin-bottom: 10px;
    }

    h1.heading-text {
        color: #d90429;
        font-size: 35px;
        margin-bottom: 20px;
        font-weight: 900;
        line-height: 1.2;
    }

    .btn-hold {
        background: #d90429;
        color: white;
        border: none;
        padding: 20px 45px;
        font-size: 24px;
        border-radius: 60px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.5s;
        box-shadow: 0 10px 25px rgba(217, 4, 41, 0.4);
    }

    .btn-hold:hover {
        transform: scale(1.1) translateY(-5px);
        background: #800000;
        box-shadow: 0 15px 30px rgba(128, 0, 0, 0.5);
    }

    #love-message {
        display: none;
        animation: slideUp 1s ease-out;
    }

    .main-text {
        font-size: 26px;
        color: #800000;
        font-weight: 900;
        margin-bottom: 15px;
        line-height: 1.4;
    }

    .always-with-you {
        font-size: 28px;
        color: #d90429;
        font-weight: bold;
        display: block;
        margin-top: 10px;
        animation: pulse 1.5s infinite;
    }

    .final-love {
        font-size: 30px;
        color: #ff0040;
        margin-top: 20px;
        font-weight: 900;
        border-top: 2px dashed #ffccd5;
        padding-top: 15px;
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }
</style>
</head>
<body>

<div class="box">
    <div id="initial-content">
        <div class="top-emoji">👸💖</div>
        <h1 class="heading-text">Jaan, Udass Bilkul Nahi Hona...</h1>
        <button class="btn-hold" onclick="showLove()">Mera Hath Pakroo 🤝</button>
    </div>

    <div id="love-message">
        <div class="main-text">
            Tum mujhe deserve karti hooo meri Duniya tum hoo meri kainat meri Zindagi meri Jaan.
        </div>
        
        <div class="always-with-you">
            I am always with you Jaan! ❤️
        </div>

        <div class="final-love">
            I Love You Sooo Much Anu 💋
        </div>
    </div>
</div>

<script>
    function createEffect(emoji) {
        const el = document.createElement('div');
        el.classList.add('floater');
        el.innerText = emoji;
        el.style.left = Math.random() * 100 + 'vw';
        
        // Random size for variety
        let size = Math.random() * 25 + 40; 
        el.style.fontSize = size + 'px';
        
        el.style.animationDuration = Math.random() * 2 + 4 + 's';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 6000);
    }

    // Piche halki si barish flowers aur hearts ki
    setInterval(() => createEffect('🌸'), 1200);
    setInterval(() => createEffect('✨'), 2000);

    function showLove() {
        document.getElementById('initial-content').style.display = 'none';
        const msg = document.getElementById('love-message');
        msg.style.display = 'block';
        
        // Button dabane par dher saare effects
        setInterval(() => createEffect('❤️'), 400);
        setInterval(() => createEffect('💋'), 600);
        setInterval(() => createEffect('🫂'), 800);
        setInterval(() => createEffect('🌹'), 1000);
    }
</script>

</body>
</html>
