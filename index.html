<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Jar for Anu ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400&display=swap');

        body {
            margin: 0; height: 100vh; display: flex;
            justify-content: center; align-items: center;
            background: #0f0c29; 
            background: linear-gradient(to bottom, #24243e, #302b63, #0f0c29);
            font-family: 'Poppins', sans-serif; overflow: hidden; color: white;
        }

        /* The Magic Jar */
        .jar-container {
            position: relative; cursor: pointer;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .jar {
            width: 150px; height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px 20px 80px 80px;
            position: relative; backdrop-filter: blur(5px);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }

        .jar::after { /* Jar Lid */
            content: ''; position: absolute; top: -15px; left: 50%;
            transform: translateX(-50%); width: 80px; height: 20px;
            background: #8e44ad; border-radius: 5px;
        }

        .lights { /* Glowing lights inside jar */
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%); width: 100px; height: 100px;
            background: radial-gradient(circle, #f1c40f, transparent);
            filter: blur(15px); animation: glow 2s infinite alternate;
        }

        @keyframes glow { from { opacity: 0.5; } to { opacity: 1; } }

        /* Message Pop-up */
        #message-box {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 80%; max-width: 400px;
            background: white; color: #333;
            padding: 30px; border-radius: 20px;
            text-align: center; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        #message-box.active { transform: translate(-50%, -50%) scale(1); }

        h2 { font-family: 'Dancing Script', cursive; color: #e91e63; font-size: 2.5rem; }
        .tap-text { position: absolute; bottom: -50px; width: 100%; text-align: center; font-size: 0.8rem; letter-spacing: 2px; opacity: 0.7; }

    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="song.mp3.mp3" type="audio/mpeg">
    </audio>

    <div class="jar-container" onclick="openMessage()">
        <div class="jar">
            <div class="lights"></div>
        </div>
        <div class="tap-text">TAP TO OPEN A MEMORY</div>
    </div>

    <div id="message-box">
        <h2 id="title">Hi Anu! ❤️</h2>
        <p id="content">Loading a sweet memory...</p>
        <button onclick="closeMessage()" style="margin-top: 20px; padding: 10px 20px; border: none; background: #e91e63; color: white; border-radius: 50px; cursor: pointer;">Next Memory ✨</button>
    </div>

    <script>
        const messages = [
            { t: "My World", c: "Anu, aapki smile meri sabse badi kamyabi hai. Coaching se aakar thak jati ho, par mere liye hamesha muskuraati ho." },
            { t: "Hamesha Saath", c: "Aj meri birthday hai, par mera sabse bada gift toh aap hi ho. I'm so lucky to have you, Pabi." },
            { t: "Sorry Section", c: "Agar kabhi mera gussa bura laga ho toh sorry, lekin pyaar hamesha sacha rahega. ❤️" },
            { t: "Jaan Ban Gaye", c: "Aap sach mein meri zindagi ki har khushi ho. Bas aise hi hamesha mere saath rehna." }
        ];

        let index = 0;

        function openMessage() {
            const audio = document.getElementById('bgMusic');
            audio.play().catch(e => console.log("Play blocked"));

            const box = document.getElementById('message-box');
            document.getElementById('title').innerText = messages[index].t;
            document.getElementById('content').innerText = messages[index].c;
            box.classList.add('active');
        }

        function closeMessage() {
            const box = document.getElementById('message-box');
            box.classList.remove('active');
            
            // Move to next message
            index = (index + 1) % messages.length;
            
            // Auto-reopen after a short delay for a "pop" effect
            setTimeout(() => {
                if(index !== 0) openMessage();
            }, 600);
        }
    </script>
</body>
</html>
