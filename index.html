<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For My Love ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    text-align: center;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(to right, #ff9a9e, #fad0c4);
    overflow: hidden;
}

h1 {
    margin-top: 80px;
    color: white;
    font-size: 40px;
}

p {
    color: white;
    font-size: 20px;
}

button {
    padding: 12px 25px;
    font-size: 18px;
    border: none;
    border-radius: 25px;
    background: #ff4d6d;
    color: white;
    cursor: pointer;
    margin-top: 20px;
}

button:hover {
    background: #ff1e4d;
}

#message {
    margin-top: 20px;
    font-size: 22px;
    font-weight: bold;
}

/* Floating hearts */
.heart {
    position: absolute;
    color: red;
    font-size: 20px;
    animation: float 5s linear infinite;
}

@keyframes float {
    0% {
        transform: translateY(100vh);
        opacity: 1;
    }
    100% {
        transform: translateY(-10vh);
        opacity: 0;
    }
}
</style>

</head>

<body>

<h1>Hi My Beautiful Wife ❤️</h1>
<p>You are the best thing in my life 💖</p>

<button onclick="showLove()">Click for Surprise 😍</button>

<p id="message"></p>

<!-- Music -->
<audio id="music" loop>
  <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg">
</audio>

<script>
const messages = [
    "I love you more every day 💕",
    "You are my happiness 😘",
    "My life is beautiful because of you ❤️",
    "You are my dream come true 🌹",
    "Forever yours 💖"
];

function showLove() {
    let random = Math.floor(Math.random() * messages.length);
    document.getElementById("message").innerHTML = messages[random];

    document.getElementById("music").play();

    createHearts();
}

function createHearts() {
    for (let i = 0; i < 20; i++) {
        let heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 5000);
    }
}
</script>

</body>
</html>
