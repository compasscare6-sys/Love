<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry Anu Baby ❤️</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #4a00e0, #ff0040, #ff4d6d);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
        text-align: center;
    }

    /* Floating Kisses & Hearts */
    .floater {
        position: absolute;
        opacity: 0;
        z-index: 1;
        pointer-events: none;
        animation: floatUp linear forwards;
    }

    @keyframes floatUp {
        0% { transform: translateY(110vh) rotate(0deg); opacity: 1; }
        100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
    }

    .box {
        background: rgba(255, 255, 255, 0.95);
        padding: 30px 20px;
        border-radius: 40px;
        box-shadow: 0 30px 70px rgba(0,0,0,0.4);
        max-width: 450px;
        width: 90%;
        position: relative;
        z-index: 10;
        border: 4px solid #ffccd5;
    }

    /* Teddy Bear CSS */
    .teddy {
        position: relative;
        width: 150px;
        height: 150px;
        background: #fff;
        border-radius: 50% 50% 45% 45%;
        margin: 0 auto 20px;
        box-shadow: inset -10px -10px 20px #f0f0f0, 0 10px 20px rgba(0,0,0,0.1);
    }
    .teddy::before, .teddy::after { /* Ears */
        content: '';
        position: absolute;
        width: 45px;
        height: 45px;
        background: #fff;
        border-radius: 50%;
        top: -5px;
        z-index: -1;
    }
    .teddy::before { left: 10px; }
    .teddy::after { right: 10px; }
    
    .teddy-face {
        position: relative;
        top: 40px;
    }
    .eye {
        width: 12px;
        height: 12px;
        background: #333;
        border-radius: 50%;
        display: inline-block;
        margin: 0 15px;
    }
    .nose {
        width: 16px;
        height: 12px;
        background: #ff99aa;
        border-radius: 50%;
        margin: 5px auto;
    }
    .sorry-text {
        background: #ff4d6d;
        color: white;
        font-size: 12px;
        padding: 5px 10px;
        border-radius: 10px;
        font-weight: bold;
        display: inline-block;
        margin-top: 15px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .chocolate {
        position: absolute;
        right: -20px;
        top: 50%;
        font-size: 50px;
        transform: rotate(15deg);
    }

    h1.heading-text {
        color: #d90429;
        font-size: 38px;
        margin: 10px 0;
        font-weight: 900;
    }

    .btn-sorry {
        background: #d90429;
        color: white;
        border: none;
        padding: 18px 30px;
        font-size: 20px;
        border-radius: 50px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.4s;
        box-shadow: 0 8px 20px rgba(217, 4, 41, 0.3);
    }

    .btn-sorry:hover {
        transform: scale(1.05);
        background: #ff0040;
    }

    #message-content {
        display: none;
        animation: fadeIn 1s ease-in;
    }

    .poetry {
        font-size: 20px;
        color: #800000;
        font-style: italic;
        line-height: 1.5;
        margin-bottom: 20px;
    }

    .sub-text {
        font-size: 18px;
        color: #d90429;
        font-weight: bold;
        margin-bottom: 15px;
    }

    .final-note {
        font-size: 22px;
        color: #ff0040;
        font-weight: 900;
        border-top: 2px solid #ffccd5;
        padding-top: 15px;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
</style>
</head>
<body>

<div class="box">
    <div id="initial-screen">
        <div class="teddy">
            <div class="teddy-face">
                <div class="eye"></div>
                <div class="eye"></div>
                <div class="nose"></div>
                <div class="sorry-text">SORRY BEGUM</div>
            </div>
        </div>

        <div class="chocolate">🍫</div>
        
        <h1 class="heading-text">Sorry Baba 🥺</h1>
        <button class="btn-sorry" onclick="revealLove()">Dil Karey tu Buttton dabadena</button>
    </div>

    <div id="message-content">
        <div class="poetry">
            “Mana thora sa shor karta hoon, thora sa tang bhi,<br>
            Par begum, meri har khamoshi mein bhi sirf tum hi tum ho.” 💖
        </div>
        
        <div class="sub-text">
            Maaf kardena kal ke liye ANU SORRY BABA 🙏
        </div>

        <div class="final-note">
            I Love You Meri Zindagi Meri Jeeney ki waja Mere Jaan Wifey 💋
        </div>
    </div>
</div>

<script>
    function createEffect(emoji) {
        const el = document.createElement('div');
        el.classList.add('floater');
        el.innerText = emoji;
        el.style.left = Math.random() * 100 + 'vw';
        let size = Math.random() * 20 + 30; 
        el.style.fontSize = size + 'px';
        el.style.animationDuration = Math.random() * 3 + 3 + 's';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 6000);
    }

    // Background effects
    setInterval(() => createEffect('💋'), 1000);
    setInterval(() => createEffect('❤️'), 1500);

    function revealLove() {
        document.getElementById('initial-screen').style.display = 'none';
        document.getElementById('message-content').style.display = 'block';
        
        // Extra celebration on click
        setInterval(() => createEffect('🌹'), 500);
        setInterval(() => createEffect('✨'), 700);
        setInterval(() => createEffect('🧸'), 900);
    }
</script>

</body>
</html>
