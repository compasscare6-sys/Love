<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Anu Jaan ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;600&family=Great+Vibes&display=swap');

        :root {
            --primary: #ff3366;
            --gold: #ffd700;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            background: #050505;
            color: white;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1200px; /* Stronger 3D depth */
        }

        /* Ambient Background */
        .bg-glow {
            position: fixed;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 50%, #3d001f 0%, #000 80%);
            z-index: -1;
        }

        /* --- 3D FLOATING CAKE (CSS ART) --- */
        #cake-3d {
            position: relative;
            width: 100px;
            height: 100px;
            transform-style: preserve-3d;
            transform: rotateX(-20deg) rotateY(20deg);
            animation: floatCake 4s infinite ease-in-out;
            margin-bottom: 50px;
        }

        @keyframes floatCake {
            0%, 100% { transform: translateY(0) rotateX(-20deg) rotateY(20deg); }
            50% { transform: translateY(-20px) rotateX(-10deg) rotateY(40deg); }
        }

        .cake-layer {
            position: absolute;
            width: 100px;
            height: 60px;
            background: var(--primary);
            border-radius: 50%;
            border: 2px solid var(--gold);
            box-shadow: 0 10px 30px rgba(255, 51, 102, 0.5);
        }

        .cake-top { transform: translateY(-20px); background: #ff5e84; display: flex; justify-content: center; align-items: center; font-size: 25px; }
        .candle {
            position: absolute;
            width: 8px;
            height: 30px;
            background: var(--gold);
            top: -45px;
            border-radius: 5px;
        }
        .flame {
            position: absolute;
            width: 10px;
            height: 15px;
            background: orange;
            top: -15px;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px orange;
            animation: flicker 0.1s infinite;
        }

        @keyframes flicker {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        /* --- INTERACTIVE CARD --- */
        #main-card {
            display: none;
            width: 85%;
            max-width: 450px;
            padding: 40px;
            background: var(--glass);
            border-radius: 50px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            backdrop-filter: blur(25px);
            text-align: center;
            transform-style: preserve-3d;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            z-index: 10;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 4rem;
            margin: 0;
            background: linear-gradient(to right, #fff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .message-box {
            font-size: 1.1rem;
            line-height: 1.8;
            margin: 20px 0;
            color: #eee;
        }

        .heart-3d {
            font-size: 50px;
            display: inline-block;
            animation: heartbeat 1.5s infinite;
            filter: drop-shadow(0 0 10px var(--primary));
        }

        @keyframes heartbeat {
            0% { transform: scale(1) translateZ(0); }
            15% { transform: scale(1.2) translateZ(50px); }
            30% { transform: scale(1) translateZ(0); }
        }

        /* --- GIFT BOX TRIGGER --- */
        #gift-trigger {
            cursor: pointer;
            text-align: center;
            transition: 0.5s;
        }

        .box-3d {
            font-size: 120px;
            filter: drop-shadow(0 0 30px var(--primary));
            animation: rotateBox 3s infinite linear;
        }

        @keyframes rotateBox {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        /* --- FLOATING ELEMENTS --- */
        .floater {
            position: absolute;
            pointer-events: none;
            animation: fall 6s linear forwards;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        .btn-magic {
            background: transparent;
            color: var(--gold);
            border: 2px solid var(--gold);
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.4s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-magic:hover {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 30px var(--gold);
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div id="gift-trigger" onclick="unfold()">
        <div class="box-3d">🎁</div>
        <h2 style="color: var(--gold); font-family: 'Dancing Script';">Tap to Open My Heart...</h2>
    </div>

    <div id="main-card">
        <div id="cake-3d">
            <div class="cake-layer"></div>
            <div class="cake-layer cake-top">
                <div class="candle"><div class="flame"></div></div>
                🎂
            </div>
        </div>

        <h1 id="title">Happy Birthday!</h1>
        
        <div class="message-box">
            <p>"Anu Jaan, Aap meri zindagi ki sabse haseen sachayi ho. Aaj ka din aapke naam, aur meri har saans aapke liye."</p>
            <div class="heart-3d">❤️</div>
            <p style="font-family: 'Dancing Script'; font-size: 1.6rem; color: var(--gold);">
                Hamesha Ke Liye Tumhara...
            </p>
        </div>

        <button class="btn-magic" onclick="surpriseMode()">Make a Wish! ✨</button>
    </div>

    <script>
        function unfold() {
            const trigger = document.getElementById('gift-trigger');
            trigger.style.transform = 'translateZ(500px) rotateY(180deg)';
            trigger.style.opacity = '0';
            
            setTimeout(() => {
                trigger.style.display = 'none';
                const card = document.getElementById('main-card');
                card.style.display = 'block';
                card.animate([
                    { transform: 'scale(0.5) rotateX(90deg)', opacity: 0 },
                    { transform: 'scale(1) rotateX(0deg)', opacity: 1 }
                ], { duration: 1200, easing: 'cubic-bezier(0.175, 0.885, 0.32, 1.275)' });
                
                startRain();
            }, 600);
        }

        function spawn(symbol) {
            const el = document.createElement('div');
            el.className = 'floater';
            el.innerHTML = symbol;
            el.style.left = Math.random() * 100 + 'vw';
            el.style.fontSize = (Math.random() * 30 + 20) + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 6000);
        }

        function startRain() {
            setInterval(() => spawn('💖'), 400);
            setInterval(() => spawn('✨'), 800);
            setInterval(() => spawn('🧸'), 2500);
            setInterval(() => spawn('💍'), 4000);
        }

        function surpriseMode() {
            document.getElementById('title').innerText = "I Love You Anu!";
            document.body.style.background = "radial-gradient(circle, #4d0026 0%, #000 100%)";
            
            // Explosion of love
            for(let i=0; i<50; i++) {
                setTimeout(() => spawn(['❤️','🌸','💎','🧸'][Math.floor(Math.random()*4)]), i * 50);
            }
        }
    </script>
</body>
</html>
