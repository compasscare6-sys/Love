<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic for Anu</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300&display=swap');

        body {
            margin: 0; padding: 0; height: 100vh;
            background: radial-gradient(circle, #1a0a10, #000);
            display: flex; justify-content: center; align-items: center;
            flex-direction: column; overflow: hidden;
            color: white; font-family: 'Poppins', sans-serif;
        }

        /* The Flower Container */
        #flower-stage {
            cursor: pointer; position: relative;
            width: 200px; height: 200px;
            display: flex; justify-content: center; align-items: center;
        }

        .heart-icon {
            font-size: 100px; color: #ff4757;
            transition: all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 0 10px #ff4757);
        }

        /* After blooming effect */
        .bloomed {
            transform: scale(2.5) rotate(360deg);
            opacity: 0;
        }

        #final-message {
            position: absolute; text-align: center;
            opacity: 0; transition: 2s opacity ease-in;
            z-index: 10; width: 80%;
        }

        .queen-text {
            font-family: 'Great Vibes', cursive;
            font-size: 4rem; color: #d4af37;
            margin: 0; text-shadow: 0 0 20px rgba(212, 175, 55, 0.8);
        }

        .sub-text {
            font-size: 1.2rem; color: #fce4ec;
            margin-top: 20px; line-height: 1.6;
        }

        .hint {
            position: absolute; bottom: 50px;
            opacity: 0.6; letter-spacing: 2px;
            animation: blink 2s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }
    </style>
</head>
<body>

    <div id="flower-stage" onclick="bloom()">
        <div class="heart-icon" id="target">❤️</div>
    </div>

    <div id="final-message">
        <h1 class="queen-text">Anu</h1>
        <p class="sub-text">
            Jaise ye dil khila hai, waise hi aapne meri zindagi ko rangon se bhar diya hai. <br>
            Aap sirf meri wife nahi, meri poori kaaynat ho. ❤️
        </p>
    </div>

    <div class="hint" id="hint-text">TAP THE HEART TO BLOOM</div>

    <script>
        let isBloomed = false;

        function bloom() {
            if(isBloomed) return;
            isBloomed = true;

            const target = document.getElementById('target');
            const message = document.getElementById('final-message');
            const hint = document.getElementById('hint-text');

            // Animation
            target.classList.add('bloomed');
            hint.style.display = 'none';

            setTimeout(() => {
                target.style.display = 'none';
                message.style.opacity = '1';
                createSparkles();
            }, 1000);
        }

        function createSparkles() {
            for(let i=0; i<50; i++) {
                let sparkle = document.createElement('div');
                sparkle.style.position = 'absolute';
                sparkle.style.width = '4px';
                sparkle.style.height = '4px';
                sparkle.style.background = '#d4af37';
                sparkle.style.borderRadius = '50%';
                sparkle.style.left = '50%';
                sparkle.style.top = '50%';
                
                let destinationX = (Math.random() - 0.5) * window.innerWidth;
                let destinationY = (Math.random() - 0.5) * window.innerHeight;

                document.body.appendChild(sparkle);

                sparkle.animate([
                    { transform: 'translate(0, 0)', opacity: 1 },
                    { transform: `translate(${destinationX}px, ${destinationY}px)`, opacity: 0 }
                ], {
                    duration: Math.random() * 2000 + 1000,
                    easing: 'cubic-bezier(0, .9, .57, 1)'
                }).onfinish = () => sparkle.remove();
            }
        }
    </script>
</body>
</html>
