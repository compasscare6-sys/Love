<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Surprise</title>
    <style>
        body {
            background-color: #fce4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .gift-container {
            text-align: center;
            cursor: pointer;
            transition: transform 0.5s;
        }

        .gift-box {
            font-size: 150px;
            transition: 0.5s;
        }

        .gift-box:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .hidden-content {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 400px;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { color: #e91e63; }
        p { color: #444; line-height: 1.6; font-size: 1.1rem; }

        /* Confetti effect */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            animation: fall 3s linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="gift-container" id="giftSection" onclick="openGift()">
        <div class="gift-box">🎁</div>
        <p style="color: #ad1457; font-weight: bold;">Tap to Open Your Surprise</p>
    </div>

    <div class="hidden-content" id="messageSection">
        <h2>For My Queen ❤️</h2>
        <p>Aapki muskurahat mere liye sabse badi nemat hai. Main sirf ye batana chahta hoon ke aap mere liye kitni precious ho. Allah humein hamesha aise hi khush rakhe. </p>
        <p><strong>I Love You!</strong></p>
    </div>

    <script>
        function openGift() {
            document.getElementById('giftSection').style.display = 'none';
            document.getElementById('messageSection').style.display = 'block';
            
            // Create Confetti
            for (let i = 0; i < 100; i++) {
                createConfetti();
            }
        }

        function createConfetti() {
            const colors = ['#ff4081', '#7c4dff', '#00e5ff', '#ffea00', '#ff3d00'];
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDuration = (Math.random() * 2 + 3) + 's';
            confetti.style.opacity = Math.random();
            document.body.appendChild(confetti);

            setTimeout(() => { confetti.remove(); }, 4000);
        }
    </script>
</body>
</html>
