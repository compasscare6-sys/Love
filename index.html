<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Queen Anu ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;600&family=Great+Vibes&display=swap');

        :root {
            --primary: #ff3366;
            --gold: #ffd700;
            --deep-red: #4a0014;
        }

        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: white;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1500px;
            transition: background 2s;
        }

        /* Ambient Romantic Glow */
        .ambient-light {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, var(--deep-red) 0%, #000 80%);
            z-index: -1;
            animation: pulseGlow 4s infinite alternate;
        }

        @keyframes pulseGlow {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }

        /* --- 3D INTERACTIVE CARD --- */
        #main-container {
            text-align: center;
            z-index: 10;
            transform-style: preserve-3d;
        }

        .card {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 60px 0 60px 0; /* Romantic asymmetrical shape */
            border: 2px solid rgba(255, 51, 102, 0.4);
            backdrop-filter: blur(30px);
            box-shadow: 0 0 50px rgba(255, 51, 102, 0.2);
            max-width: 450px;
            width: 85%;
            transform: rotateY(-5deg);
            animation: cardFloat 3s infinite ease-in-out;
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0) rotateY(-5deg); }
            50% { transform: translateY(-15px) rotateY(5deg); }
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 4.5rem;
            color: var(--primary);
            margin: 0;
            text-shadow: 0 0 25px rgba(255, 51, 102, 0.6);
        }

        .romantic-text {
            font-size: 1.2rem;
            line-height: 1.8;
            margin: 25px 0;
            font-style: italic;
            color: #fff;
        }

        /* --- KISSES & FLOATING ELEMENTS --- */
        .kiss-particle {
            position: absolute;
            pointer-events: none;
            z-index: 100;
            animation: kissFall 4s linear forwards;
            filter: drop-shadow(0 0 10px var(--primary));
        }

        @keyframes kissFall {
            0% { transform: translateY(-10vh) rotate(0deg) scale(0); opacity: 0; }
            20% { opacity: 1; transform: translateY(10vh) rotate(20deg) scale(1.5); }
            100% { transform: translateY(110vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        /* --- ROMANTIC BUTTON --- */
        .btn-love {
            background: linear-gradient(45deg, var(--primary), #b3002d);
            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 51, 102, 0.5);
            transition: 0.4s;
            position: relative;
            overflow: hidden;
        }

        .btn-love:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 15px 40px var(--primary);
        }

        /* --- INITIAL GIFT BOX --- */
        #intro {
            cursor: pointer;
            transition: 1s;
        }

        .floating-heart {
            font-size: 150px;
            animation: heartbeat 1.2s infinite;
            filter: drop-shadow(0 0 40px var(--primary));
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
    </style>
</head>
<body>

    <div class="ambient-light"></div>

    <div id="intro" onclick="openSurprise()">
        <div class="floating-heart">❤️</div>
        <h2 style="color: #fff; font-family: 'Dancing Script'; letter-spacing: 2px;">Tap to feel my love...</h2>
    </div>

    <div id="main-container">
        <div class="card" id="card">
            <div style="font-size: 50px; margin-bottom: 10px;">🌹🧸🎂</div>
            <h1>Happy Birthday!</h1>
            <p class="romantic-text">
                "Anu Jaan, Meri har dua aap se shuru ho kar aap par hi khatam hoti hai. 
                Aap ke saath guzra har pal mere liye jannat hai. Allah humein hamesha aise hi saath rakhe."
            </p>
            <p style="font-family: 'Dancing Script'; font-size: 1.8rem; color: var(--gold); margin-bottom: 30px;">
                I Love You Forever, My Jaan! ❤️
            </p>
            <button class="btn-love" onclick="sendKisses()">Yahan Click Karein 💋</button>
        </div>
    </div>

    <script>
        function openSurprise() {
            const intro = document.getElementById('intro');
            intro.style.opacity = '0';
            intro.style.transform = 'scale(2) rotate(10deg)';
            
            setTimeout(() => {
                intro.style.display = 'none';
                const card = document.getElementById('card');
                card.style.display = 'block';
                // Trigger kiss rain automatically on open
                sendKisses();
                // Add secondary rain
                setInterval(() => spawnElement('💖'), 2000);
            }, 800);
        }

        function spawnElement(symbol, isKiss = false) {
            const el = document.createElement('div');
            el.className = isKiss ? 'kiss-particle' : 'kiss-particle';
            el.innerHTML = symbol;
            el.style.left = Math.random() * 95 + 'vw';
            el.style.fontSize = (Math.random() * 25 + (isKiss ? 40 : 20)) + 'px';
            el.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 4500);
        }

        function sendKisses() {
            // Intense Kiss Rain
            for(let i=0; i<40; i++) {
                setTimeout(() => {
                    spawnElement('💋', true);
                    // Add some hearts in between
                    if(i % 3 === 0) spawnElement('❤️');
                }, i * 100);
            }
            
            // Subtle change in background glow on click
            document.querySelector('.ambient-light').style.background = 
                "radial-gradient(circle at center, #800020 0%, #000 80%)";
        }
    </script>
</body>
</html>
