<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Anu 🌸</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #1e293b; /* Initial angry/sad dark background */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.8s ease;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 25px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.8s ease;
        }

        /* When active (Happy state) */
        body.happy-mode {
            background: linear-gradient(135deg, #fff1f2, #ffe4e6);
        }

        body.happy-mode .container {
            background: white;
            border-color: white;
            box-shadow: 0 15px 35px rgba(244, 63, 94, 0.1);
        }

        .emoji {
            font-size: 60px;
            margin-bottom: 20px;
            transition: transform 0.5s ease;
        }

        h1 {
            color: #f1f5f9;
            font-size: 22px;
            margin-bottom: 15px;
            transition: color 0.5s ease;
        }

        body.happy-mode h1 {
            color: #9f1239;
        }

        .message {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
            transition: color 0.5s ease;
        }

        body.happy-mode .message {
            color: #334155;
            font-weight: 500;
        }

        /* Toggle Switch Styling */
        .switch-container {
            margin: 20px 0;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 70px;
            height: 38px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #475569;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 30px;
            width: 30px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #f43f5e;
        }

        input:checked + .slider:before {
            transform: translateX(32px);
        }

        .footer {
            font-size: 12px;
            color: #475569;
            margin-top: 25px;
            transition: color 0.5s ease;
        }

        body.happy-mode .footer {
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="emoji" id="emoji">⚡</div>
        <h1 id="heading">Mood: Angry/Upset 😶‍🌫️</h1>
        
        <div class="message" id="msg">
            Main janta huun kal aap theek thi aur aaj meri wajah se aapka mood bohot kharab hua. Maine bina pooche package kiya jo mujhe nahi karna chahiye tha. I am really very sorry, Anna.
        </div>

        <div class="switch-container">
            <label class="switch">
                <input type="checkbox" id="mood-toggle" onchange="toggleMood()">
                <span class="slider"></span>
            </label>
            <p id="toggle-hint" style="font-size: 12px; color: #64748b; margin-top: 8px;">Turn this on if you can forgive me a little bit...</p>
        </div>

        <div class="footer" id="footer-text">From: Lali</div>
    </div>

    <script>
        function toggleMood() {
            const checkbox = document.getElementById('mood-toggle');
            const body = document.body;
            const emoji = document.getElementById('emoji');
            const heading = document.getElementById('heading');
            const msg = document.getElementById('msg');
            const hint = document.getElementById('toggle-hint');
            const footer = document.getElementById('footer-text');

            if (checkbox.checked) {
                body.classList.add('happy-mode');
                emoji.innerText = "🌸❤️";
                heading.innerText = "Thank You, Guriya ✨";
                msg.innerHTML = "Mera maksad aapko gussa dilana ya pareshan karna bilkul nahi tha, bas aap bimar thi toh care mein kar diya. Par aage se main pakka har cheez aap se pooch kar hi karunga. Please ab aaram karo aur dawa kha lo. I Love You! 💋";
                hint.innerText = "Mood successfully switched! 😊";
                footer.innerText = "Tera Pabi ❤️";
                emoji.style.transform = "scale(1.1)";
            } else {
                body.classList.remove('happy-mode');
                emoji.innerText = "⚡";
                heading.innerText = "Mood: Angry/Upset 😶‍🌫️";
                msg.innerText = "Main janta huun kal aap theek thi aur aaj meri wajah se aapka mood bohot kharab hua. Maine bina pooche package kiya jo mujhe nahi karna chahiye tha. I am really very sorry, Anna.";
                hint.innerText = "Turn this on if you can forgive me a little bit...";
                footer.innerText = "From: Lali";
                emoji.style.transform = "scale(1)";
            }
        }
    </script>
</body>
</html>
