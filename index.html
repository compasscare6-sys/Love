<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rabi & Anu - Romantic Quiz & Love Meter 🎯❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sacramento&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #fce7f3 0%, #f3e8ff 50%, #ffe4e6 100%);
      color: #4c1d95;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
      user-select: none;
    }

    /* Container Card */
    .quiz-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border: 2px solid #f472b6;
      border-radius: 28px;
      padding: 35px 25px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 20px 45px rgba(244, 114, 182, 0.25);
      text-align: center;
      position: relative;
    }

    /* Love Meter Progress Bar */
    .progress-container {
      width: 100%;
      background: #fbcfe8;
      height: 12px;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 25px;
      border: 1px solid #f472b6;
    }

    .progress-bar {
      height: 100%;
      width: 25%;
      background: linear-gradient(90deg, #f472b6, #e11d48);
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    /* Question Styles */
    .q-number {
      font-size: 0.8rem;
      font-weight: 700;
      color: #be123c;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .q-title {
      font-family: 'Caveat', cursive;
      font-size: 2.1rem;
      color: #701a75;
      line-height: 1.3;
      margin-bottom: 25px;
    }

    /* Option Buttons */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 15px;
    }

    .btn-option {
      background: #ffffff;
      border: 1.5px solid #f472b6;
      border-radius: 18px;
      padding: 14px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #4a044e;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(244, 114, 182, 0.1);
    }

    .btn-option:hover {
      background: #fce7f3;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(244, 114, 182, 0.2);
    }

    .btn-option:active {
      transform: scale(0.98);
    }

    /* Certificate Section (Initially Hidden) */
    .certificate-box {
      display: none;
      animation: zoomIn 0.5s ease-out forwards;
    }

    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .cert-badge {
      font-size: 3.5rem;
      margin-bottom: 10px;
    }

    .cert-title {
      font-family: 'Caveat', cursive;
      font-size: 2.5rem;
      color: #be123c;
      margin-bottom: 5px;
    }

    .cert-sub {
      font-size: 0.85rem;
      color: #a21caf;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .cert-card {
      background: #fff5f8;
      border: 2px dashed #f472b6;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 22px;
    }

    .couple-names {
      font-family: 'Caveat', cursive;
      font-size: 2.2rem;
      color: #831843;
      margin-bottom: 8px;
    }

    .match-percent {
      font-size: 1.8rem;
      font-weight: 800;
      color: #e11d48;
      margin-bottom: 10px;
    }

    .cert-message {
      font-size: 0.92rem;
      color: #4a044e;
      line-height: 1.6;
    }

    .signature {
      font-family: 'Sacramento', cursive;
      font-size: 2rem;
      color: #be123c;
      margin-top: 15px;
    }

    .btn-restart {
      background: linear-gradient(135deg, #f472b6 0%, #e11d48 100%);
      color: white;
      border: none;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(225, 29, 72, 0.25);
    }

    /* Confetti Particle */
    .confetti {
      position: fixed;
      pointer-events: none;
      z-index: 10000;
      animation: confettiFall 2.5s ease-out forwards;
    }

    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="quiz-card">
    
    <!-- QUIZ SECTION -->
    <div id="quizBox">
      <!-- Progress Bar -->
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="q-number" id="qNumber">Question 1 of 4</div>
      <h2 class="q-title" id="qTitle">Who fell in love first? 💘</h2>

      <div class="options-grid" id="optionsGrid">
        <!-- Options rendered dynamically -->
      </div>
    </div>

    <!-- CERTIFICATE SECTION (Hidden) -->
    <div class="certificate-box" id="certBox">
      <div class="cert-badge">👑💖</div>
      <h2 class="cert-title">Love Match Certificate</h2>
      <div class="cert-sub">OFFICIALLY SEALED WITH LOVE</div>

      <div class="cert-card">
        <div class="couple-names">Rabi  Anu</div>
        <div class="match-percent">100% PERFECT MATCH 💕</div>
        <div class="cert-message">
          "Verified by hearts! No matter who gets angry first or who fell in love first—Rabi & Anu are made for each other forever and always." 🌸✨
        </div>
        <div class="signature">yours, completely — RABI</div>
      </div>

      <button class="btn-restart" onclick="restartQuiz()">PLAY AGAIN 🔄</button>
    </div>

  </div>

  <script>
    const quizData = [
      {
        question: "Who fell in love first? 💘",
        options: [
          { text: "Rabi (Obviously!) 🙋‍♂️", icon: "❤️" },
          { text: "Anu (Secretly!) 👸", icon: "💖" },
          { text: "Dono ko ek sath hua tha! ✨", icon: "🌸" }
        ]
      },
      {
        question: "Who gets angrier quickly? 😤",
        options: [
          { text: "Anu (Pyara sa gussa) 💖", icon: "👑" },
          { text: "Rabi (Lekin jaldi maan jata hai) 🙈", icon: "🧸" },
          { text: "Koi nahi, dono bohot soft hain 💕", icon: "🕊️" }
        ]
      },
      {
        question: "What is Rabi's favorite thing about Anu? 🥰",
        options: [
          { text: "Her cute smile & voice 🌸", icon: "✨" },
          { text: "How she cares deeply 🫂", icon: "💖" },
          { text: "EVERY SINGLE THING! 💯", icon: "👑" }
        ]
      },
      {
        question: "Best cure for any fight or bad mood? 🩹",
        options: [
          { text: "One Tight Hug 🫂", icon: "🌸" },
          { text: "Sweet Kissi & Sorry 💋", icon: "❤️" },
          { text: "Late-night Chai & Ice Cream 🍦", icon: "✨" }
        ]
      }
    ];

    let currentQ = 0;

    function renderQuestion() {
      const q = quizData[currentQ];
      document.getElementById('qNumber').innerText = `Question ${currentQ + 1} of ${quizData.length}`;
      document.getElementById('qTitle').innerText = q.question;
      document.getElementById('progressBar').style.width = `${((currentQ + 1) / quizData.length) * 100}%`;

      const optionsGrid = document.getElementById('optionsGrid');
      optionsGrid.innerHTML = '';

      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerHTML = `<span>${opt.text}</span> <span>${opt.icon}</span>`;
        btn.onclick = (e) => selectAnswer(e);
        optionsGrid.appendChild(btn);
      });
    }

    function selectAnswer(e) {
      triggerParticles(e.clientX, e.clientY);
      
      currentQ++;
      if (currentQ < quizData.length) {
        setTimeout(renderQuestion, 300);
      } else {
        setTimeout(showCertificate, 400);
      }
    }

    function showCertificate() {
      document.getElementById('quizBox').style.display = 'none';
      document.getElementById('certBox').style.display = 'block';
      triggerConfetti();
    }

    function restartQuiz() {
      currentQ = 0;
      document.getElementById('quizBox').style.display = 'block';
      document.getElementById('certBox').style.display = 'none';
      renderQuestion();
    }

    // Tap/Click Particle Animation
    function triggerParticles(x, y) {
      const symbols = ['💖', '❤️', '✨', '🌸', '💕'];
      for (let i = 0; i < 5; i++) {
        const p = document.createElement('div');
        p.style.position = 'fixed';
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.fontSize = '20px';
        p.style.pointerEvents = 'none';
        p.innerText = symbols[Math.floor(Math.random() * symbols.length)];
        p.style.transition = 'transform 0.8s ease-out, opacity 0.8s ease-out';
        document.body.appendChild(p);

        setTimeout(() => {
          p.style.transform = `translate(${(Math.random() - 0.5) * 100}px, -80px) scale(1.3)`;
          p.style.opacity = '0';
        }, 20);

        setTimeout(() => p.remove(), 800);
      }
    }

    // Confetti Fireworks Effect for Final Certificate
    function triggerConfetti() {
      const symbols = ['💖', '❤️', '✨', '🌸', '💕', '👑', '🎉', '🌹'];
      for (let i = 0; i < 35; i++) {
        setTimeout(() => {
          const confetti = document.createElement('div');
          confetti.className = 'confetti';
          confetti.innerText = symbols[Math.floor(Math.random() * symbols.length)];
          confetti.style.left = Math.random() * 100 + 'vw';
          confetti.style.top = '-20px';
          confetti.style.fontSize = (Math.random() * 20 + 18) + 'px';
          document.body.appendChild(confetti);

          setTimeout(() => confetti.remove(), 2500);
        }, i * 50);
      }
    }

    // Initialize First Question
    renderQuestion();
  </script>

</body>
</html>
