<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikkah Invitation - Muhammad Hasnain</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Poppins:wght@300;400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: #fdfaf3; /* Cream Base */
            background-image: url('https://www.transparenttextures.com/patterns/marble-white.png');
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .card-container {
            width: 90%;
            max-width: 500px;
            background: #fff;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            border: 1px solid #e0d5c1;
            position: relative;
            overflow: hidden;
            animation: fadeIn 1.5s ease-out;
        }

        /* Floating Animation for Elements */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .bismillah {
            width: 200px;
            margin-bottom: 20px;
            animation: fadeInUp 1s ease-out;
        }

        .invite-text {
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #555;
            margin-bottom: 20px;
            animation: fadeInUp 1.2s ease-out;
        }

        .groom-name {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            color: #8c6a46; /* Bronze/Gold Color */
            margin: 10px 0;
            font-weight: 700;
            text-transform: uppercase;
            animation: fadeInUp 1.4s ease-out;
        }

        .parent-name {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
            animation: fadeInUp 1.6s ease-out;
        }

        .divider {
            width: 60%;
            height: 1px;
            background: linear-gradient(to right, transparent, #8c6a46, transparent);
            margin: 20px auto;
        }

        .date-section {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            margin: 25px 0;
            animation: fadeInUp 1.8s ease-out;
        }

        .date-box {
            border-left: 2px solid #8c6a46;
            border-right: 2px solid #8c6a46;
            padding: 0 20px;
            margin: 0 15px;
            font-weight: 700;
        }

        .venue-details {
            font-size: 0.95rem;
            line-height: 1.8;
            margin-bottom: 25px;
            animation: fadeInUp 2s ease-out;
        }

        .time-badge {
            display: inline-block;
            background: linear-gradient(145deg, #e6e6e6, #ffffff);
            padding: 12px 30px;
            border-radius: 50px;
            box-shadow: 5px 5px 15px #d1d1d1, -5px -5px 15px #ffffff;
            font-weight: 600;
            color: #444;
            margin-top: 10px;
            animation: fadeInUp 2.2s ease-out;
        }

        .note {
            font-style: italic;
            font-size: 0.85rem;
            color: #8c6a46;
            margin-top: 25px;
            animation: fadeInUp 2.4s ease-out;
        }

        .map-btn {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #8c6a46;
            font-size: 0.8rem;
            border-bottom: 1px solid #8c6a46;
            padding-bottom: 2px;
            transition: 0.3s;
        }

        .map-btn:hover { color: #5d462e; border-color: #5d462e; }

    </style>
</head>
<body>

    <div class="card-container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Bismillah.svg/1024px-Bismillah.svg.png" alt="Bismillah" class="bismillah">

        <div class="invite-text">THE DADANI FAMILY GRACIOUSLY INVITES YOU TO THE NIKKAH CEREMONY OF</div>

        <div class="groom-name">MUHAMMAD HASNAIN</div>
        <div class="parent-name">S/O MUHAMMAD FAROOQ DADANI</div>

        <div class="divider"></div>

        <div class="date-section">
            <span>SUNDAY</span>
            <div class="date-box">19 APRIL</div>
            <span>2026</span>
        </div>

        <div class="venue-details">
            <strong style="color: #8c6a46;">AFTER NAMAZ E ASAR</strong><br>
            Kanzul Eman Masjid Babri Chowk,<br>
            Gurumandir Chowrangi, Karachi
            <br>
            <a href="https://www.google.com/maps/search/Kanzul+Eman+Masjid+Gurumandir+Karachi" target="_blank" class="map-btn">📍 View on Google Maps</a>
        </div>

        <div class="time-badge">
            ASAR TIME: 5:20 PM
        </div>

        <div class="note">
            "Nikkah sirf masjid mein hai"
        </div>
    </div>

</body>
</html>
