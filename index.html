<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Queen Anu ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;600&family=Great+Vibes&display=swap');

        :root {
            --primary: #ff3366;
            --gold: #ffd700;
            --deep-red: #4a0014;
        }

        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: white;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1500px;
        }

        .ambient-light {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, var(--deep-red) 0%, #000 80%);
            z-index: -1;
            animation: pulseGlow 4s infinite alternate;
        }

        @keyframes pulseGlow {
            from { opacity: 0.5; }
            to { opacity: 0.9; }
        }

        #main-container {
            text-align: center;
            z-index: 10; /* Card kisses ke uper rahegi */
            transform-style: preserve-3d;
        }

        .card {
            display: none;
            background: rgba(20, 20, 20, 0.6);
            padding: 40px;
            border-radius: 60px 0 60px 0;
            border: 2px solid rgba(255, 51, 102, 0.4);
            backdrop-filter: blur(20px);
            box-shadow: 0 0 50px rgba(255, 51, 102, 0.2);
            max-width: 450px;
            width: 85%;
            position: relative;
            z-index: 20; /* Card hamesha front pe rahegi */
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3.5rem;
            color: var(--primary);
            margin: 0;
            text-shadow: 0 0 20px rgba(255, 51, 102, 0.5);
        }

        .romantic-text {
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 20px 0;
            color: #eee;
        }

        /* Kisses will fall BEHIND the card or to the sides */
        .kiss-particle {
            position: absolute;
            pointer-events: none;
            z-index: 5; /* Card ke peeche */
            animation: kissFall 4s linear forwards;
        }

        @keyframes kissFall {
            0% { transform: translateY(-10vh) rotate(0deg) scale(0); opacity: 0; }
            20% { opacity: 1; transform: translateY(10vh) rotate(20deg) scale(1.2); }
            100% { transform: translateY(110vh) rotate(360deg) scale(1); opacity: 0; }
        }

        .btn-love {
            background: linear-gradient(45deg, var(--primary), #b3002d);
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 51, 102, 0.4);
            transition: 0.3s;
        }

        .btn-love:hover { transform: scale(1.05); }

        #intro {
            cursor: pointer;
            text-align: center;
        }

        .floating-heart {
            font-size: 120px;
            animation: heartbeat 1.2s infinite;
            filter: drop-shadow(0 0 30px var(--primary));
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>

    <div class="ambient-light"></div>

    <div id="intro" onclick="openSurprise()">
        <div class="floating-heart">❤️</div>
        <h2 style="color: #fff; font-family: 'Dancing Script';">Tap to open, Anu Jaan...</h2>
    </div>

    <div id="main-container">
        <div class="card" id="card">
            <div style="font-size: 40px; margin-bottom: 10px;">🌹🧸🎂</div>
            <h1>Happy Birthday!</h1>
            <p class="romantic-text">
                "Anu Jaan, Aap ke saath guzra har pal mere liye jannat hai. Allah humein hamesha aise hi saath rakhe aur aapki har khwaish poori ho."
            </p>
            <p style="font-family: 'Dancing Script'; font-size: 1.6rem; color: var(--gold); margin-bottom: 25px;">
                I Love You Forever! ❤️
            </p>
            <button class="btn-love" onclick="sendKisses()">Click for Kisses 💋</button>
        </div>
    </div>

    <script>
        // Is baar function tabhi chalega jab button click hoga
        function openSurprise() {
            document.getElementById('intro').style.display = 'none';
            document.getElementById('card').style.display = 'block';
            
            // Shuruat mein thode se slow hearts background mein
            setInterval(() => {
                spawnElement('💖', false);
            }, 1500);
        }

        function spawnElement(symbol, isKiss = false) {
            const el = document.createElement('div');
            el.className = 'kiss-particle';
            el.innerHTML = symbol;
            
            // Random position: left side ya right side (center se hat kar)
            const randomSide = Math.random() > 0.5 ? Math.random() * 25 : 75 + Math.random() * 20;
            el.style.left = randomSide + 'vw';
            
            el.style.fontSize = (Math.random() * 20 + (isKiss ? 35 : 20)) + 'px';
            el.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(el);
            
            setTimeout(() => el.remove(), 4000);
        }

        function sendKisses() {
            // Button click par kisses ka explosion
            for(let i = 0; i < 40; i++) {
                setTimeout(() => {
                    // Yahan hum symbols mix kar rahe hain
                    const emoji = i % 2 === 0 ? '💋' : '❤️';
                    
                    const el = document.createElement('div');
                    el.className = 'kiss-particle';
                    el.innerHTML = emoji;
                    
                    // Poori screen par phel kar girenge
                    el.style.left = Math.random() * 95 + 'vw';
                    el.style.fontSize = (Math.random() * 20 + 30) + 'px';
                    el.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), 4000);
                }, i * 100);
            }
        }
    </script>
</body>
</html>
