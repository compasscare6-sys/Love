<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For My Januri ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;600&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; font-family: 'Poppins', sans-serif;
            overflow: hidden; touch-action: none;
        }

        /* Hidden Content Layer */
        #content-layer {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; background: #1a0505;
            z-index: 1;
        }

        .message h1 { font-family: 'Great Vibes', cursive; font-size: 3.5rem; color: #ff3366; margin: 0; }
        .message p { color: #fff; font-size: 1.1rem; margin-top: 10px; opacity: 0.8; }

        /* Bouquet Section */
        #vase-container { position: relative; margin-top: 40px; }
        .vase { width: 100px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
        .flower {
            position: absolute; font-size: 40px; bottom: 80px; left: 50%;
            transform: translateX(-50%); animation: grow 0.5s ease-out forwards;
        }
        @keyframes grow { from { transform: translateX(-50%) scale(0); } to { transform: translateX(-50%) scale(1); } }

        /* Magic Mirror Canvas */
        #mirror-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; cursor: crosshair; transition: opacity 2s;
        }

        .instruction {
            position: absolute; bottom: 10%; width: 100%; text-align: center;
            color: #fff; z-index: 11; font-size: 0.9rem; letter-spacing: 2px;
            pointer-events: none; text-shadow: 0 0 10px #000;
        }
    </style>
</head>
<body>

    <audio id="loveSong" loop>
        <source src="Jaan Ban Gaye - Khuda Haafiz.mp3.mp3" type="audio/mpeg">
    </audio>

    <div id="content-layer">
        <div class="message">
            <h1>I Love You Begum Jeee ❤️</h1>
            <p>Sorry Januri... Aapki smile ke bina sab adhoora hai. <br>
               <span style="font-size: 0.8rem;">(Ab Vase par tap karke mere guloab qubool karein)</span>
            </p>
        </div>

        <div id="vase-container" onclick="addFlower()">
            <svg class="vase" viewBox="0 0 100 120">
                <path d="M30,120 Q50,130 70,120 L80,40 Q50,30 20,40 Z" fill="#d4af37" />
            </svg>
            <div id="flowers"></div>
        </div>
        
        <p style="margin-top: 20px; color: #ff80ab; font-weight: 600;">Always Yours, Kala Paplat ✨</p>
    </div>

    <canvas id="mirror-canvas"></canvas>
    <div class="instruction" id="hint">SHEESHA SAAF KAREIN... ✨</div>

    <script>
        const canvas = document.getElementById('mirror-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let musicStarted = false;

        function initMirror() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Mirror background (Blurred/Foggy effect)
            ctx.fillStyle = '#888';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Add some "fog" texture
            for (let i = 0; i < 1000; i++) {
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.1})`;
                ctx.beginPath();
                ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 50, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function erase(x, y) {
            if(!musicStarted) {
                document.getElementById('loveSong').play();
                musicStarted = true;
                document.getElementById('hint').style.display = 'none';
            }
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 40, 0, Math.PI * 2);
            ctx.fill();
        }

        // Touch & Mouse Events for Mirror
        canvas.addEventListener('mousedown', () => isDrawing = true);
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mousemove', (e) => { if(isDrawing) erase(e.clientX, e.clientY); });
        
        canvas.addEventListener('touchstart', (e) => { isDrawing = true; erase(e.touches[0].clientX, e.touches[0].clientY); });
        canvas.addEventListener('touchmove', (e) => { if(isDrawing) erase(e.touches[0].clientX, e.touches[0].clientY); });

        // Bouquet Logic
        function addFlower() {
            const container = document.getElementById('flowers');
            const flower = document.createElement('div');
            flower.classList.add('flower');
            const types = ['🌹', '🌷', '🌸', '🌺', '🌻'];
            flower.innerText = types[Math.floor(Math.random() * types.length)];
            
            // Random position in vase
            const randomX = (Math.random() * 80) - 40;
            const randomY = (Math.random() * 60) - 30;
            const randomRotate = (Math.random() * 40) - 20;
            
            flower.style.marginLeft = randomX + 'px';
            flower.style.marginBottom = (80 + randomY) + 'px';
            flower.style.transform = `translateX(-50%) rotate(${randomRotate}deg)`;
            
            container.appendChild(flower);
            
            // Kiss effect on click
            createKiss(event.clientX, event.clientY);
        }

        function createKiss(x, y) {
            const kiss = document.createElement('div');
            kiss.innerText = '💋';
            kiss.style.position = 'fixed';
            kiss.style.left = x + 'px';
            kiss.style.top = y + 'px';
            kiss.style.fontSize = '24px';
            kiss.style.transition = '2s';
            kiss.style.pointerEvents = 'none';
            document.body.appendChild(kiss);
            setTimeout(() => {
                kiss.style.transform = 'translateY(-100px)';
                kiss.style.opacity = '0';
                setTimeout(() => kiss.remove(), 2000);
            }, 10);
        }

        window.onload = initMirror;
    </script>
</body>
</html>
