<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anu Jaan ka Mood Lifter ✨</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fff1f2, #ffe4e6, #fce7f3);
            --pink-dark: #9f1239;
            --pink-light: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .magic-box {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 35px 25px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(244, 63, 94, 0.12);
            border: 2px solid white;
            text-align: center;
        }

        .avatar {
            font-size: 55px;
            margin-bottom: 15px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        h1 {
            color: var(--pink-dark);
            font-size: 22px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .display-card {
            background: #fff5f5;
            border: 2px dashed #fbcfe8;
            border-radius: 16px;
            padding: 25px 20px;
            min-height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #334155;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .btn-magic {
            background: linear-gradient(135deg, #ec4899, #f43f5e);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-magic:active {
            transform: scale(0.98);
            box-shadow: 0 2px 5px rgba(236, 72, 153, 0.3);
        }
    </style>
</head>
<body>

    <div class="magic-box">
        <div class="avatar" id="emoji-box">❤️</div>
        <h1>Anu Jaan ka Mood Lifter</h1>
        <p class="subtitle">Subah se meri pyaari Begum bimar hain aur gusse mein hain. Jab tak aapka mood perfectly 100% sahi nahi hota, is button ko tap karti rahein!</p>

        <div class="display-card" id="message-display">
            Tap the magic button below to unlock a smile! ✨
        </div>

        <button class="btn-magic" onclick="liftMood()">Magic Button Tap Karein 🪄</button>
    </div>

    <script>
        const moodBoosters = [
            "Fever mein insaan bimar hota hai toh sab par chirchira hota hai, aur aapka chirchirapan toh mujhe aur bhi cute lagta hai! I don't mind at all meri jaan. 😘",
            "Ek secret batauun? Aap gusse mein aur bhi zyada khoobsurat lagti hain, par please jaldi se theek ho jao, aapke bina din bilkul boring guzarta hai. 🥺",
            "Chalo, ek pakka promise: Jaise hi aap theek ho jaogi, hum Pizza Max chalenge! Pura bada pizza sirf aapka hoga. 🍕",
            "Aapka Lali is waqt door baith kar aapko dher saari virtual jhappiyan aur kissies bhej raha hai. Do minute aankhein band karke unhe feel karein! ❤️",
            "Duniya ki sabse pyari aur sweet ladki ko is waqt bukhar ne tang kiya hua hai. Bukhar ko toh main baad mein dekhunga, pehle aap smile karo! 😊",
            "Mera dil is waqt aapke paas hi hai. Agar type karne ka dil na ho, toh bilkul mat karo. Aap bas aaram karo, main hamesha yahi huun. 🌸",
            "Aap mere zindagi ka sabse khoobsurat hissa ho. Aapka bimar hona matlab mera udas hona. Apne Lali ke liye ek choti si smile de do abhi? 🥺",
            "Kuch dino baad jab hum sath honge na, toh bimar hone par main aapko apne hathon se soup pilaunga. Yeh dooriyan bas thode waqt ki hain! 🤵‍♂️❤️",
            "Aapka gussa sar aankhon par! Aap mujh par din mein 10 baar aur bhadak sakti hain, full discount hai aapko! 😂❤️",
            "The ultimate truth: I Love You Forever Always, chahe aap happy ho, sad ho, ya fever mein chirchiri ho! Aap meri favourite ho. 💋"
        ];

        const emojis = ["🥰", "🥺", "🍕", "❤️", "😊", "🌸", "👑", "✨", "🤗", "💋"];

        function liftMood() {
            const messageDisplay = document.getElementById('message-display');
            const emojiBox = document.getElementById('emoji-box');
            
            // Get random message and emoji
            const randomMsg = moodBoosters[Math.floor(Math.random() * moodBoosters.length)];
            const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
            
            // Add a tiny animation effect before text updates
            messageDisplay.style.opacity = 0;
            
            setTimeout(() => {
                messageDisplay.innerText = randomMsg;
                emojiBox.innerText = randomEmoji;
                messageDisplay.style.opacity = 1;
            }, 200);
        }
    </script>
</body>
</html>
