<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Doll Studio 🔥</title>

<style>
body{
  margin:0;
  font-family:Poppins,sans-serif;
  background: radial-gradient(circle at top, #ff3c3c, #0a0512 70%);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
}

.wrap{
  text-align:center;
}

.doll-holder{
  width:200px;
  margin:auto;
  animation: floatDoll 3s infinite ease-in-out;
}

@keyframes floatDoll{
  0%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
  100%{transform:translateY(0);}
}

svg{
  width:100%;
}

/* Glow Dress */
#dress{
  filter: drop-shadow(0 0 10px pink);
  animation: glow 2s infinite alternate;
}

@keyframes glow{
  from{filter: drop-shadow(0 0 10px pink);}
  to{filter: drop-shadow(0 0 25px hotpink);}
}

button{
  margin:5px;
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="wrap">

<h2>🔥 Animated Doll Maker</h2>

<div class="doll-holder">

<svg viewBox="0 0 200 300">

<!-- FACE -->
<circle cx="100" cy="80" r="40" fill="#ffd1b3"/>

<!-- EYES -->
<circle cx="85" cy="80" r="7" fill="white"/>
<circle cx="115" cy="80" r="7" fill="white"/>

<circle cx="85" cy="80" r="4" fill="black"/>
<circle cx="115" cy="80" r="4" fill="black"/>

<circle cx="83" cy="78" r="1.5" fill="white"/>
<circle cx="113" cy="78" r="1.5" fill="white"/>

<!-- LIPS -->
<ellipse id="lips" cx="100" cy="105" rx="10" ry="5" fill="pink"/>
<line x1="92" y1="103" x2="108" y2="103" stroke="white" stroke-width="1"/>

<!-- HAIR -->
<path id="hair" d="M60,80 Q100,10 140,80 Z" fill="brown"/>
<path d="M60,80 Q50,140 80,160 Z" fill="brown"/>
<path d="M140,80 Q150,140 120,160 Z" fill="brown"/>

<!-- BODY -->
<rect x="80" y="120" width="40" height="80" fill="#ffd1b3"/>

<!-- DRESS -->
<polygon id="dress" points="60,200 140,200 160,280 40,280" fill="hotpink"/>

</svg>

</div>

<div>
<button onclick="hairColor('gold')">Golden Hair</button>
<button onclick="hairColor('pink')">Pink Hair</button>
<button onclick="hairColor('black')">Black Hair</button>

<br>

<button onclick="lipColor('red')">Red Lips</button>
<button onclick="lipColor('hotpink')">Pink Lips</button>

<br>

<button onclick="dressColor('purple')">Purple Dress</button>
<button onclick="dressColor('blue')">Blue Dress</button>
</div>

</div>

<script>
function hairColor(color){
  document.getElementById("hair").setAttribute("fill",color);
}

function lipColor(color){
  document.getElementById("lips").setAttribute("fill",color);
}

function dressColor(color){
  document.getElementById("dress").setAttribute("fill",color);
}
</script>

</body>
</html>
