<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Queen's Secret Vault 🔒👑</title>
    <style>
        :root {
            --bg-dark: #08030d;
            --vault-metal: linear-gradient(145deg, #2a2a35, #121218);
            --gold: #f59e0b;
            --pink-main: #ec4899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, #230c33 0%, var(--bg-dark) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: #fff;
            overflow: hidden;
        }

        .vault-wrapper {
            width: 100%;
            max-width: 360px;
            background: var(--vault-metal);
            border: 4px solid #3d3d4e;
            border-radius: 35px;
            padding: 30px 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 15px rgba(255,255,255,0.05);
            text-align: center;
            position: relative;
        }

        .vault-header {
            color: var(--gold);
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .vault-subtext {
            font-size: 12px;
            color: #a78bfa;
            margin-bottom: 25px;
        }

        /* 3D DIAL CONTAINER */
        .dial-container {
            width: 180px;
            height: 180px;
            margin: 0 auto 25px;
            background: radial-gradient(circle, #3a3a4c 0%, #15151c 100%);
            border-radius: 50%;
            border: 6px solid #4a4a5e;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .dial-wheel {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, #22222c 0%, #0d0d12 100%);
            border-radius: 50%;
            border: 3px solid var(--gold);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.2);
            transition: transform 0.2s ease-out;
            position: relative;
        }

        .dial-number {
            font-size: 42px;
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }

        .dial-pointer {
            position: absolute;
            top: -12px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 14px solid var(--pink-main);
            z-index: 10;
        }

        /* CONTROLS */
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .btn-step {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(236, 72, 153, 0.3);
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s;
        }

        .btn-step:active {
            transform: scale(0.92);
            background: var(--pink-main);
        }

        .btn-unlock {
            width: 100%;
            background: linear-gradient(135deg, var(--gold), #d97706);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3);
            transition: transform 0.1s;
        }

        .btn-unlock:active {
            transform: scale(0.97);
        }

        .status-msg {
            color: #ef4444;
            font-size: 12px;
            margin-top: 12px;
            font-weight: 700;
            min-height: 18px;
        }

        /* REVEAL OVERLAY MODAL */
        .vault-reveal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 3, 15, 0.98);
            backdrop-filter: blur(20px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .vault-content {
            background: linear-gradient(145deg, #3a1146, #0f0517);
            border: 2px solid var(--pink-main);
            border-radius: 28px;
            max-width: 350px;
            width: 100%;
            padding: 35px 22px;
            text-align: center;
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.9);
            animation: vaultOpen 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes vaultOpen {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .crown-icon { font-size: 60px; margin-bottom: 15px; }
        .modal-title { color: var(--gold); font-size: 20px; margin-bottom: 15px; font-weight: 800; }
        .modal-msg { font-size: 16px; color: #f3e8ff; line-height: 1.6; font-weight: 700; }
    </style>
</head>
<body>

    <div class="vault-wrapper">
        <div class="vault-header">Secret Queen Vault 🔒</div>
        <div class="vault-subtext">Dial her special date code to unlock!</div>

        <div class="dial-container">
            <div class="dial-pointer"></div>
            <div class="dial-wheel" id="wheel">
                <div class="dial-number" id="code-val">0</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-step" onclick="changeCode(-1)">-</button>
            <button class="btn-step" onclick="changeCode(1)">+</button>
        </div>

        <button class="btn-unlock" onclick="unlockVault()">UNLOCK VAULT 🗝️</button>
        <div class="status-msg" id="status"></div>
    </div>

    <!-- SECRET REVEAL POPUP -->
    <div class="vault-reveal" id="vault-reveal">
        <div class="vault-content">
            <div class="crown-icon">👑💋</div>
            <h2 class="modal-title">You Won My Heart Again! 🏆❤️</h2>
            <p class="modal-msg">
                I Love You So Much, My Queen! Ummaah! 👑💋
            </p>
        </div>
    </div>

    <script>
        let currentCode = 0;
        const SECRET_CODE = 23; // Special Birthdate Code

        function changeCode(val) {
            currentCode += val;
            if (currentCode < 0) currentCode = 31;
            if (currentCode > 31) currentCode = 0;

            document.getElementById('code-val').innerText = currentCode;
            document.getElementById('status').innerText = '';

            // Rotate dial visual effect
            const rotation = currentCode * (360 / 32);
            document.getElementById('wheel').style.transform = `rotate(${rotation}deg)`;
        }

        function unlockVault() {
            if (currentCode === SECRET_CODE) {
                document.getElementById('status').innerText = '';
                document.getElementById('vault-reveal').style.display = 'flex';
            } else {
                document.getElementById('status').innerText = 'Access Denied! Wrong Key Code ❌';
            }
        }
    </script>
</body>
</html>
