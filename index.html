<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Begum's Treat Vending 💖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Sacramento&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      touch-action: manipulation;
    }

    body {
      background: linear-gradient(135deg, #180325 0%, #31103f 50%, #4c0519 100%);
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
      overflow-x: hidden;
    }

    .vending-container {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(180deg, #f472b6 0%, #db2777 100%);
      border: 4px solid #fbcfe8;
      border-radius: 36px;
      padding: 20px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
      position: relative;
    }

    .machine-header {
      text-align: center;
      background: #831843;
      padding: 10px;
      border-radius: 20px;
      border: 2px solid #fbcfe8;
      margin-bottom: 15px;
    }

    .machine-title {
      font-family: 'Caveat', cursive;
      font-size: 2.2rem;
      color: #fbcfe8;
      line-height: 1;
    }

    /* Glass Display */
    .glass-window {
      background: rgba(15, 23, 42, 0.85);
      border: 3px solid #fda4af;
      border-radius: 24px;
      padding: 15px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      min-height: 220px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      position: relative;
    }

    .item-box {
      background: rgba(255, 255, 255, 0.1);
      border: 1px dashed rgba(251, 113, 133, 0.5);
      border-radius: 16px;
      padding: 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }

    .item-code {
      background: #be123c;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 10px;
      margin-bottom: 4px;
    }

    .item-emoji {
      font-size: 2rem;
    }

    .item-name {
      font-size: 0.75rem;
      font-weight: 700;
      color: #fbcfe8;
      margin-top: 4px;
    }

    /* Controls */
    .control-panel {
      margin-top: 15px;
      background: #500724;
      padding: 15px;
      border-radius: 20px;
      border: 2px solid #fda4af;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .display-screen {
      background: #0f172a;
      color: #22c55e;
      font-family: monospace;
      padding: 8px 16px;
      border-radius: 10px;
      width: 100%;
      text-align: center;
      font-size: 0.9rem;
      border: 1px solid #22c55e;
      letter-spacing: 1px;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
    }

    .btn-key {
      background: linear-gradient(135deg, #fb7185, #e11d48);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 15px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.1s;
    }

    .btn-key:active {
      transform: scale(0.95);
    }

    /* Drop Tray / Output */
    .drop-tray {
      margin-top: 15px;
      background: #1e293b;
      height: 60px;
      border-radius: 15px;
      border: 3px solid #64748b;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 700;
      position: relative;
      overflow: hidden;
    }

    /* Result Popup */
    .popup-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .popup-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .result-card {
      background: #fff;
      color: #1e293b;
      border-radius: 28px;
      padding: 25px 20px;
      width: 100%;
      max-width: 330px;
      text-align: center;
      border: 3px dashed #fb7185;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .result-status {
      font-size: 0.8rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .status-lucky { background: #dcfce7; color: #15803d; }
    .status-unlucky { background: #ffe4e6; color: #be123c; }

    .result-text {
      font-size: 1.1rem;
      font-weight: 800;
      color: #881337;
      margin: 10px 0 20px 0;
      line-height: 1.5;
    }

    .btn-close {
      background: linear-gradient(135deg, #fb7185, #e11d48);
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 20px;
      font-weight: 800;
      cursor: pointer;
    }

    /* Particles */
    .particle {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
      animation: floatUp 3s ease-out forwards;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-100vh) scale(1.6); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="vending-container">
    <div class="machine-header">
      <div class="machine-title">Begum's Treat Vending 💖</div>
      <p style="font-size:0.75rem; color:#fbcfe8;">Press A1 - A4 to test your luck!</p>
    </div>

    <!-- Glass Window with Items -->
    <div class="glass-window">
      <div class="item-box" id="box-A1">
        <span class="item-code">A1</span>
        <span class="item-emoji">🥭</span>
        <span class="item-name">Imli Pass</span>
      </div>
      <div class="item-box" id="box-A2">
        <span class="item-code">A2</span>
        <span class="item-emoji">📋</span>
        <span class="item-name">Class Right</span>
      </div>
      <div class="item-box" id="box-A3">
        <span class="item-code">A3</span>
        <span class="item-emoji">🍨</span>
        <span class="item-name">Rasmalai & Kiss</span>
      </div>
      <div class="item-box" id="box-A4">
        <span class="item-code">A4</span>
        <span class="item-emoji">📸</span>
        <span class="item-name">Snap Challenge</span>
      </div>
    </div>

    <!-- Control Panel -->
    <div class="control-panel">
      <div class="display-screen" id="screen">SELECT ITEM (A1 - A4)</div>
      
      <div class="keypad">
        <button class="btn-key" onclick="pressButton('A1')">A1: Imli</button>
        <button class="btn-key" onclick="pressButton('A2')">A2: Class</button>
        <button class="btn-key" onclick="pressButton('A3')">A3: Puppy</button>
        <button class="btn-key" onclick="pressButton('A4')">A4: Snap</button>
      </div>
    </div>

    <div class="drop-tray" id="tray">
      🎁 Collect Item Here
    </div>
  </div>

  <!-- RESULT POPUP -->
  <div class="popup-overlay" id="popup">
    <div class="result-card">
      <div id="popEmoji" style="font-size: 3.5rem;">🎉</div>
      <div id="popStatus" class="result-status">RESULT</div>
      <div id="popText" class="result-text">Message goes here...</div>
      <button class="btn-close" onclick="closePopup()">ACCEPT OUTCOME 💋</button>
    </div>
  </div>

  <script>
    const outcomes = {
      'A1': [
        { lucky: true, emoji: '🥭', text: "Aaj aap Imli khayein, poori permission hai! 😋" },
        { lucky: false, emoji: '🚫', text: "Aaj Imli Bilkul Band! Galat outcome aa gaya, no imli today! 😜" }
      ],
      'A2': [
        { lucky: true, emoji: '📋', text: "Aaj raat Rabi ki ache se Class lagane ki permission di jaati hai! 😤" },
        { lucky: false, emoji: '🛡️', text: "Aaj Class Nahi Laga Sakti! Rabi Safe hai ab! 🙈" }
      ],
      'A3': [
        // RIGGED: Sirf Puppy dene wala outcome hi aayega! 🔥
        { lucky: false, emoji: '💋', text: "Ab toh main aaj Puppy dekar rahoon-ga, aap mujhe rok nahi sakti!" }
      ],
      'A4': [
        { lucky: true, emoji: '📸', text: "Abhi ki Snap bhejni hai toh bhejo, baaki aapki marzi! 😉" },
        { lucky: false, emoji: '🤪', text: "Abhi ke abhi Snap bhejni padegi, chahe masi wali halat mein hi kyun na ho! 📸🔥" }
      ]
    };

    function pressButton(code) {
      const screen = document.getElementById('screen');
      const tray = document.getElementById('tray');
      
      screen.innerText = `DISPENSING ${code}...`;
      tray.innerText = "⚙️ Vending Item...";

      setTimeout(() => {
        const choiceList = outcomes[code];
        // Always picks the forced outcome for A3, and random for others
        const result = choiceList[Math.floor(Math.random() * choiceList.length)];
        
        showResult(result);
        screen.innerText = "SELECT ITEM (A1 - A4)";
        tray.innerText = "🎁 ITEM DROPPED!";
      }, 1200);
    }

    function showResult(item) {
      document.getElementById('popEmoji').innerText = item.emoji;
      document.getElementById('popText').innerText = item.text;
      
      const statusEl = document.getElementById('popStatus');
      if (item.lucky) {
        statusEl.innerText = "OPTION A (LUCKY)";
        statusEl.className = "result-status status-lucky";
      } else {
        statusEl.innerText = "DESTINY HAS SPOKEN 💋";
        statusEl.className = "result-status status-unlucky";
      }

      document.getElementById('popup').classList.add('active');
      triggerRain(25);
    }

    function closePopup() {
      document.getElementById('popup').classList.remove('active');
    }

    function triggerRain(count) {
      const symbols = ['💖', '💋', '✨', '🍨', '🌸'];
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const p = document.createElement('div');
          p.className = 'particle';
          p.innerText = symbols[Math.floor(Math.random() * symbols.length)];
          p.style.left = Math.random() * 100 + 'vw';
          p.style.bottom = '0px';
          p.style.fontSize = (Math.random() * 18 + 18) + 'px';
          document.body.appendChild(p);

          setTimeout(() => p.remove(), 3000);
        }, i * 40);
      }
    }
  </script>

</body>
</html>
