<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anu's Sweet Sugar Rush 🍬✨</title>
    <style>
        :root {
            --bg-dark: #0f0813;
            --panel-bg: rgba(26, 15, 36, 0.85);
            --gold: #f59e0b;
            --text-light: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: radial-gradient(circle at center, #251333 0%, var(--bg-dark) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            color: var(--text-light);
            overflow: hidden;
            touch-action: none;
        }

        .game-wrapper {
            background: var(--panel-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 15px;
            box-shadow: 0 25px 65px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        header h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(to right, #fff, #f472b6, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        header p {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 12px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.04);
            padding: 10px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 12px;
            font-weight: 600;
        }

        .dashboard div span {
            display: block;
            font-size: 15px;
            color: var(--gold);
            margin-top: 2px;
        }

        .candy-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            background: rgba(10, 5, 15, 0.6);
            padding: 8px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 10px;
            touch-action: none;
        }

        .tile {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.15s ease;
            position: relative;
            border: 2px solid transparent;
        }

        .tile.selected {
            background: rgba(244, 114, 182, 0.3);
            border-color: #f472b6;
        }

        /* HINT PULSE EFFECT */
        .tile.hint-pulse {
            animation: hintGlow 1s infinite alternate;
            z-index: 5;
        }

        @keyframes hintGlow {
            0% { background: rgba(245, 158, 11, 0.1); border-color: rgba(245, 158, 11, 0.3); transform: scale(1); }
            100% { background: rgba(245, 158, 11, 0.35); border-color: #f59e0b; transform: scale(1.05); }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 5, 15, 0.9);
            backdrop-filter: blur(15px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: linear-gradient(145deg, #20132c, #0f0813);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            max-width: 360px;
            width: 100%;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
        }

        .modal-title {
            color: #f472b6;
            font-size: 20px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .modal-msg {
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .btn-action {
            background: linear-gradient(135deg, #db2777, #f59e0b);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(219, 39, 119, 0.4);
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <header>
            <h1>Sugar Match-3 Deluxe</h1>
            <p>Candies ko swipe karke match banayein ✨ (Hints automatic milengi)</p>
        </header>

        <div class="dashboard">
            <div>Level<span id="level-val">1</span></div>
            <div>Score<span id="score-val">0 / 300</span></div>
            <div>Moves Left<span id="moves-val">25</span></div>
        </div>

        <div class="candy-grid" id="grid"></div>
    </div>

    <div class="modal" id="game-modal">
        <div class="modal-content">
            <h2 class="modal-title" id="m-title">Level Cleared! 🎉</h2>
            <p class="modal-msg" id="m-msg">Great job!</p>
            <button class="btn-action" id="m-btn" onclick="modalAction()">Next Level ➡️</button>
        </div>
    </div>

    <script>
        const candies = ['🍬', '🍭', '🍩', '🍪', '🍫', '🧁'];
        const width = 6;
        let gridData = [];
        let score = 0;
        let currentLevel = 1;
        let movesLeft = 25;

        let startX, startY, activeTileId = null;
        let hintTimer = null;

        const levelTargets = { 1: 300, 2: 600, 3: 1000, 4: 1500, 5: 2200 };
        const levelMoves = { 1: 25, 2: 22, 3: 20, 4: 18, 5: 15 };

        function initGame() {
            score = 0;
            movesLeft = levelMoves[currentLevel];
            updateDashboard();
            createBoard();
            while(checkAndClearMatches()) {
                refillGrid();
            }
            score = 0;
            updateDashboard();
            resetHintTimer();
        }

        function createBoard() {
            const gridElement = document.getElementById('grid');
            gridElement.innerHTML = '';
            gridData = [];

            for (let i = 0; i < width * width; i++) {
                const randomCandy = candies[Math.floor(Math.random() * candies.length)];
                const tile = document.createElement('div');
                tile.classList.add('tile');
                tile.setAttribute('id', i);
                tile.innerText = randomCandy;

                tile.addEventListener('pointerdown', onSwipeStart);
                tile.addEventListener('pointerup', onSwipeEnd);

                gridElement.appendChild(tile);
                gridData.push(randomCandy);
            }
        }

        function onSwipeStart(e) {
            clearHint();
            activeTileId = parseInt(this.getAttribute('id'));
            startX = e.clientX;
            startY = e.clientY;
            this.classList.add('selected');
            this.setPointerReleaseCapture(e.pointerId);
        }

        function onSwipeEnd(e) {
            if (activeTileId === null) return;
            document.getElementById(activeTileId).classList.remove('selected');

            const diffX = e.clientX - startX;
            const diffY = e.clientY - startY;
            const threshold = 30;

            let targetId = null;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > threshold) {
                    targetId = diffX > 0 ? activeTileId + 1 : activeTileId - 1;
                    if (Math.floor(activeTileId / width) !== Math.floor(targetId / width)) targetId = null;
                }
            } else {
                if (Math.abs(diffY) > threshold) {
                    targetId = diffY > 0 ? activeTileId + width : activeTileId - width;
                }
            }

            if (targetId !== null && targetId >= 0 && targetId < width * width) {
                executeMove(activeTileId, targetId);
            } else {
                resetHintTimer();
            }
            activeTileId = null;
        }

        function executeMove(id1, id2) {
            swapTiles(id1, id2);
            movesLeft--;
            updateDashboard();

            let hasMatches = checkAndClearMatches();
            if (hasMatches) {
                setTimeout(() => {
                    refillGrid();
                    checkGameStatus();
                    resetHintTimer();
                }, 250);
            } else {
                setTimeout(() => {
                    swapTiles(id1, id2);
                    resetHintTimer();
                }, 200);
            }
        }

        function swapTiles(id1, id2) {
            const temp = gridData[id1];
            gridData[id1] = gridData[id2];
            gridData[id2] = temp;
            document.getElementById(id1).innerText = gridData[id1];
            document.getElementById(id2).innerText = gridData[id2];
        }

        function checkAndClearMatches() {
            let matchFound = false;
            let toClear = new Set();

            for (let r = 0; r < width; r++) {
                for (let c = 0; c < width - 2; c++) {
                    let idx = r * width + c;
                    if (gridData[idx] && gridData[idx] === gridData[idx+1] && gridData[idx] === gridData[idx+2]) {
                        toClear.add(idx).add(idx+1).add(idx+2);
                        matchFound = true;
                    }
                }
            }

            for (let c = 0; c < width; c++) {
                for (let r = 0; r < width - 2; r++) {
                    let idx = r * width + c;
                    if (gridData[idx] && gridData[idx] === gridData[idx+width] && gridData[idx] === gridData[idx+width*2]) {
                        toClear.add(idx).add(idx+width).add(idx+width*2);
                        matchFound = true;
                    }
                }
            }

            if (matchFound) {
                toClear.forEach(idx => {
                    gridData[idx] = '';
                    document.getElementById(idx).innerText = '';
                });
                score += toClear.size * 10;
                updateDashboard();
            }
            return matchFound;
        }

        function refillGrid() {
            for (let c = 0; c < width; c++) {
                for (let r = width - 1; r >= 0; r--) {
                    let idx = r * width + c;
                    if (gridData[idx] === '') {
                        let nextRow = r - 1;
                        while (nextRow >= 0) {
                            let nextIdx = nextRow * width + c;
                            if (gridData[nextIdx] !== '') {
                                gridData[idx] = gridData[nextIdx];
                                gridData[nextIdx] = '';
                                document.getElementById(idx).innerText = gridData[idx];
                                document.getElementById(nextIdx).innerText = '';
                                break;
                            }
                            nextRow--;
                        }
                    }
                }
            }

            for (let i = 0; i < width * width; i++) {
                if (gridData[i] === '') {
                    gridData[i] = candies[Math.floor(Math.random() * candies.length)];
                    document.getElementById(i).innerText = gridData[i];
                }
            }

            if (checkAndClearMatches()) {
                setTimeout(refillGrid, 250);
            }
        }

        // AUTO-HINT SCANNER LOGIC
        function resetHintTimer() {
            clearHint();
            hintTimer = setTimeout(findAndShowHint, 5000); // 5 Seconds idle limit trigger
        }

        function clearHint() {
            clearTimeout(hintTimer);
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('hint-pulse'));
        }

        function findAndShowHint() {
            // Check potential horizontal and vertical swaps simulation
            for (let i = 0; i < width * width; i++) {
                let r = Math.floor(i / width);
                let c = i % width;

                // Test right swap simulation
                if (c < width - 1) {
                    if (testMatchPotential(i, i + 1)) {
                        triggerHintAnimation(i, i + 1);
                        return;
                    }
                }
                // Test down swap simulation
                if (r < width - 1) {
                    if (testMatchPotential(i, i + width)) {
                        triggerHintAnimation(i, i + width);
                        return;
                    }
                }
            }
        }

        function testMatchPotential(id1, id2) {
            // Shadow swap setup
            let temp = gridData[id1];
            gridData[id1] = gridData[id2];
            gridData[id2] = temp;

            let isMatchFound = false;

            // Check if shadow state yields a real 3-row validation match
            for (let i = 0; i < width * width; i++) {
                let r = Math.floor(i / width);
                let c = i % width;

                if (c < width - 2 && gridData[i] && gridData[i] === gridData[i+1] && gridData[i] === gridData[i+2]) isMatchFound = true;
                if (r < width - 2 && gridData[i] && gridData[i] === gridData[i+width] && gridData[i] === gridData[i+width*2]) isMatchFound = true;
            }

            // Restore original array data
            gridData[id2] = gridData[id1];
            gridData[id1] = temp;

            return isMatchFound;
        }

        function triggerHintAnimation(id1, id2) {
            document.getElementById(id1).classList.add('hint-pulse');
            document.getElementById(id2).classList.add('hint-pulse');
        }

        function updateDashboard() {
            document.getElementById('level-val').innerText = currentLevel;
            document.getElementById('score-val').innerText = `${score} / ${levelTargets[currentLevel]}`;
            document.getElementById('moves-val').innerText = movesLeft;
        }

        function checkGameStatus() {
            const target = levelTargets[currentLevel];
            if (score >= target) {
                clearHint();
                if (currentLevel === 5) {
                    showModal("Grand Finale Won! 👑💖", "Wow Guriya! Aapne saare 5 hard levels par kar diye. Aapka determination aur game sense sach mein flawless hai!<br><br>Ab saari thakawat bhul kar ek pyaari si smile kijiye aur aaram se rest kijiye. Rabi aapke sath hai! ❤️", "Restart Game");
                } else {
                    showModal("Level Cleared! 🎉", `Aapne Level ${currentLevel} ko behtareen tareeqe se solve kiya. Agla step thoda aur interesting hone wala hai! ✨`, "Next Level");
                }
            } else if (movesLeft <= 0) {
                clearHint();
                showModal("Level Failed! 🔄", "Koi baat nahi Guriya, is baar target thoda reh gaya. Dubara koshish kijiye, aap aaram se clear kar lengi!", "Try Again");
            }
        }

        function showModal(title, msg, btnText) {
            document.getElementById('m-title').innerHTML = title;
            document.getElementById('m-msg').innerHTML = msg;
            document.getElementById('m-btn').innerText = btnText;
            document.getElementById('game-modal').style.display = 'flex';
        }

        function modalAction() {
            document.getElementById('game-modal').style.display = 'none';
            const btnText = document.getElementById('m-btn').innerText;
            
            if (btnText === "Next Level") {
                currentLevel++;
                initGame();
            } else if (btnText === "Try Again" || btnText === "Restart Game") {
                currentLevel = 1;
                initGame();
            }
        }

        initGame();
    </script>
</body>
</html>
