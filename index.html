<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Couple Truth or Dare 🎲❤️</title>
    <style>
        :root {
            --bg-dark: #0d0614;
            --pink-accent: #ec4899;
            --purple-accent: #8b5cf6;
            --gold: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, #230c33 0%, var(--bg-dark) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 24px;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
            margin-bottom: 5px;
        }

        .header p {
            font-size: 13px;
            color: #c084fc;
        }

        .bottle-stage {
            width: 240px;
            height: 240px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed rgba(236, 72, 153, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 25px;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.15);
        }

        .bottle {
            font-size: 80px;
            cursor: pointer;
            transition: transform 3s cubic-bezier(0.15, 0.85, 0.35, 1.2);
            user-select: none;
        }

        .spin-btn {
            background: linear-gradient(135deg, var(--pink-accent), var(--purple-accent));
            color: #fff;
            border: none;
            padding: 14px 32px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.4);
        }

        /* MODAL POPUP */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 6, 20, 0.95);
            backdrop-filter: blur(15px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background: linear-gradient(145deg, #2a0e38, #13061c);
            border: 2px solid var(--pink-accent);
            border-radius: 28px;
            max-width: 360px;
            width: 100%;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .choice-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 15px;
        }

        .btn-choice {
            flex: 1;
            padding: 12px;
            border-radius: 15px;
            border: none;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-truth { background: rgba(59, 130, 246, 0.2); border: 2px solid #3b82f6; color: #60a5fa; }
        .btn-dare { background: rgba(236, 72, 153, 0.2); border: 2px solid var(--pink-accent); color: #f472b6; }

        .task-title { font-size: 18px; color: var(--gold); margin-bottom: 10px; font-weight: 800; }
        .task-desc { font-size: 15px; color: #f3e8ff; line-height: 1.4; margin-bottom: 18px; font-weight: 600; }

        .answer-box {
            width: 100%;
            height: 80px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(236, 72, 153, 0.3);
            border-radius: 15px;
            padding: 10px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 15px;
            resize: none;
            outline: none;
        }

        .btn-insta {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 18px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 5px 15px rgba(220, 39, 67, 0.3);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Couple Truth or Dare 🎲❤️</h1>
        <p>Spin the bottle & share your reply, Jaanu!</p>
    </div>

    <div class="bottle-stage">
        <div class="bottle" id="bottle">🍾</div>
    </div>

    <button class="spin-btn" onclick="spinBottle()">SPIN BOTTLE 🔄</button>

    <!-- MODAL -->
    <div class="modal" id="modal">
        <div class="modal-card" id="modal-content">
            <!-- Dynamic Content -->
        </div>
    </div>

    <script>
        const INSTAGRAM_USERNAME = "rabi__dadani57";

        let currentRotation = 0;
        let isSpinning = false;
        let currentTaskText = "";
        let currentType = "";

        const truths = [
            "Mera konsa esa cute aadat hai jo tumhein bhut pasand hai? ❤️",
            "Tumhare Phone mein meri koi favorite Picture hai? 📱✨",
            "Batao, mujhse kitni mohabbat karti hoo? 💖"
        ];

        const dares = [
            "Raat ko jaldi sogi... max 3 baje tak bas! ⏰😴",
            "Jo Picture delete ki hai wo dubara bhejogi aur sath mein 2 aur new pictures dogi! 📸💋",
            "Sunday tak naraz nahi ho sakti ho mujhse! Promise karo 🤞💕"
        ];

        function spinBottle() {
            if (isSpinning) return;
            isSpinning = true;

            const randomDegrees = Math.floor(Math.random() * 360) + 1440; 
            currentRotation += randomDegrees;

            const bottle = document.getElementById('bottle');
            bottle.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                showChoiceModal();
            }, 3000);
        }

        function showChoiceModal() {
            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = `
                <h2 style="color: var(--gold); margin-bottom: 12px;">Bottle Stopped! 🎉</h2>
                <p style="color: #e9d5ff; font-size: 14px; margin-bottom: 18px;">Kya choose karna chahogi, Meri Jaan?</p>
                <div class="choice-btns">
                    <button class="btn-choice btn-truth" onclick="showTask('Truth')">TRUTH 💭</button>
                    <button class="btn-choice btn-dare" onclick="showTask('Dare')">DARE 🔥</button>
                </div>
            `;
            document.getElementById('modal').style.display = 'flex';
        }

        function showTask(type) {
            currentType = type;
            const list = type === 'Truth' ? truths : dares;
            currentTaskText = list[Math.floor(Math.random() * list.length)];

            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = `
                <div class="task-title">${type === 'Truth' ? '💭 TRUTH' : '🔥 DARE'}</div>
                <div class="task-desc">${currentTaskText}</div>
                <textarea class="answer-box" id="userAnswer" placeholder="Apna answer ya reply yahan likho..."></textarea>
                <button class="btn-insta" onclick="sendToInstagram()">Send Answer on Insta DM 📸</button>
            `;
        }

        function sendToInstagram() {
            const ans = document.getElementById('userAnswer').value.trim();
            if(!ans) {
                alert("Pehle reply toh likho Meri Jaan! 😉");
                return;
            }

            const fullText = `*Couple Game Reply* 🎲❤️\n${currentType}: ${currentTaskText}\nAnswer: ${ans}`;
            
            // Clipboard par save kar diya taaki DM mein paste kar sakein
            navigator.clipboard.writeText(fullText);

            alert("Answer copy ho gaya hai! Direct Insta DM mein paste kar do 💖");
            
            // Open direct Instagram profile/chat page
            window.open(`https://instagram.com/${INSTAGRAM_USERNAME}`, '_blank');
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
