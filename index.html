<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You Anu ❤️</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #0a0a0a; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Poppins', sans-serif;
        }

        /* Pulsing Heart Center */
        .main-heart {
            font-size: 100px; cursor: pointer;
            animation: pulse 1.5s infinite;
            filter: drop-shadow(0 0 20px #ff3366);
            transition: 0.5s;
            z-index: 10;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* Message Style */
        #final-msg {
            position: absolute; text-align: center; color: white;
            opacity: 0; transition: 2s; z-index: 20;
            pointer-events: none;
        }

        h1 { font-family: 'Dancing Script', cursive; font-size: 3rem; color: #ff3366; margin: 0; }
        
        /* Floating Elements */
        .float-element {
            position: absolute; bottom: -10%;
            animation: floatUp 4s linear forwards;
            opacity: 0.8;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        .instruction {
            position: absolute; bottom: 20%; color: rgba(255,255,255,0.4);
            font-size: 0.8rem; letter-spacing: 2px;
        }
    </style>
</head>
<body onclick="activateLove()">

    <audio id="song" loop>
        <source src="Jaan Ban Gaye - Khuda Haafiz.mp3.mp3" type="audio/mpeg">
    </audio>

    <div class="main-heart" id="heart">❤️</div>
    
    <div class="instruction" id="hint">TAP MY HEART</div>

    <div id="final-msg">
        <h1>Sorry Jaan... ❤️</h1>
        <p style="font-style: italic; color: #ffcccc;">Ab maan jao na? <br> — Kaley</p>
    </div>

    <script>
        function activateLove() {
            // Play Music
            document.getElementById('song').play();

            // Hide Heart & Hint
            document.getElementById('heart').style.transform = 'scale(0)';
            document.getElementById('hint').style.opacity = '0';

            // Show Message
            setTimeout(() => {
                document.getElementById('final-msg').style.opacity = '1';
            }, 500);

            // Start Particle Rain
            setInterval(createFloatingElement, 150);
        }

        function createFloatingElement() {
            const el = document.createElement('div');
            el.classList.add('float-element');
            const items = ['💋', '❤️', '😘', '🌹', '💖'];
            el.innerText = items[Math.floor(Math.random() * items.length)];
            el.style.left = Math.random() * 100 + "vw";
            el.style.fontSize = (Math.random() * 20 + 20) + "px";
            el.style.duration = (Math.random() * 2 + 2) + "s";
            document.body.appendChild(el);

            setTimeout(() => { el.remove(); }, 4000);
        }
    </script>
</body>
</html>
