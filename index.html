<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Good Morning Januri ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;600&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #0b132b; font-family: 'Poppins', sans-serif;
            overflow: hidden; touch-action: none;
        }

        /* Deep Night/Early Morning Sky Gradient */
        .sky {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #0b132b 0%, #1c2541 50%, #3a506b 100%);
            z-index: 1;
        }

        /* Twinkling Stars Background */
        .stars {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(white, transparent 10%),
                        radial-gradient(white, transparent 15%),
                        radial-gradient(white, transparent 8%);
            background-size: 200px 200px, 350px 350px, 150px 150px;
            background-position: 0 0, 40px 60px, 130px 270px;
            opacity: 0.4; animation: twinkle 4s infinite alternate;
            z-index: 2;
        }

        @keyframes twinkle { from { opacity: 0.2; } to { opacity: 0.5; } }

        /* Romantic Message Layer */
        .message-container {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; z-index: 5;
            pointer-events: none; /* Allows clicks to pass through to sky */
        }

        h1 { font-family: 'Dancing Script', cursive; font-size: 3.8rem; color: #ffbd59; margin: 0; text-shadow: 0 0 15px rgba(255,189,89,0.6); }
        p { color: #ffffff; font-size: 1.2rem; margin-top: 15px; letter-spacing: 1px; font-weight: 300; }
        .sub-text { font-size: 0.85rem; color: #ff80ab; margin-top: 30px; animation: pulse 1.5s infinite; font-weight: 600; }

        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        /* Floating Lantern Animation */
        .lantern {
            position: absolute; pointer-events: none; z-index: 3;
            font-size: 45px; filter: drop-shadow(0 0 15px #ffbd59);
            animation: floatUp 6s linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.6) translateX(0); opacity: 0; }
            10% { opacity: 1; transform: translateY(90vh) scale(1) translateX(5px); }
            50% { transform: translateY(50vh) scale(0.9) translateX(-15px); }
            100% { transform: translateY(-15vh) scale(0.5) translateX(10px); opacity: 0; }
        }
    </style>
</head>
<body onclick="launchLantern(event)" ontouchstart="launchLantern(event)">

    <div class="sky"></div>
    <div class="stars"></div>

    <audio id="loveSong" loop>
        <source src="Jaan Ban Gaye - Khuda Haafiz.mp3.mp3" type="audio/mpeg">
    </audio>

    <div class="message-container">
        <h1>Good Morning Januri ❤️</h1>
        <p>I Love You Begum Jeee</p>
        <div class="sub-text">TAP ANYWHERE ON THE SKY ✨</div>
    </div>

    <script>
        let musicStarted = false;

        function launchLantern(e) {
            // Play song on very first touch
            if (!musicStarted) {
                document.getElementById('loveSong').play().catch(e => {});
                musicStarted = true;
                document.querySelector('.sub-text').innerText = "Har tap aapki subah ko roshan karega... ✨";
            }

            // Get click/touch positions
            let clickX = e.clientX || (e.touches ? e.touches[0].clientX : window.innerWidth / 2);
            
            // Create Lantern element
            const lantern = document.createElement('div');
            lantern.classList.add('lantern');
            
            // Lantern emoji with a warm glowing lamp look
            lantern.innerText = '🏮'; 
            
            // Set starting position horizontally based on click, or slight random variance
            let variance = (Math.random() - 0.5) * 40;
            lantern.style.left = (clickX + variance) + 'px';
            lantern.style.bottom = '-50px';
            
            // Add a slight random duration so each lantern moves naturally
            let randomDuration = 5 + Math.random() * 3;
            lantern.style.animationDuration = randomDuration + 's';
            
            document.body.appendChild(lantern);

            // Remove lantern after animation ends to keep page clean
            setTimeout(() => {
                lantern.remove();
            }, randomDuration * 1000);
        }
    </script>
</body>
</html>
