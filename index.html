<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Love Wordle Quest 🧭</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #e0f2fe, #fef08a, #fbcfe8);
            --correct-color: #10b981;
            --present-color: #eab308;
            --absent-color: #64748b;
            --text-dark: #1e3a8a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-size: 300% 300%;
            animation: moveBG 20s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        @keyframes moveBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .game-container {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 25px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 2px solid white;
            text-align: center;
        }

        h1 {
            color: var(--text-dark);
            font-size: 24px;
            margin-bottom: 5px;
        }

        .clue-box {
            background: rgba(254, 240, 138, 0.4);
            border-left: 4px solid #eab308;
            padding: 12px;
            margin: 15px 0;
            border-radius: 4px 12px 12px 4px;
            font-size: 15px;
            color: #334155;
            font-weight: 600;
            text-align: left;
            line-height: 1.5;
        }

        .wordle-grid {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin: 20px auto;
            width: max-content;
        }

        .wordle-row {
            display: flex;
            gap: 5px;
        }

        .wordle-cell {
            width: 45px;
            height: 45px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            color: #1e293b;
            background: white;
            transition: all 0.3s ease;
        }

        .wordle-cell.correct {
            background-color: var(--correct-color);
            border-color: var(--correct-color);
            color: white;
        }

        .wordle-cell.present {
            background-color: var(--present-color);
            border-color: var(--present-color);
            color: white;
        }

        .wordle-cell.absent {
            background-color: var(--absent-color);
            border-color: var(--absent-color);
            color: white;
        }

        .keyboard-input-group {
            margin-top: 15px;
        }

        input[type="text"] {
            width: 70%;
            padding: 10px 15px;
            border: 2px solid #cbd5e1;
            border-radius: 50px;
            font-size: 16px;
            text-align: center;
            outline: none;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        input[type="text"]:focus {
            border-color: #ec4899;
        }

        .btn-guess {
            background: linear-gradient(135deg, #ec4899, #f43f5e);
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(236, 72, 153, 0.2);
        }

        .stage-indicator {
            font-size: 13px;
            font-weight: bold;
            color: #64748b;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .error-msg {
            color: #ef4444;
            font-size: 14px;
            margin-top: 8px;
            font-weight: 600;
            min-height: 20px;
        }

        .final-screen {
            display: none;
        }
    </style>
</head>
<body>

    <div class="game-container" id="game-view">
        <div class="stage-indicator" id="stage-track">Round 1 of 5</div>
        <h1>The Love Wordle Quest 🧭</h1>
        
        <div class="clue-box" id="clue-display">Loading clue...</div>

        <div class="wordle-grid" id="grid-display"></div>

        <div class="keyboard-input-group">
            <input type="text" id="guess-input" autocomplete="off" placeholder="Type word...">
            <br>
            <button class="btn-guess" onclick="submitGuess()">Submit Guess</button>
        </div>
        <p class="error-msg" id="error-display"></p>
    </div>

    <div class="game-container final-screen" id="success-view">
        <h2 style="color: #10b981; font-size: 26px; margin-bottom: 15px;">🎉 Ultimate Wordle Champion! 🎉</h2>
        <div style="font-size: 60px; margin-bottom: 20px;">🗺️❤️🏆</div>
        <p style="font-size: 18px; color: #1e3a8a; line-height: 1.6; font-weight: 600;">
            Kamaal kar diya Begum Sahiba! Saare secret codes crack kar liye! Pizza Max ki yaadon se lekar Umrah ke khubsurat khwab tak... Aapne sab dhoond liya. You are my whole world! Love You Forever! 💋
        </p>
    </div>

    <script>
        const stages = [
            {
                word: "ZINDAGI",
                clue: "Clue 1: Yeh mera aapke liye ek aur pyaari nishaani wala naam hai, meri poori pehchan aapsay hai. (7 Letters)"
            },
            {
                word: "LOVE",
                clue: "Clue 2: Hum dono ki meethee zubaan, ek doosre ke liye hamari sabse pehli aur aakhri pasand! (4 Letters)"
            },
            {
                word: "PIZZAMAX",
                clue: "Clue 3: Wahan jahan hum dono chai/coffee peene ya date par gaye the (Sirf 1 dafa gaye hain bas, yaad karein!). (8 Letters, Bina space ke likhein)"
            },
            {
                word: "UMRAH",
                clue: "Clue 4: Woh paak aur haseen jagah jahan hum dono ne ek sath ghumne jaane ka sacha plan banaya hua hai. (5 Letters)"
            },
            {
                word: "JAAN",
                clue: "Clue 5: The ultimate final word! Jo main aapko har saans ke sath bulata huun. (4 Letters)"
            }
        ];

        let currentStage = 0;
        let attempts = 0;
        const maxAttempts = 6;
        let stageGuesses = [];

        function initStage() {
            if(currentStage >= stages.length) {
                document.getElementById('game-view').style.display = 'none';
                document.getElementById('success-view').style.display = 'block';
                return;
            }

            attempts = 0;
            stageGuesses = [];
            const currentData = stages[currentStage];
            
            document.getElementById('stage-track').innerText = `Round ${currentStage + 1} of 5`;
            document.getElementById('clue-display').innerText = currentData.clue;
            document.getElementById('error-display').innerText = "";
            document.getElementById('guess-input').value = "";
            document.getElementById('guess-input').maxLength = currentData.word.length;

            renderGrid();
        }

        function renderGrid() {
            const gridContainer = document.getElementById('grid-display');
            gridContainer.innerHTML = "";
            const wordLength = stages[currentStage].word.length;

            for(let r = 0; r < maxAttempts; r++) {
                const row = document.createElement('div');
                row.className = 'wordle-row';
                
                for(let c = 0; c < wordLength; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'wordle-cell';
                    cell.id = `cell-${r}-${c}`;
                    
                    // If guess exists for this row
                    if(stageGuesses[r]) {
                        cell.innerText = stageGuesses[r][c] || "";
                    }
                    row.appendChild(cell);
                }
                gridContainer.appendChild(row);
            }
        }

        function submitGuess() {
            const inputField = document.getElementById('guess-input');
            const errorField = document.getElementById('error-display');
            const currentWord = stages[currentStage].word;
            const guess = inputField.value.trim().toUpperCase();

            errorField.innerText = "";

            if(guess.length !== currentWord.length) {
                errorField.innerText = `Pura ${currentWord.length} letters ka word likhein Begum!`;
                return;
            }

            stageGuesses.push(guess);
            colorRow(attempts, guess, currentWord);
            attempts++;
            inputField.value = "";

            if(guess === currentWord) {
                setTimeout(() => {
                    currentStage++;
                    initStage();
                }, 1500);
            } else if(attempts >= maxAttempts) {
                errorField.innerText = "Chances khatam! Dobara koshish karein.";
                setTimeout(() => {
                    initStage();
                }, 2000);
            }
        }

        function colorRow(rowIdx, guess, target) {
            const len = target.length;
            let targetLetterCounts = {};

            // Count target letters
            for (let i = 0; i < len; i++) {
                targetLetterCounts[target[i]] = (targetLetterCounts[target[i]] || 0) + 1;
            }

            let statuses = Array(len).fill('absent');

            // First pass: Mark correct (Green)
            for (let i = 0; i < len; i++) {
                if (guess[i] === target[i]) {
                    statuses[i] = 'correct';
                    targetLetterCounts[guess[i]]--;
                }
            }

            // Second pass: Mark present (Yellow)
            for (let i = 0; i < len; i++) {
                if (statuses[i] !== 'correct' && targetLetterCounts[guess[i]] > 0) {
                    statuses[i] = 'present';
                    targetLetterCounts[guess[i]]--;
                }
            }

            // Apply classes to UI with a slight flip delay
            for (let i = 0; i < len; i++) {
                const cell = document.getElementById(`cell-${rowIdx}-${i}`);
                cell.innerText = guess[i];
                
                setTimeout(() => {
                    cell.classList.add(statuses[i]);
                }, i * 100);
            }
        }

        // Initialize first loop
        initStage();
    </script>
</body>
</html>
