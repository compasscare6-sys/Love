<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Surprise For Anu ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
    }

    /* Game Card */
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 340px;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      color: #38bdf8;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 0.88rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .cell {
      aspect-ratio: 1;
      background: #334155;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.2s, transform 0.1s;
    }

    .cell:active {
      transform: scale(0.92);
    }

    .cell.start {
      border: 2px solid #38bdf8;
    }

    .cell.end {
      border: 2px solid #f43f5e;
      background: #4c0519;
    }

    .cell.solved {
      background: #0284c7;
      box-shadow: 0 0 15px #0284c7;
    }

    .arrow {
      display: inline-block;
      transition: transform 0.2s ease;
    }

    /* Rotations */
    .dir-0 { transform: rotate(0deg); }     /* Up ⬆️ */
    .dir-1 { transform: rotate(90deg); }    /* Right ➡️ */
    .dir-2 { transform: rotate(180deg); }   /* Down ⬇️ */
    .dir-3 { transform: rotate(-90deg); }   /* Left ⬅️ */

    /* Story Stage */
    .story-card {
      display: none;
      background: #1e293b;
      padding: 30px 20px;
      border-radius: 24px;
      border: 2px solid #f43f5e;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(244, 63, 94, 0.25);
      position: relative;
    }

    .teddy-stage {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 120px;
      margin: 20px 0;
      position: relative;
      padding: 0 20px;
    }

    .teddy {
      font-size: 3.8rem;
      transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
      position: absolute;
    }

    .male-teddy {
      left: 15px;
    }

    .female-teddy {
      right: 15px;
    }

    /* Animations */
    .angry {
      animation: shake 0.5s infinite alternate;
    }

    @keyframes shake {
      0% { transform: rotate(-5deg); }
      100% { transform: rotate(5deg); }
    }

    .walk-close {
      transform: translateX(160px);
    }

    .kiss-effect {
      position: absolute;
      font-size: 2rem;
      opacity: 0;
      animation: popHeart 0.8s ease forward;
    }

    @keyframes popHeart {
      0% { opacity: 0; transform: scale(0.5) translateY(0); }
      50% { opacity: 1; transform: scale(1.3) translateY(-20px); }
      100% { opacity: 0; transform: scale(1) translateY(-40px); }
    }

    .hug-male {
      transform: translateX(120px) rotate(10deg);
    }

    .hug-female {
      transform: translateX(-120px) rotate(-10deg);
    }

    /* Dialogue Box */
    .dialogue-box {
      min-height: 65px;
      background: #0f172a;
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #334155;
    }

    .typing-text {
      font-size: 1.05rem;
      font-weight: 600;
      color: #38bdf8;
      line-height: 1.4;
    }

    .final-msg {
      color: #f43f5e !important;
      font-size: 1.1rem !important;
    }
  </style>
</head>
<body>

  <!-- Game Screen -->
  <div class="card" id="game-card">
    <h1>Arrow Puzzle 🧩</h1>
    <p class="subtitle">Tap arrows to connect START (⬆️) to TARGET (🎯)</p>
    <div class="grid" id="grid"></div>
  </div>

  <!-- Story Animation Screen -->
  <div class="story-card" id="story-card">
    <div class="teddy-stage">
      <div class="teddy male-teddy" id="male-teddy">🧸</div>
      <div id="heart-anchor" style="position: absolute; left: 50%; top: 20%;"></div>
      <div class="teddy female-teddy angry" id="female-teddy">🧸🎀</div>
    </div>

    <div class="dialogue-box">
      <div class="typing-text" id="typewriter"></div>
    </div>
  </div>

  <script>
    // Extremely Simple 2x2 Grid (3 Arrows + 1 Target)
    // 0: Top-Left (Start), 1: Top-Right, 2: Bottom-Left, 3: Bottom-Right (Target)
    const board = [
      { dir: 0, winDir: 1 }, // Must point Right (➡️)
      { dir: 0, winDir: 2 }, // Must point Down (⬇️)
      { dir: 0, winDir: 1 }, // Must point Right (➡️)
      { isEnd: true }        // Target 🎯
    ];

    const gridEl = document.getElementById('grid');
    const gameCard = document.getElementById('game-card');
    const storyCard = document.getElementById('story-card');
    const maleTeddy = document.getElementById('male-teddy');
    const femaleTeddy = document.getElementById('female-teddy');
    const typeWriterEl = document.getElementById('typewriter');
    const heartAnchor = document.getElementById('heart-anchor');

    function renderBoard() {
      gridEl.innerHTML = '';
      board.forEach((item, i) => {
        const cell = document.createElement('div');
        cell.className = 'cell';

        if (i === 0) cell.classList.add('start');

        if (item.isEnd) {
          cell.classList.add('end');
          cell.innerHTML = '🎯';
        } else {
          cell.innerHTML = `<span class="arrow dir-${item.dir}">⬆️</span>`;
          cell.addEventListener('click', () => {
            item.dir = (item.dir + 1) % 4; // Rotate 90 degrees
            renderBoard();
            checkWin();
          });
        }
        gridEl.appendChild(cell);
      });
    }

    function checkWin() {
      // Direct path check:
      // Option A: Top-Left (Right) -> Top-Right (Down) -> Target
      // Option B: Top-Left (Down) -> Bottom-Left (Right) -> Target
      const pathA = (board[0].dir === 1 && board[1].dir === 2);
      const pathB = (board[0].dir === 2 && board[2].dir === 1);

      if (pathA || pathB) {
        // Highlight all cells
        Array.from(gridEl.children).forEach(c => c.classList.add('solved'));

        setTimeout(() => {
          gameCard.style.display = 'none';
          storyCard.style.display = 'block';
          startTeddyStory();
        }, 500);
      }
    }

    function typeText(text, speed = 45) {
      return new Promise(resolve => {
        typeWriterEl.innerHTML = '';
        let i = 0;
        const timer = setInterval(() => {
          typeWriterEl.innerHTML += text.charAt(i);
          i++;
          if (i >= text.length) {
            clearInterval(timer);
            resolve();
          }
        }, speed);
      });
    }

    function spawnHeart() {
      const heart = document.createElement('div');
      heart.className = 'kiss-effect';
      heart.innerHTML = '💋❤️';
      heartAnchor.appendChild(heart);
      setTimeout(() => heart.remove(), 900);
    }

    async function startTeddyStory() {
      await new Promise(r => setTimeout(r, 500));
      maleTeddy.classList.add('walk-close');

      await new Promise(r => setTimeout(r, 1300));

      spawnHeart();
      await new Promise(r => setTimeout(r, 600));

      await typeText("Bubu Guusaa khatam kardoo Jaan 🥺");

      await new Promise(r => setTimeout(r, 1200));

      femaleTeddy.classList.remove('angry');
      await typeText("Okay Bubu ✨");

      await new Promise(r => setTimeout(r, 800));

      spawnHeart();
      await new Promise(r => setTimeout(r, 600));

      maleTeddy.className = 'teddy male-teddy hug-male';
      femaleTeddy.className = 'teddy female-teddy hug-female';

      await new Promise(r => setTimeout(r, 1000));

      typeWriterEl.classList.add('final-msg');
      await typeText("I Love You janu ab tu teddy ne bhi maaf kardiya ap bhi kardoo apney lali koo Begum . ❤️🌹");
    }

    renderBoard();
  </script>
</body>
</html>
